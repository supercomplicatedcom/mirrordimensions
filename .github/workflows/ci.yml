name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default. No job here needs secrets, so pull requests from forks are safe.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256_URL: https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt

jobs:
  checks:
    name: Lint, types and boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - name: Import boundary (declared dependencies only; OS checks only in hostos/ and engine/)
        run: uv run python scripts/check_imports.py
      - name: SPDX licence headers
        run: uv run python scripts/check_spdx.py
      - name: Dependency licences
        run: uv run python scripts/check_licenses.py

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.13"]
        include:
          - os: ubuntu-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --locked --python ${{ matrix.python }}
      - name: mirror --help
        run: uv run mirror --help
      - run: uv run pytest

  portal:
    name: Portal (front-end tests, build, a browser test per screen)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/mirrordimensions/portal/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/mirrordimensions/portal/web/package-lock.json
      - run: uv sync --locked
      - run: npm ci
      - name: Licences of everything bundled into the front end
        run: uv run python ../../../../scripts/check_web_licenses.py
      - name: Types
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build (fonts and every asset bundled; no CDN)
        run: npm run build
      - name: Browsers for the tests
        run: npx playwright install --with-deps chromium
      - name: A browser test per screen, with an accessibility check
        run: npx playwright test
      - name: Keep the Playwright report when a test fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: src/mirrordimensions/portal/web/playwright-report
          retention-days: 7

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Install gitleaks (checksum verified)
        run: |
          set -euo pipefail
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${file}"
          curl -sSfL "${GITLEAKS_SHA256_URL}" -o checksums.txt
          grep " ${file}\$" checksums.txt | sha256sum --check --strict
          tar -xzf "${file}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f "${file}" checksums.txt gitleaks
      - name: Scan the full history
        # This branch's own history; other branches are scanned on their own runs
        # with their own allowlists.
        run: gitleaks git --redact --no-banner --verbose --log-opts="--full-history HEAD" .
      - run: uv sync --locked
      - name: Self-test (a fake credential is rejected by the hook and the scan)
        run: uv run python scripts/gitleaks_selftest.py

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Every commit is signed off by its author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_dco.py "$BASE" "$HEAD"

  engine-linux:
    name: Engine and sealed network (Linux, lima with KVM)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Enable KVM and install QEMU
        run: |
          set -euo pipefail
          ls -l /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo apt-get update -q && sudo apt-get install -y -q qemu-system-x86 qemu-utils
      - run: uv sync --locked
      - name: mirror engine setup
        run: uv run mirror engine setup --cpus 2 --memory 4 --disk 30
      - name: mirror engine check
        run: uv run mirror engine check
      - name: mirror init, build, up, doctor (the sealed network)
        run: |
          set -euo pipefail
          uv run mirror init "$RUNNER_TEMP/world" --seed 48214
          cd "$RUNNER_TEMP/world"
          # Built, so the scenario below has a world to run in (decision 0029: seed 48214's
          # world names its channels and repositories its own way).
          uv run --project "$GITHUB_WORKSPACE" mirror build
          uv run --project "$GITHUB_WORKSPACE" mirror up
          # The engine here is a VM nested in GitHub's own VM, on two CPUs: measured, the
          # gateway adds 8 to 12 ms on these runners (3.7 to 4.7 ms on an Apple Silicon
          # Mac). The 10 ms limit applies on workstations; this job allows 20 (owner's
          # decision, 2026-11-24, docs/platforms.md).
          uv run --project "$GITHUB_WORKSPACE" mirror doctor --latency-budget-ms 20
      - name: One scenario, end to end (an agent at work in a world named its own way)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/world"
          uv run --project "$GITHUB_WORKSPACE" mirror agent add "$GITHUB_WORKSPACE/examples/agents/scripted-good/agent.yaml"
          uv run --project "$GITHUB_WORKSPACE" mirror run rotate-leaked-token --agent scripted-good
      - name: mirror engine status
        if: always()
        run: uv run mirror engine status
      - name: Guest provisioning log (on failure)
        if: failure()
        run: |
          export LIMA_HOME="$HOME/.mirrordimensions/lima"
          "$HOME/.local/share/mirrordimensions/lima/2.3.0/bin/limactl" shell engine -- sudo tail -80 /var/log/cloud-init-output.log || true
      - name: mirror engine destroy
        if: always()
        run: uv run mirror engine destroy --yes

  microvm-linux:
    name: microVM runtime (Kata with Firecracker, Linux runner)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Enable KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm; containerd --version; ctr --version
      - run: uv sync --locked
      - name: Install Kata with Firecracker and run a microVM
        run: uv run python scripts/ci_microvm.py
