# SPDX-License-Identifier: Apache-2.0
name: Bug
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "If an agent can escape, reach outside, or act unrecorded, do not file it here: use private vulnerability reporting (SECURITY.md)."
  - type: textarea
    id: what
    attributes: {label: What happened, description: "Commands run and their output. Remove anything private."}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: What you expected}
    validations: {required: true}
  - type: input
    id: platform
    attributes: {label: Platform, description: "Output of: mirror --json status (host section), or OS, architecture and version"}
    validations: {required: true}
