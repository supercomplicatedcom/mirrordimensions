# A security camera. It reports events and metadata (motion, a badge match), never images.
type: camera
label: Camera
properties:
  recording: {type: bool, default: true}
  motion: {type: bool, default: false, sensor: true}
commands:
  stop_recording:
    consequence: safety-critical
    effect: {set: {recording: false}}
    causes: "Nothing in view is recorded until recording starts again."
  start_recording:
    consequence: reversible
    effect: {set: {recording: true}}
    causes: "The camera records again."
# Motion follows people passing a door on the camera's floor; each is an event with the
# badge it matched, never a picture (decision 0026, point 9).
behavior:
  - {property: motion, follows: motion}
events:
  - {on: stop_recording, emit: recording.stopped, to: [audit-log]}
telemetry: []
faults: [offline]
