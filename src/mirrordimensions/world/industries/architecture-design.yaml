# SPDX-License-Identifier: Apache-2.0
# Architecture and design: extends the general profile (decision 0028). Templates, never whole sentences (0029).
extends: general
slug: architecture-design
name: Architecture and design
group: Professional services and real estate
aliases: [architecture, architects, design studio, interior design, landscape architecture, design practice]
description: A design practice that delivers building and interior projects in phases, bills fees against progress and manages drawing sets with clients and consultants.
subscriptions: false  # leaves out the general themes about proration, dunning and payment retries
name_suffixes: [Architects, Design Studio, Architecture, Associates, Design Group, Studio, and Partners]
invoice_items: ["Design phase fee", "Reimbursable expenses"]
organization:
  head: Director of Technology
  it_admin: IT and CAD Manager
  teams:
    platform: {department: Technology, title: Platform Engineer}
    billing: {department: Project Accounting Systems, title: Software Engineer}
    data: {department: Practice Analytics, title: Data Engineer}
    support: {department: Studio Support, title: Design Technology Specialist}
    product: {department: Product, title: Product Manager}
    operations: {department: Practice Operations, title: Operations Analyst}
names:
  repos:
    billing-service: [project-billing, fee-invoicing, project-accounting, progress-billing]
    platform-docs: [studio-tech-handbook, tech-handbook, platform-runbooks, cad-standards]
    data-pipeline: [practice-loads, utilisation-etl, timesheet-pipeline, project-reporting]
    infra-config: [infra-config, studio-infrastructure, environment-config, deploy-settings]
    customer-portal: [client-portal, design-review-portal, client-review, project-portal]
    ops-scripts: [ops-scripts, plot-scripts, legacy-jobs, studio-admin-tools]
  channels:
    engineering: [engineering, tech, dev-team]
    incidents: [incidents, studio-alerts, prod-alerts]
    releases: [releases, deploys, shipping]
    billing-team: [project-accounting, billing-team, fee-systems]
    data-team: [practice-data, data-team]
    support: [studio-support, design-tech-help, support]
    leads: [leads, tech-leads]
systems:
  typical: [gitea, mattermost, Microsoft 365, Adobe Creative Cloud, Autodesk Construction Cloud, Autodesk Fusion, Procore, Smartsheet, revit, bluebeam, deltek]
  common: [Zoom, Okta, Box, Miro, Esri ArcGIS Online]
symbols:
  b_doc: ["project invoice", "progress invoice", "phase invoice", "reimbursables invoice", "consultant invoice", "retainer invoice", "final invoice", "credit memo"]
  b_customer: ["developer", "public agency", "healthcare", "hospitality", "residential", "retail", "university", "repeat"]
  b_since: ["last month", "this week", "since the {day} invoice run", "since the start of the phase", "for about {2-6} weeks"]
  b_who: ["the project managers", "the principals", "accounting", "the studio leads", "the business manager"]
  b_pwho: ["a project manager", "a client", "{person}", "the studio", "a principal"]
  b_ticket_noun: ["ticket", "request", "complaint", "escalation"]
  b_currency: ["CAD", "GBP", "AUD", "EUR", "USD"]
  b_taxkind: ["sales tax on services", "VAT", "GST", "withholding on consultants", "reverse-charge VAT"]
  b_region: ["Ontario", "Texas", "New York", "California", "Scotland", "Queensland", "Ireland", "Washington state"]
  b_provider_event: ["payment received", "payment failed", "wire returned", "refund completed", "ACH payment returned", "chargeback opened"]
  b_page: ["project invoices", "drawing sets", "the submittal log", "payment methods", "the project dashboard", "the RFI list", "review comments", "file transfers"]
  b_acct_size: ["{20-90} projects", "{200-900} sheets", "{15-60} users", "{40-300} RFIs", "{3-12} consultants"]
  c_customer: ["a developer client", "one of the larger accounts", "a school district client", "a repeat client", "a hospital client"]
  c_eng_area: ["the timesheet import", "the percent complete calc", "the plot queue", "the sheet index export", "the invoice run", "the file sync", "the markup export"]
  s_plan: ["a fixed fee contract", "a time and materials contract", "a percent of construction cost", "a retainer"]
  s_thing: ["the invoice run", "the plot queue", "the timesheet import", "the file sync", "the utilisation report", "the sheet export"]
  s_tool: ["the project system", "the accounting console", "the studio desk", "the ticket queue"]
  p_source: ["the timesheet export", "the licence server logs", "the consultant invoice feed", "the permit portal status feed", "the document control export", "the CRM opportunity list"]
  p_report: ["the utilisation report", "the project profitability report", "the backlog forecast", "the WIP schedule", "the fee burn report", "the resource plan"]
  p_table: ["projects", "timesheets", "phases", "drawing sets", "consultants", "expenses", "revisions", "time entries"]
  p_finance_ask: ["the business manager", "someone in finance", "the controller", "the studio accountant"]
  p_alert_name: ["disk usage on the file servers", "failed backups", "plot queue depth", "the timesheet load finishing late", "licence server errors"]
  p_secret_thing: ["the file storage access key", "the permit portal API key", "the payments provider token", "the warehouse service account key"]
  ad_phase: ["schematic design", "design development", "construction documents", "bidding", "construction administration", "concept design"]
  ad_deliv: ["a drawing set", "a submittal package", "an RFI response", "a permit submission", "a revision cloud set"]
  ad_file: ["the sheet index", "the title block", "the plot style", "the BIM export", "the xref list"]
  ad_when: ["before the review", "at the milestone", "on submission day", "at phase end", "before issue"]
  ad_rule: ["the permit authority rules", "the client's CAD standard", "the contract terms", "the firm's plot standard"]
issues:
  billing:
    - labels: [bug]
      let:
        phase: ["{ad_phase}", "{ad_phase}"]
        doc: ["{b_doc}"]
      title:
        - "Percent complete on {phase} {doc}s does not match the fee"
        - "{phase|cap} bills {2-9} percent over the fee"
        - "Cumulative billing passes the {phase} fee"
        - "{doc|cap} for {phase} ignores earlier percent complete"
        - "{phase|cap} invoice total to date is wrong"
        - "Why does {phase} bill past one hundred percent?"
      body:
        - ["{b_raised}, {b_scope}.", "Flagged by {b_who}, {b_scope}."]
        - ["billing/percent_complete.py {double counts/counts twice}.", "The prior amount is {added twice/counted again}.", "Earlier invoices are read {too soon/early}."]
        - ["{b_urgent}"]
      comments:
        - "{b_cm_repro} with a two phase project."
        - "Does a credit reset it?"
        - "{b_cm_check}, the fee comes from the contract."
    - labels: [bug, needs-decision]
      let:
        item: ["a consultant pass-through", "reimbursable travel", "printing costs", "a structural consultant", "a mechanical consultant", "a surveyor"]
      title:
        - "Markup applied twice on {item}"
        - "{item|cap} billed without the contract markup"
        - "Which markup applies to {item}?"
        - "{item|cap} appears on the wrong {b_doc}"
        - "Reimbursables markup is wrong for {item}"
      body:
        - ["Accounting found it at month end, {b_scope}.", "{b_raised}, {b_scope}."]
        - ["Markup rules differ by contract, {ad_rule} apply.", "Contracts differ, {code assumes/the code uses} one rule."]
        - ["Need a ruling from {p_finance_ask}."]
      comments:
        - "Is markup before or after tax?"
        - "{b_cm_plan} for a rule table per contract."
    - labels: [bug]
      let:
        what: ["timesheet hours", "billing rates", "write-offs", "rate changes mid-project"]
      title:
        - "{what|cap} on the time and materials {b_doc} are off"
        - "Hours on the {b_doc} differ from the timesheets"
        - "{what|cap} do not reach the invoice"
        - "Late timesheets miss the {day} invoice run"
        - "Time based invoice has old rates"
      body:
        - ["{b_raised} for {what}, {b_scope}.", "The studio leads noticed, {b_scope}."]
        - ["Rates are read {at approval/on approval}.", "Late entries post after the run."]
      comments:
        - "{b_cm_repro} {b_cm_stage}."
        - "Rate tables need effective dates."
    - labels: [bug, security]
      let:
        doc: ["{b_doc}"]
        scope: ["another client's", "a former client's", "a different project's"]
        item: ["a project invoice", "a fee proposal", "a consultant agreement", "a payment receipt"]
      title:
        - "{item|cap} opens {by/after} editing the URL id"
        - "Clients can see {scope} {doc}"
        - "Download link for {item} outlives access"
        - "Can one client open {scope} {doc} by id?"
      body:
        - ["{b_dlk_a} {b_dlk_b}.", "Tried it {b_cm_stage}, {b_dlk_c}"]
        - ["These files hold {fees/bank details}.", "Fee terms are commercially sensitive."]
        - ["{b_dlk_e}"]
      comments:
        - "{b_cm_fix_up} It adds a project check."
        - "Check the access log {for/on} the download route."
    - labels: [enhancement]
      let:
        doc: ["{b_doc}"]
        feature: ["a purchase order number", "a client cost code", "a fee summary by phase", "a project photo", "the permit number"]
      title:
        - "Show {feature} on every {b_doc}"
        - "Clients want {feature} on the {b_doc}"
        - "Add {feature} to the contract record"
        - "{feature|cap} on invoices, asked again"
      body:
        - ["{b_raised}, {b_scope}.", "Clients ask for this {again/most months}."]
        - ["{b_ft_a} {b_ft_b} {b_ft_c}.", "It needs {a new column/a form field}."]
      comments:
        - "Snapshot it per invoice."
        - "{b_cm_plan} for the backend, the form needs {person}."
  portal:
    - labels: [bug]
      let:
        what: ["a PDF drawing set", "a large IFC file", "a markup file", "a 3D view"]
        browser: ["{b_browser}"]
      title:
        - "Upload of {what} fails in {browser}"
        - "Clients cannot download {what} on {browser}"
        - "{what|cap} stalls at {10-99} percent"
        - "Review portal times out on {what}"
        - "{what|cap} opens blank for reviewers"
      body:
        - ["Clients wrote in, {b_pscope}.", "Project managers report it, {b_scope}."]
        - ["Files over {50-400} MB {fail/stall} {midway/at the end}.", "Large uploads time out {at/on} the proxy."]
      comments:
        - "A review deadline is near, {b_cm_plan}."
        - "Please attach the network log."
    - labels: [enhancement, needs-decision]
      let:
        ask: ["compare two drawing revisions", "resolve a markup comment", "approve a submittal online", "see the invoice history", "invite an outside consultant"]
        who: ["the project managers", "a principal", "a client", "the studio leads"]
      title:
        - "Let clients {ask}"
        - "{who|cap} wants clients to {ask}"
        - "Request: {ask} in the client portal"
        - "Can the portal let reviewers {ask}?"
      body:
        - ["{b_fr_a} {b_fr_b}", "Project managers raise this {often/again}."]
        - ["{b_fr_c}", "Contracts must agree {first/on scope}."]
        - ["{b_fr_d}"]
      comments:
        - "Who approves {for/on} the client side?"
        - "Legal should check {ad_rule}."
    - labels: [bug, enhancement]
      let:
        issue_kind: ["unlabelled markup tools", "low contrast on sheet names", "no keyboard route to comments", "an inaccessible revision picker"]
        area: ["the sheet viewer", "the comment panel", "the invoice page"]
      title:
        - "Accessibility: {issue_kind} on {area}"
        - "Reviewers with screen readers hit {issue_kind}"
        - "{issue_kind|cap} on {area}, audit finding"
        - "Public agency client flags {issue_kind}"
      body:
        - ["{b_ac_a} {b_ac_b}", "The audit flagged it on {area}."]
        - ["{b_ac_c}", "{b_ac_d}"]
      comments:
        - "{b_cm_sr} {b_cm_sr2}"
        - "{b_cm_addl} the viewer."
    - labels: [bug]
      let:
        step: ["the review invite", "the markup notification", "the submittal alert", "the password reset"]
      title:
        - "{step|cap} email arrives late or never"
        - "Clients do not get {step}"
        - "{step|cap} reaches the wrong reviewer"
        - "Consultants miss {step}"
      body:
        - ["{b_ml_a}", "Several studios reported it, {b_scope}."]
        - ["{b_ml_b} {b_ml_c}", "{b_ml_d}"]
      comments:
        - "{b_cm_deliv} {b_cm_spam}"
  docs:
    - labels: [docs, bug]
      let:
        page: ["docs/plot-standards.md", "docs/sheet-naming.md", "docs/revision-numbers.md", "docs/oncall.md"]
        stale: ["the old title block", "last year's plot style", "the retired file server", "the former CAD release"]
      title:
        - "{page} still lists {stale}"
        - "Handbook: {page} mentions {stale}"
        - "{stale|cap} in {page}"
        - "Update {page}, it names {stale}"
      body:
        - ["New joiners {got/were} confused by it.", "It confused a new engineer."]
        - ["Please check it against {ad_file} today."]
      comments:
        - "{b_cm_docs}"
        - "I will fix it {b_timeframe}."
    - labels: [docs, enhancement]
      let:
        topic: ["how drawing revisions are numbered", "the invoice run schedule", "how phases map to fees", "how file transfers are logged", "the plot queue", "how submissions are archived"]
      title:
        - "Write up {topic} for new engineers"
        - "Document {topic}"
        - "Where is {topic} documented?"
        - "Runbook for {topic}"
      body:
        - ["{b_dc_a} {b_dc_b}", "Accounting asks about it each quarter."]
        - ["{b_dc_c} {b_dc_d} {b_dc_e}"]
      comments:
        - "{b_cm_draft} the next retro."
        - "{b_cm_up} {b_cm_read2}"
    - labels: [docs, needs-decision]
      let:
        policy: ["file retention after project close", "who may issue drawings", "access for outside consultants", "archiving old BIM files", "naming of issued sets"]
      title:
        - "Decide how to write up {policy}"
        - "Handbook disagrees with practice on {policy}"
        - "Policy gap: {policy}"
      body:
        - ["Studios do it {differently/their own way}.", "Practice varies, {and/while} the page is silent."]
        - ["Someone must own the wording.", "Nobody owns the final wording."]
      comments:
        - "I draft, the CAD manager reviews."
  data:
    - labels: [bug, incident]
      let:
        what: ["utilisation report", "fee burn report", "WIP schedule", "backlog forecast"]
        delay: ["{2-4} hours", "about {40-90} minutes", "nearly {2-3} hours"]
      title:
        - "{what|cap} was stale before the {day} meeting"
        - "Nightly load finished {delay} late, {what} old"
        - "{what|cap} shows last week's timesheets"
        - "Principals saw an old {what}"
      body:
        - ["Principals noticed on {day}.", "A studio lead asked on {day} why nothing moved."]
        - ["The load ran {delay} behind, timesheets {came late/were late}."]
      comments:
        - "Can we alert at {6-8}am if unfinished?"
        - "{b_cm_check} when timesheets lock."
    - labels: [bug, data-quality]
      let:
        table: ["{p_table}"]
        field: ["phase code", "project number", "billing rate", "staff id", "fee budget"]
      title:
        - "{table|cap} has null {field} for {2-400} rows"
        - "Projects merged wrongly after a restructure"
        - "Duplicate {table} after the {day} load"
        - "{field|cap} is wrong for closed projects"
      body:
        - ["Found while building the profitability report.", "An analyst {saw/spotted} it in utilisation."]
        - ["It began when project numbers {changed/were reused}.", "The source system changed codes quietly."]
      comments:
        - "{b_cm_prof} {b_cm_prof2}"
        - "Is {field} fixed upstream or patched here?"
    - labels: [enhancement]
      let:
        source: ["{p_source}"]
        owner: ["the principals", "finance", "studio leads", "business development"]
      title:
        - "Load {source} into the warehouse"
        - "Should {owner} get {source} in the warehouse?"
        - "Add {source} to the practice reports"
        - "Backfill {source} for last year"
      body:
        - ["{owner|cap} wants it for resource planning.", "Asked for by {owner}, done by hand today."]
        - ["{b_ex_b} {b_ex_c}"]
      comments:
        - "Does it hold personal data? {Ask/Check with} HR."
        - "{b_cm_turn}."
  infra:
    - labels: [bug, incident]
      let:
        thing: ["the plot queue", "file sync", "the licence server", "the invoice run"]
      title:
        - "Alert for {thing} is not routed to the rota"
        - "Nobody was paged when {thing} failed"
        - "{thing|cap} failed overnight with no alert"
        - "Pager route missing for {thing}"
      body:
        - ["Found {ad_when} when the studio wrote in.", "Designers noticed before we did."]
        - ["The alert fires but pages nobody.", "The route {was lost/vanished} in a config change."]
      comments:
        - "{b_cm_fix_up} It restores the pager route."
        - "Add a missed-run alert {for/on} the invoice run."
    - labels: [security, enhancement]
      let:
        cert: ["the client portal certificate", "the file transfer certificate", "the plot server certificate", "the staging wildcard certificate"]
      title:
        - "Alert before {cert} expires"
        - "{cert|cap} expires in {2-9} days"
        - "Renew {cert}"
      body:
        - ["Nobody owned the renewal.", "The renewal date {is/sat} in one calendar."]
        - ["Expiry on {day} would hit {ad_when}."]
      comments:
        - "Add a {14/10} day warning to alerts."
        - "{b_cm_plan}"
    - labels: [bug, security]
      let:
        what: ["old BIM files", "project archives", "backups of the file server"]
      title:
        - "Backups: {what} are not covered"
        - "Retention for {what} is {7-30} days, not 35"
        - "Last restore of {what} was never tried"
      body:
        - ["Found {while/when} a studio wanted a file."]
        - ["{b_cm_old}", "A restore drill is overdue."]
      comments:
        - "{b_cm_plan} for a restore drill."
        - "Large files need their own retention."
chat:
  town-square:
    - root:
        - "{c_hey}: the studio is closed {c_soon}"
        - "reminder, no deploys on {day}, the {b_doc} run is on"
        - "{c_hey}, the all studio meeting is {day} at {time}"
        - "plotters are getting serviced {c_soon}"
        - "{c_hey|cap}: model lunch in {c_room} {c_soon}"
      replies:
        - ["{c_thanks}", "{c_ack}", "does that include the weekend crew?", "is the print room open?"]
        - ["{c_yes}, normal rota", "{c_no}, they are off too", "{c_idk}, ask {person}", ""]
    - root:
        - "welcome {person}, joining the design technology team {c_soon}"
        - "{c_hey}, {person} is our new project accountant"
        - "say hi to {person}, starting {c_soon} in the studio"
        - "new face on the data team: {person}"
        - "{person} joins {c_soon}, find them in {c_room}"
      replies:
        - ["welcome!", "{c_em} welcome {person}", "{c_thanks} for the intro"]
        - ["lunch at {s_lunch} to say hi?", ""]
    - root:
        - "month end close is {c_soon}, timesheets lock at {time}"
        - "heads up: invoicing starts {day}, submit timesheets early"
        - "{c_hey}, principals review fee burn {c_soon}"
        - "year end utilisation targets are out {c_soon}"
        - "timesheet lock is {day} at {time}"
      replies:
        - ["{c_ack}", "{c_thanks}", "can the lock wait a day?"]
        - ["not this time, invoices go out {c_soon}", "{c_no}, finance dates are fixed", ""]
  off-topic:
    - root:
        - "anyone seen a good building lately?"
        - "weekend plans? i am at {c_weekend}"
        - "went to {c_weekend}, the building was great"
        - "{c_pet} chewed my scale ruler again"
        - "lunch ideas? sick of {c_food}"
      replies:
        - ["not much, {c_weekend} probably", "{c_lol}", "{c_idk}"]
        - ["{c_food} then?", "try {c_place}", ""]
    - root:
        - "coffee machine in {c_room} is making a {weird/loud} noise"
        - "who keeps taking the pens from {c_room}?"
        - "the plotter ate my set, again"
        - "someone left a model {in/on the table in} {c_room}"
        - "anyone want the spare chair from {c_room}?"
      replies:
        - ["{c_lol}", "not me", "it was the intern"]
        - ["{c_idk}", ""]
    - root:
        - "{c_sport} after work {c_soon}, anyone in?"
        - "who is up for {c_sport} {c_soon}?"
        - "{c_hey}: {c_sport} on {day} at {time}"
        - "thinking of {c_sport} {c_soon}, join?"
        - "a few of us do {c_sport} on {day}"
      replies:
        - ["count me in", "{c_no}, working late", "{c_agree}"]
        - ["{time} works", ""]
  engineering:
    - root:
        - "can someone review my pr on {repo}? {c_patch}"
        - "pr for the percent complete calc, {c_patch}, review please"
        - "small change to {c_eng_area}, {c_patch}, who has time?"
        - "need eyes on a pr touching {c_eng_area}"
        - "{c_hey}, review wanted on {repo}: {c_patch}"
      replies:
        - ["{c_ack}, looking {c_soon}", "{c_when_eng}", "on it"]
        - ["left a few comments", "lgtm", ""]
    - root:
        - "{c_eng_area} is failing again on main"
        - "{c_ci_fail} fails after the {c_dep} bump"
        - "staging invoice run failed, {who changed/who touched} {c_eng_area}?"
        - "{c_ci_fail} is flaky again, rerun passes"
        - "heads up, {c_eng_area} broke the build for me"
      replies:
        - ["same here", "rerun it", "{c_idk}, checking"]
        - ["found it, reverting", "fixed in my branch", ""]
    - root:
        - "design question: should {c_eng_area} run before the invoice run?"
        - "lock timesheets {before/after} approval?"
        - "should plots wait {for/until} the sheet index?"
        - "who decides the order of {c_eng_area} and the export?"
        - "async or inline for {c_eng_area}?"
      replies:
        - ["after, approvals land at {time}", "i would queue it", "ask {person}, they wrote it"]
        - ["let's write it {up/down} in docs", "{c_agree}", ""]
  team:
    - root:
        - "standup in {5-15} minutes, {c_status} on my side"
        - "{c_hey}, standup moved to {time}"
        - "no standup {c_soon}, post updates here"
        - "standup notes: {c_status}, invoice run prep on track"
        - "quick standup in {5-15}, invoice run prep first"
      replies:
        - ["{c_ack}", "{c_thanks}", "{c_status} here"]
        - ["i am {c_pto}", ""]
    - root:
        - "who is covering the invoice run {c_soon}?"
        - "need a second person {for/on} month end billing"
        - "invoice run rota is open for {day}, who can take it?"
        - "{person} is {c_pto}, who watches the plot queue?"
        - "can someone shadow timesheet lock {on/this} {day}?"
      replies:
        - ["i can take it", "{c_no}, {c_pto}", "put me down"]
        - ["thanks, added to the rota", ""]
    - root:
        - "client escalation: {c_customer} cannot open the review portal"
        - "a principal escalated {issue}, {c_customer} is waiting"
        - "{c_customer} says the fee is wrong, {issue}"
        - "escalation from the studio about {issue_title}"
        - "project manager wants an update on {issue}"
      replies:
        - ["on it", "who is picking this up?", "{c_ack}"]
        - ["replied to them, will update", ""]
  support:
    - root:
        - "client says the invoice is {wrong/off}, {s_ticket}"
        - "designer cannot open the file server, {s_ticket}"
        - "plotter queue stuck again, {s_ticket}"
        - "{s_ticket}: consultant never got the invite"
        - "reviewer cannot see the markups, {s_ticket}"
      replies:
        - ["checking the logs", "can you share the project number?", "{c_ack}"]
        - ["it was a stale cache, cleared", "fixed it, please tell them", ""]
    - root:
        - "queue is at {20-90} open tickets, mostly file access"
        - "heads up, {5-30} tickets about plots since {time}"
        - "submission week queue is {20-90} deep, {slammed/buried}"
        - "tickets about the portal up {3-9}x since {day}"
        - "queue at {20-90}, nothing on fire"
      replies:
        - ["is it the file server again?", "{c_ack}", "can eng help triage?"]
        - ["{c_yes}, same folder", "no, just volume", ""]
    - root:
        - "client wants all revisions, {one pdf/a zip}?"
        - "can consultants get {read only/view} access?"
        - "pm needs old drawings, {who pulls/can we}?"
        - "client wants fees {split by phase/by phase}"
        - "consultant wants a transmittal log, {ok/can we}?"
      replies:
        - ["i can pull it", "{c_idk}, checking", "{c_yes}, a day or two"]
        - ["i will file a ticket", ""]
  incidents:
    - root:
