      body:
        - ['{b_raised}.', 'Spotted by a new hire.']
        - ['The page is out of date.', 'Nobody revised it.']
        - ['A search finds {2-9} pages.']
      comments:
        - '{b_cm_docs}'
        - '{b_g_note}'
        - I will fix them this week.
  ops:
    - labels: [bug]
      let:
        script: [check_licences.sh, clean_farm_scratch.sh, sync_part_numbers.py, archive_test_logs.sh]
      title:
        - '{Scripts/Ops}: {script} skips new product lines'
        - Is {script} still used?
        - '{script} fails on the new file share'
      body:
        - ['Found during a licence audit.', '{b_raised}.']
        - ['It predates the new farm.', 'Written for the old cluster.']
        - ['Nobody owns it now.', '']
      comments:
        - '{b_cm_check}'
        - '{b_g_who}'
        - Can we retire it?
chat:
  support:
    - root:
        - '{s_cust|cap} asks why {sc_part} shipped at the list price'
        - customer cannot download the datasheet{c_sep} {s_ticket}
        - '{s_cust|cap} wants the lot trace for {sc_lot}'
        - escalating to eng{c_sep} order status stale{c_sep} {s_ticket}
        - customer asks for the RMA status
      replies:
        - ['which part number?', 'which order?', 'do we have the lot?']
        - ['same on two orders', '{c_idk}{c_sep} asking them', 'order is in the case']
        - ['filing it now', 'linking {s_ticket}', 'i will check the price break']
    - root:
        - credit request{c_sep} {s_cust}{c_sep} {s_money}{c_sep} says {sc_unit} failed
        - distributor disputes the rebate for {sc_part}
        - customer wants a revised invoice for {day}
      replies:
        - ['do we have the failure report?', 'what do the terms say?']
        - ['sending the report', 'checking the lot']
        - ['apply it and note the case', 'finance approves over {s_money}']
    - root:
        - queue is at {20-90} open cases{c_sep} {sc_event} is busy
        - evening handover{c_sep} portal login issue open
        - heads up{c_sep} {s_cust} is angry{c_sep} waiting {2-5} days
      replies:
        - ['is there a known issue?', 'who updates the customer?']
        - ['eng has it{c_sep} update at {time}', 'banner is live']
        - ['{c_thanks}', '{c_ack}']
  team:
    - root:
        - standup in {5-15} minutes{c_sep} {c_status} on my side
        - who is picking up {issue}?
        - '{person} is {c_pto}{c_sep} who covers the order sync?'
        - freeze for {sc_event}{c_sep} who has the checklist?
        - anyone free to pair on {issue}?
      replies:
        - ['i can take it', 'on it after lunch']
        - ['{person} knows the erp', 'i did last time{c_sep} someone else']
        - ['{c_thanks}', '{c_ack}']
    - root:
        - quarter close is {c_soon}{c_sep} orders and rebates please
        - allocation list goes out {day}{c_sep} who checks the holds?
        - tapeout is {day}{c_sep} farm capacity ready?
      replies:
        - ['is the price list frozen?', 'what about distributors?']
        - ['{c_yes}{c_sep} from {time}', 'not yet']
        - ['{c_ack}']
    - root:
        - retro notes are in the handbook{c_sep} add yours
        - post incident review for {issue_title} is {day} at {time}
        - owners needed for review actions
      replies:
        - ['added mine', 'after the call']
        - ['{c_agree}', '{c_thanks}']
  engineering:
    - root:
        - can someone review my pr on {repo}? {c_patch}
        - the order sync is failing{c_sep} anyone changed the edi map?
        - '{c_ci_fail} fails on main after prices'
        - price breaks{c_sep} per line or per order?
        - yield load is slow{c_sep} anyone changed the parser?
      replies:
        - ['on it', 'looking now', 'give me ten']
        - ['no changes here', 'map changed {c_soon}']
        - ['per line{c_sep} contracts say so', 'per order{c_sep} simpler']
    - root:
        - how do we version price lists?
        - does the sync retry bad edi?
        - heads up{c_sep} freeze from {day}{c_sep} for {sc_event}
        - licence server is slow{c_sep} anyone else seeing it?
      replies:
        - ['by effective date', 'pin them per contract']
        - ['yes{c_sep} three times then parks it', '{c_no}{c_sep} it rejects the file']
        - ['{c_ack}', '{c_thanks}']
    - root:
        - local env broke after parser update
        - how do i replay orders locally?
        - is {c_tool} broken for anyone else?
      replies:
        - ['pin the old version', 'same here{c_sep} clear the cache']
        - ['replay script is in tools', 'ask {person}{c_sep} they wrote it']
  incidents:
    - root:
        - licence server down{c_sep} {2-9} teams blocked
        - farm queue is {2-5} hours long{c_sep} {sc_event} soon
        - alert{c_sep} test data ingest lag above {1-4} hours
        - the {p_alert_name} alert is flapping again
        - the file share is slow {s_since}
      replies:
        - ['who is incident lead?', '{sc_ask}?']
        - ['i have it{c_sep} comms at {time}', '{person} is on the bridge']
        - ['update at {time}', 'resolved{c_sep} watching']
    - root:
        - review for the licence outage is {day} at {time}
        - near miss{c_sep} wrong price list almost went live
        - quality asked for a root cause {day}
      replies:
        - ['i will draft it', 'who writes the customer note?']
        - ['apps lead{c_sep} by {day}', '{c_ack}']
    - root:
        - the foundry portal is down{c_sep} status page is red
        - the edi provider is flaky{c_sep} orders stuck
        - vendor vpn is down{c_sep} partner files stuck
      replies:
        - ['anything we can do?', 'any eta?']
        - ['no eta{c_sep} telling sales', 'failing over now']
  town-square:
    - root:
        - '{c_hey}: all hands {day} at {time}{c_sep} roadmap and results'
        - security training is due {c_soon}
        - welcome {person}{c_sep} joining design systems {c_soon}
      replies:
        - ['will it be recorded?', 'welcome!']
        - ['{c_yes}{c_sep} link after', '{c_thanks}']
    - root:
        - tapeout party is {c_soon}{c_sep} all welcome
        - site is closed {c_soon}{c_sep} on call rota unchanged
      replies:
        - ['is there food?', '{c_ack}']
        - ['{c_yes}', '{c_thanks}']
  off-topic:
    - root:
        - anyone watching the {match/game/race} {last night/tonight}?
        - lunch ideas? sick of {c_food}
        - '{c_pet} learned a new trick'
        - best book on {chip/hardware} history?
      replies:
        - ['{c_lol}', '{c_agree}']
        - ['the thai place', 'try the bakery']
    - root:
        - '{c_weekend} for me{c_sep} anyone else?'
        - best podcast for the commute?
        - cold in the lab again
      replies:
        - ['{c_lol}', 'send a photo']
        - ['{c_ack}']
  direct:
    - root:
