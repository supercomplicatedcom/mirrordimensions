        - quick question{c_sep} who owns the rebate job?
        - can you cover my on call {day} night?
        - got a minute{c_sep} order sync question?
      replies:
        - ['sure', 'in a call{c_sep} back at {time}']
        - ['{person} does', 'platform team']
        - ['{c_thanks}']
    - root:
        - handing over the rebate run{c_sep} out {s_soon}
        - did the customer note go out?
        - can you read the contract terms {c_sep} {day}?
      replies:
        - ['send me the notes', '{c_ack}']
        - ['{c_yes}{c_sep} {time}', 'not yet']
    - root:
        - can you cover customer escalations {day}?
        - did the status banner go live?
        - '{s_hey}{c_sep} can you join the distributor call?'
      replies:
        - ['sure', 'on it']
        - ['{c_yes}{c_sep} {time}', 'not yet']
    - root:
        - new portal release is {c_soon}{c_sep} checks done?
        - who has the allocation list for {day}?
      replies:
        - ['not yet', '{c_yes}']
        - ['in the handbook', 'ask {person}']
