        - licence servers slow{c_sep} starts taking {5-30} seconds
        - alert{c_sep} rebuffering above {5-30} percent
        - the {p_alert_name} alert is flapping again
        - cdn is returning errors {s_since}
      replies:
        - ['who is incident lead?', '{se_ask}?']
        - ['i have it{c_sep} comms at {time}', '{person} is on the bridge']
        - ['update at {time}', 'resolved{c_sep} watching']
