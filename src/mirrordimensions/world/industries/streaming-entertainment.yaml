        - ['no changes here', 'cdn config changed {c_soon}']
        - ['short cache only', 'no{c_sep} rights rules change']
    - root:
        - how do we version the ladder?
        - does the player retry licences?
        - heads up{c_sep} freeze from {day}{c_sep} for {se_event}
        - manifest service is slow{c_sep} anyone else seeing it?
      replies:
        - ['in git{c_sep} per release', 'pin it per title']
        - ['yes{c_sep} three times then errors', '{c_no}{c_sep} it fails over']
        - ['{c_ack}', '{c_thanks}']
    - root:
