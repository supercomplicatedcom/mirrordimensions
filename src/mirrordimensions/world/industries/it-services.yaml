        - client disputes {its_hours} on the {its_engagement} invoice
        - they say the {its_rate} was not in the contract
      replies:
        - ['do we have the signed {order/contract}?', 'what does the sla say?']
        - ['sending it over now', 'checking with the account manager']
        - ['ok, apply it and note the {b_ticket_noun}', 'finance has to approve over {s_money}']
