        - ['The {doc} is {off/short} by {its_hours}.', 'Approved entries are {not/never} on the {doc}.']
        - ['Entries after the cutoff {get/are} {skipped/ignored}.', 'It {looks like/seems} late entries are {dropped/lost}.', 'Late approvals seem to fall out.']
