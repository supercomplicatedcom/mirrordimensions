        - queue is at {20-90} open tickets, the oldest is {its_period}
        - 'evening handover: p2 open for {its_client_type}, rest quiet'
        - heads up, {its_sev} open for {its_site}, comms every 30 min
        - sla clock is wrong on {5-20} tickets again
