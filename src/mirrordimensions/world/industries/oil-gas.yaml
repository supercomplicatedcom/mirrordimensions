issues:
  billing:
    - labels: [bug]
      let:
        well:
          - '{og_well}'
        month:
          - '{og_month}'
        who:
          - '{b_who}'
      title:
        - Joint interest bill for {well} uses old decimals
        - Owner interest change missed on {month} bills
        - Partner shares on {well} exceed 100 percent
        - '{month} bills for {well}: stale decimal interests'
        - Why do two partners share {well} equally?
      body:
        -   - '{who|cap} reported it on the {month} statements.'
            - '{og_note}'
            - '{b_raised}, {b_scope}.'
        -   - Decimals are {og_stale} in billing/invoice.py.
            - The interest table is {og_stale}.
            - Mid-month changes arrive too late.
            - '{og_note}'
        -   - Shares on {well} add up to {80-130} percent.
            - Two partners show the same share.
            - The gap per partner is small.
            - '{og_note}'
        -   - Land changes arrive after the run.
            - Decimals post after bills are cut.
            - Signed interests are dated day {2-28}.
            - '{og_note}'
        -   - Needs a fix {og_fix_when}.
            - '{p_owner_ask}'
            - '{og_note}'
      comments:
        - '{b_cm_repro} with a copy of the {month} interests.'
        - The effective date is not honoured.
        - '{b_cm_plan}.'
        - Land says signed on day {2-28}.
    - labels: [bug]
      let:
        vol:
          - '{og_vol}'
        site:
          - '{og_site}'
        doc:
          - '{b_doc}'
      title:
        - Ticket volumes differ from allocation by {vol}
        - '{doc|cap} for {site} is {vol} off'
        - Billed volume differs from meters at {site}
        - Volume mismatch on {doc}s from {site}
      body:
        -   - Billing uses run ticket volumes.
            - The {doc} takes ticket volume.
            - '{og_note}'
        -   - The operator uses the allocated figure.
            - Allocation gives a different number.
            - '{og_note}'
        -   - The gap is about {vol} at {site}.
            - '{b_raised}, {b_scope}.'
            - '{og_note}'
        -   - They measure at different points.
            - Both numbers are right.
            - '{og_note}'
        -   - Not sure which the contract names.
            - '{og_note}'
            - '{b_urgent}'
      comments:
        - Contract names the custody transfer point.
        - '{og_cm_units}'
        - Bill tickets, then true up?
        - '{b_cm_ask_who}'
    - labels: [bug, needs-decision]
      let:
        tariff:
          - '{og_tariff}'
        n:
          - '{2-15}'
        who:
          - '{b_who}'
        question:
          - credits for rate changes
          - reissues after rate changes
          - disputed charges
      title:
        - '{tariff|cap} change hits barrels delivered earlier'
        - '{tariff|cap} change charged all month'
        - Rate change on {tariff} was not prorated
        - '{tariff|cap} rose on day {n}, bills use it all month'
      body:
        -   - The new rate began on day {n}.
            - The change took effect mid-month.
            - '{og_note}'
        -   - '{tariff|cap} is read by invoice date.'
            - Lookup uses the invoice date.
            - '{og_note}'
        -   - Early deliveries are overbilled.
            - '{b_raised}, {b_scope}.'
            - '{og_note}'
        -   - Rate table has no end date.
            - Billing keeps one rate per month.
            - '{og_note}'
        -   - Do we reissue or credit?
            - '{b_nd_a}'
            - '{og_note}'
      comments:
        - Credit memos are the cleaner path.
        - '{b_cm_repro} on a copy of the {og_month} data.'
        - Regulated tariffs go by delivery date.
    - labels: [enhancement]
      let:
        thing:
          - '{og_extra}'
        doc:
          - '{b_doc}'
      title:
        - Show {thing} as its own line
        - Customers ask for {thing} to be itemised
        - Add {thing} to the {doc}
        - '{thing|cap}: separate line, please'
      body:
        -   - '{b_raised}, {b_scope}.'
            - Dealers ask for {thing} monthly.
            - '{og_note}'
        -   - Today {thing} sits in the unit price.
            - The ledger has the line already.
            - '{og_note}'
        -   - The {doc} template needs a new field.
            - It needs a schema change.
            - '{og_note}'
        -   - '{b_fr_d}'
            - Needs a call on priority.
            - '{og_note}'
      comments:
        - Finance needs the split in exports.
        - Does the line carry {b_taxkind}?
        - '{b_cm_plan}'
    - labels: [bug]
      let:
        cause:
          - '{og_cause}'
      title:
        - Adjustment after {cause} lands in the wrong month
        - Credit memo after {cause} has today's date
        - '{cause|cap} adjusts the wrong period'
        - Adjustments for {cause} break monthly totals
      body:
        -   - After {cause} the line is booked today.
            - The correction carries today's date.
            - '{cause|cap} posts to the current month.'
            - The adjustment is dated today.
            - '{og_note}'
        -   - Revenue accounting wants the original period.
            - Ledger and statement name different months.
            - Finance expects the {og_month} period.
            - Month totals no longer tie out.
            - '{og_note}'
        -   - The date comes from {b_credit_path}.
            - Closed periods are not checked.
            - Posting ignores the period lock.
            - A closed month can still change.
            - '{og_note}'
        -   - '{b_urgent}'
            - '{p_owner_ask}'
            - '{og_note}'
            - '{p_priority}'
      comments:
        - Closed periods should reject the posting.
        - Auditors want a note on each.
        - '{b_cm_fix_up}'
    - labels: [needs-decision]
      let:
        kind:
          - '{b_customer}'
        who:
          - '{b_who}'
        question:
          - late fee waivers
          - interest disputes
          - grace days
      title:
        - Late interest for {kind} accounts on net 60
        - Which grace days apply to {kind} accounts?
        - Interest on overdue {kind} bills, one rule or several?
        - Policy for late fees on {kind} accounts
      body:
        -   - Late interest starts on day {30-45}.
            - Every account gets the same rule.
            - Interest runs from day {30-45} everywhere.
            - One rule covers all {kind} accounts.
            - '{og_note}'
        -   - Some contracts say net {45-60}.
            - The rule ignores contract terms.
            - '{kind|cap} contracts allow {45-60} days.'
            - Customers dispute fees inside their terms.
            - '{og_note}'
        -   - 'Options: follow each contract.'
            - Or keep one rule for all.
            - Or give a flat grace of {2-10} days.
            - Or waive fees under {20-90} dollars.
            - '{og_note}'
        -   - We could store terms per account.
            - '{b_nd_a}'
            - Terms could sit on the profile.
            - Collections could own the exceptions.
            - '{og_note}'
        -   - Needs a ruling from {b_who}.
            - '{b_nd_f}'
            - '{p_owner_ask}'
            - Hold fees for {kind} until decided.
            - '{og_note}'
      comments:
        - Per account terms need a backfill.
        - Legal should confirm the contracts.
        - Disputes doubled since the rule changed.
