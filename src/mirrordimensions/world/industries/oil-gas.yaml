          - '{og_ticket}'
        site:
          - '{og_site}'
      title:
        - '{ticket|cap} PDF has the wrong temperature correction'
        - '{ticket|cap} from {site} prints the wrong unit'
        - Downloaded {ticket} drops the gravity column
        - '{ticket|cap} PDFs are cut off'
      body:
        -   - A dealer said the {ticket} looked wrong.
            - '{b_raised}, {b_scope}.'
            - Support has {2-9} complaints about the {ticket}.
            - '{og_note}'
        -   - The template drops long rows.
            - Net and gross swap places.
            - Columns shift on long names.
            - Volume lines are cut off.
            - '{og_note}'
        -   - The portal screen is correct.
            - Only the file is wrong.
            - On screen the numbers match.
            - The printout differs from the screen.
            - '{og_note}'
        -   - '{b_cm_shot} {b_cm_shot2}'
            - '{p_priority}'
            - '{b_urgent}'
            - '{og_note}'
      comments:
        - Layout breaks on long product names.
        - '{b_cm_portal}, {b_cm_pdf}'
        - Template rounds to two places.
    - labels: [bug, security]
      let:
        what:
          - ship-to sites
          - delivery tickets
          - joint interest statements
      title:
        - Partner users can see {what} of other companies
        - '{what|cap} list is not filtered by company'
        - Users from one company see {what} of another
      body:
        -   - A partner user saw {what} they should not.
            - '{b_raised}, {b_scope}.'
            - '{og_note}'
        -   - The list filters by user only.
            - The lookup joins on site code.
            - '{og_note}'
        -   - '{b_dlk_c}'
            - '{og_note}'
        -   - '{b_dlk_e}'
            - '{og_note}'
      comments:
        - '{b_cm_repro}, no company filter in the query.'
        - '{b_cm_fix_up} It adds a company check.'
        - Check the access log for {2-9} weeks.
    - labels: [enhancement]
      let:
        who:
          - '{b_customer}'
      title:
        - Let {who} users download a year of statements
        - Bulk statement download for {who} accounts
        - '{who|cap} accounts want a yearly bundle'
      body:
        -   - '{b_raised}, {b_scope}.'
            - Audits need a year of statements.
            - '{og_note}'
        -   - Today each statement is one click.
            - Accounts with {b_acct_size} suffer most.
            - '{og_note}'
        -   - A background zip would do.
            - A mailed link would be enough.
            - '{og_note}'
        -   - '{b_fr_d}'
            - '{og_note}'
      comments:
        - Split the zip by quarter.
        - '{b_cm_plan}'
  docs:
    - labels: [docs, bug]
      let:
        page:
          - docs/measurement.md
          - docs/units.md
          - docs/allocation.md
      title:
        - '{Handbook/Docs}: {page} lists old standard conditions'
        - '{page} disagrees with the allocation job'
        - '{page|cap} gives a conversion factor we dropped'
      body:
        -   - '{page|cap} uses the old pressure base.'
            - The units table predates the migration.
            - '{og_note}'
        -   - A new joiner followed it, {og_vol} wrong.
            - '{p_noticed|cap}.'
            - '{og_note}'
        -   - The pipeline uses the contract basis.
            - Loader reads factors from a table.
            - '{og_note}'
        -   - '{p_owner_ask}'
            - '{og_note}'
      comments:
        - '{og_cm_units}'
        - Measurement owns numbers, we own pages.
        - Will update it after the {og_month} close.
    - labels: [docs, enhancement]
      let:
        thing:
          - a SCADA feed outage
          - a historian restore
          - a stuck allocation run
          - a failed nomination import
      title:
        - On-call guide needs steps for {thing}
        - Write up what to do about {thing}
        - Runbook for {thing}
      body:
        -   - The guide says nothing about {thing}.
            - Last time {thing} cost {2-5} hours.
            - '{og_note}'
        -   - On call asks the control room.
            - Steps live in one person's notes.
            - '{og_note}'
        -   - A short page would help.
            - Who to call, in what order.
            - '{og_note}'
        -   - '{p_priority}'
            - '{og_note}'
      comments:
        - Add the control room phone number.
        - Operations technology should review it.
        - Draft is in my branch.
    - labels: [docs, needs-decision]
      let:
        topic:
          - the contract basis for volumes
          - who signs off imbalance adjustments
          - the month end freeze for allocations
      title:
        - Decide how to write up {topic}
        - '{topic|cap}: handbook and practice disagree'
        - Where should {topic} live?
      body:
        -   - New people keep asking about {topic}.
            - The answer depends who you ask.
            - '{og_note}'
        -   - Accounting and the field disagree.
            - Nothing is written down.
            - '{og_note}'
        -   - '{b_dc_c} {b_dc_e}'
            - '{og_note}'
      comments:
        - Ask {p_finance_ask} for the official rule.
        - Can draft it once we agree.
  data:
    - labels: [bug, data-quality]
      let:
        tag:
          - '{og_tag}'
        site:
          - '{og_site}'
      title:
        - Gaps in {tag} at {site}
        - '{tag|cap} has no readings for {2-14} hours'
        - Missing historian data for {site}
        - Flat line on {tag} after the {day} restart
      body:
        -   - The historian has no values for {tag}.
            - The tag flat-lines for {2-14} hours.
            - '{og_note}'
        -   - The field gateway replays data late.
            - A link outage would explain it.
            - '{og_note}'
        -   - That day's volumes look low.
            - Allocation counted the gap as zero.
            - '{og_note}'
        -   - '{og_note}'
            - '{p_priority}'
      comments:
        - Gateway log shows reconnect at {time}.
        - Backfilled from the buffer, gap closed.
        - Can the load skip gap days?
    - labels: [bug, incident]
      let:
        delay:
          - '{p_delay}'
        day_name:
          - '{day}'
      title:
        - Allocation load finished {delay} late on {day_name}
        - Allocation not ready for the {day_name} close
        - '{day_name} volumes arrived {delay} after cutoff'
      body:
        -   - Allocation ended {delay} past the usual time.
            - The job ran {delay} longer than normal.
            - Done {delay} late on {day_name}.
            - Finish time slipped by {delay}.
            - '{og_note}'
        -   - The report was empty at opening.
            - Dashboards were stale at {time}.
            - The field saw yesterday's numbers.
            - Nominations were keyed from old data.
            - '{og_note}'
        -   - The slowest step was {p_table}.
            - The meter file import ran long.
            - Most time went to {p_table}.
            - The clean step looked fine.
            - '{og_note}'
        -   - '{p_noticed|cap}.'
            - Nothing was lost, only late.
            - No volumes were dropped.
            - '{og_note}'
        -   - We need the cause {og_fix_when}.
            - '{p_priority}'
            - '{p_owner_ask}'
            - '{og_note}'
      comments:
        - The operator's file arrived late again.
        - Start the load on file arrival?
        - Added row counts to the {day_name} log.
    - labels: [bug, data-quality]
      let:
        what:
          - '{og_ids}'
      title:
        - Duplicate {what} in the well header table
        - Same {what} on two wells in {p_table}
        - '{what|cap} collide after the land system merge'
      body:
        -   - Found {2-60} duplicate {what}.
            - A count shows {2-40} extra rows.
            - '{what|cap} repeat on {2-60} wells.'
            - The warehouse holds extra wells.
            - '{og_note}'
        -   - The merge kept both records.
            - Old and new rows both loaded.
            - Warehouse keys are not unique.
            - The merge never retired old ids.
            - '{og_note}'
        -   - Volumes get allocated twice.
            - Royalty figures may be doubled.
            - Allocation counts both rows.
            - Reports show inflated volumes.
            - '{og_note}'
        -   - '{p_priority}'
            - '{p_owner_ask}'
            - '{og_note}'
