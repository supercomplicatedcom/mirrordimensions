issues:
  billing:
    - labels: [bug]
      let:
        grp: ['{hp_group}']
        edi: ['{hp_edi}']
        path: ['{b_money_path}']
      title:
        - Group invoice headcount disagrees with {edi}
        - '{grp|cap} billed for {hp_wrongcount}'
        - Invoice for {grp} does not match enrollment
        - Premium total off after {hp_midmonth} for {grp}
        - Why is the headcount different from {edi}?
        - 'Billing count differs from {edi}, {grp}'
      body:
        -   - '{b_raised}, {b_scope}.'
            - '{b_raised} for {grp}, {b_scope}.'
        -   - Headcount is read in {path}.
            - The count comes from {path}.
        -   - '{hp_lead} it uses the file from {hp_cause}.'
            - It misses changes from {hp_cause}.
        -   - Account managers fix invoices {hp_hand}.
        -   - '{b_urgent}'
            - '{b_urgent} {b_offer}'
      comments:
        - '{b_cm_repro} with a group of {20-400} members.'
        - '{b_cm_check}, {path} may skip late changes.'
        - Finance needs it {hp_byclose}.
        - '{b_cm_later}'
    - labels: [bug, needs-decision]
      let:
        thing: ['a retro termination', 'a late enrollment', 'a retro effective date']
        path: ['{b_credit_path}']
      title:
        - Refund after {thing} credits the wrong month
        - Premium credit for {thing} is not prorated
        - Who decides refunds after {thing}?
        - '{thing|cap} leaves a balance on the invoice'
        - Retro adjustment for {thing} posts twice
        - Credit memo missing after {thing}
      body:
        -   - '{b_raised}, {b_scope}.'
        -   - '{hp_lead} retro changes are applied in {path}.'
        -   - '{hp_lead} only the current month is adjusted.'
            - Earlier months stay as billed.
        -   - '{hp_lead} finance corrects them {hp_hand}.'
        -   - Needs a decision from {b_who}.
      comments:
        - '{b_cm_hand}'
        - '{b_cm_ask_who}'
        - Regulators limit {hp_retro}.
    - labels: [bug]
      let:
        kind: ['marketplace', 'subsidized', 'grace period']
      title:
        - '{kind|cap} members terminated one month too early'
        - Grace period ignores {hp_latesub}
        - Termination date wrong for {kind} members
        - Non-payment notice sent {hp_inside}
        - '{kind|cap} members lose coverage {hp_afterlate}'
      body:
        -   - '{b_raised}, {b_scope}.'
        -   - The job counts days {hp_fromdue}.
            - Grace days start {hp_wrongdate}.
        -   - '{hp_lead} subsidy payments arrive after the cutoff.'
        -   - '{hp_lead} members call member services upset.'
        -   - '{b_urgent}'
      comments:
        - Compliance should look at this first.
        - '{b_cm_repro} {b_cm_stage}.'
        - '{b_cm_tell}'
    - labels: [bug]
      let:
        path: ['{b_cb_path}']
      title:
        - Lockbox payments left unapplied
        - ACH returns do not reverse {hp_thepremium}
        - Payments from {hp_group} do not match any invoice
        - Unapplied premium cash grows every day
        - Lockbox file loads with {2-9} errors
      body:
        -   - '{b_raised}, {b_scope}.'
        -   - Files are read in {path}.
        -   - '{hp_lead} remittance detail is often missing.'
            - Members pay without the invoice number.
        -   - '{hp_lead} accounting posts them {hp_hand}.'
        -   - '{b_cm_map}'
      comments:
        - '{b_cm_check}, the matching rules first.'
        - '{b_cm_repro} with last week''s file.'
        - '{b_cm_later}'
  portal:
    - labels: [bug]
      let:
        thing: ['effective date', 'plan name', 'copay amounts', 'group number']
      title:
        - ID card shows the wrong {thing}
        - Digital ID card out of date {hp_afterchange}
        - Members print cards with the old {thing}
        - ID card page is blank {hp_onphones}
        - Card for dependents shows the subscriber {thing}
      body:
        -   - '{b_pscope}.'
        -   - The card is built {hp_cached}.
            - Cards come from a nightly export.
        -   - '{hp_lead} a plan change {hp_norefresh}.'
        -   - '{hp_lead} providers deny claims for old data.'
      comments:
        - '{b_cm_clr2} {b_cm_cb}'
        - '{b_cm_repro} with a new dependent.'
        - '{b_cm_later}'
    - labels: [bug]
      let:
        doc: ['EOB', 'explanation of benefits', 'claim summary']
        browser: ['{b_browser}']
      title:
        - '{doc} download fails in {browser}'
        - Members cannot find their {doc}
        - '{doc} shows another member''s claims'
        - '{doc} PDF is blank for dependents'
        - Paper {doc} still mailed to portal-only members
      body:
        -   - '{b_pscope}.'
        -   - The file route skips {hp_check}.
            - The request returns a blank page.
        -   - '{hp_lead} it works for the subscriber only.'
        -   - '{b_pm_e}'
      comments:
        - '{b_cm_rolefix} {b_cm_roletest}'
        - Compliance has to hear about this.
        - '{b_cm_tell}'
    - labels: [bug, data-quality]
      let:
        thing: ['providers who left the network', 'wrong office addresses', 'doctors not taking patients']
      title:
        - Provider directory lists {thing}
        - Directory search shows {thing}
        - Members report {thing}
        - Directory update takes {2-9} weeks
        - Who owns directory accuracy?
      body:
        -   - '{b_pscope}.'
        -   - Provider data comes {hp_monthly}.
            - Updates reach the site every month.
        -   - '{hp_lead} regulators expect faster corrections.'
            - The directory rules set a deadline.
        -   - '{b_nd_b}'
      comments:
        - '{b_cm_ask_who}'
        - '{b_cm_plan}'
        - Provider relations keeps the master record.
    - labels: [bug, performance]
      let:
        thing: ['prior authorization status', 'claim status', 'eligibility check']
      title:
        - '{thing|cap} stuck on pending {hp_inportal}'
        - '{thing|cap} lookup times out'
        - Provider portal slow on {thing}
        - '{thing|cap} answers differ from the phone line'
        - Offices call us instead of using {thing}
      body:
        -   - '{b_pscope}.'
        -   - '{hp_lead} the lookup calls two systems.'
            - It waits on the claims system.
        -   - '{hp_lead} large offices see {b_slow}.'
        -   - '{hp_lead} they give up and phone.'
      comments:
        - '{b_cm_prof} {b_cm_prof2}'
        - '{b_cm_idx} {b_cm_fine}'
        - '{b_cm_later}'
  docs:
    - labels: [docs, bug]
      let:
        step: ['logging the receipt date', 'checking the filing deadline', 'sending the acknowledgement', 'notifying the member']
        page: ['the appeals runbook', 'the grievance guide', 'the escalation page']
      title:
        - '{page|cap} is missing a step: {step}'
        - '{page|cap} skips {step}'
        - Appeals process does not cover {step}
        - Add {step} to {page}
        - 'Docs: {page} out of date after the audit'
      body:
        -   - Found while preparing for {hp_audit}.
            - Raised during a review with compliance.
        -   - '{hp_lead} the page describes {hp_old} practice.'
        -   - '{hp_lead} nobody knows who owns it.'
        -   - '{hp_lead} a short ordered list would do.'
      comments:
        - '{b_cm_docs}'
        - Compliance should read the draft.
        - '{b_cm_up} {b_cm_read2}'
    - labels: [docs, security]
      let:
        thing: ['minimum necessary access', 'member authorization forms', 'breach notification', 'business associate onboarding']
      title:
        - Write down how we handle {thing}
        - Handbook never explains {thing}
        - Where is {thing} documented?
        - Document {thing} for new engineers
        - Privacy asks for a page on {thing}
      body:
        -   - Compliance asked, ahead of {hp_audit}.
            - '{hp_audit|cap} is coming, no page yet.'
        -   - '{hp_lead} only {person} knows the steps.'
            - The steps live in old emails.
        -   - '{hp_lead} a page with owners would do.'
      comments:
        - '{b_dc_e}'
        - Privacy should review the wording.
        - '{b_cm_draft} {day}.'
  data:
    - labels: [bug, data-quality]
      let:
        edi: ['{hp_edi}']
        cause: ['{hp_cause}']
      title:
        - Claims lag triangle shifts after {cause}
        - Incurred but not reported estimate jumps
        - Completion factors off after {cause}
        - Late claim files distort the triangle
        - Actuarial asks why paid claims moved
      body:
        -   - Actuarial asked, ahead of {hp_audit}.
        -   - Files {hp_late}.
        -   - '{hp_lead} the load stamps today''s date.'
            - The paid date is overwritten.
        -   - '{hp_lead} reserves depend on this report.'
      comments:
        - A received date would fix it.
        - '{b_cm_prof} {b_cm_prof2}'
        - '{b_cm_ask_who}'
    - labels: [bug, data-quality]
      let:
        edi: ['{hp_edi}']
        table: ['{p_table}']
      title:
        - Enrollment counts differ from {edi}
        - Member counts in {table} do not match the 834
        - Warehouse keeps terminated members active
        - Duplicate members after a subscriber change
        - Retro terminations missing from {table}
      body:
        -   - '{b_raised}, {b_scope}.'
        -   - '{hp_lead} retro changes arrive as full files.'
        -   - '{hp_lead} our load keeps {hp_latest}.'
        -   - Reports count members twice.
        -   - '{hp_lead} needs a decision from {b_who}.'
      comments:
        - '{b_cm_check}, the control totals first.'
        - A reconciliation job would help.
        - '{b_cm_plan}'
    - labels: [bug, data-quality]
      let:
        measure: ['readmission rate', 'breast cancer screening rate', 'diabetes care gaps', 'star rating measure']
