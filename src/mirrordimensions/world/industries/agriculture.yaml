# Agriculture and agritech: extends the general profile (decision 0028). Templates, never whole sentences (0029).
extends: general
slug: agriculture
name: Agriculture and agritech
group: Industry and infrastructure
aliases:
  - agritech
  - farming
  - agribusiness
  - crop production
  - grain and inputs
description: An agribusiness or agritech company that sells crop inputs and field services to growers, handles their grain, and bills members by season.
subscriptions: false  # leaves out the general themes about proration, dunning and payment retries
name_suffixes:
  - Farms
  - Agri
  - Cooperative
  - Growers
  - Agronomy
  - Grain
invoice_items:
  - Crop inputs
  - Field monitoring subscription
organization:
  head: Director of Technology
  it_admin: Systems Administrator
  teams:
    platform:
      department: Technology
      title: Platform Engineer
    billing:
      department: Grower Billing Systems
      title: Billing Systems Engineer
    data:
      department: Agronomic Data
      title: Data Engineer
    support:
      department: Grower Services
      title: Grower Services Representative
    product:
      department: Digital Agriculture
      title: Product Manager
    operations:
      department: Operations
      title: Operations Analyst
names:
  repos:
    billing-service: [billing-service, grower-billing, input-billing, settlement-service]
    platform-docs: [platform-docs, tech-handbook, harvest-runbooks, platform-handbook]
    data-pipeline: [data-pipeline, field-data-loads, agronomy-etl, yield-warehouse]
    infra-config: [infra-config, elevator-network-config, environments, platform-config]
    customer-portal: [customer-portal, grower-portal, member-portal, field-portal]
    ops-scripts: [ops-scripts, elevator-scripts, legacy-scripts, scale-scripts]
  channels:
    engineering: [engineering, dev, tech-chat]
    incidents: [incidents, harvest-alerts, outages]
    support: [support, grower-services, member-support]
    data-team: [data-team, field-data, agronomy-data]
