issues:
  billing:
    - labels: [bug]
      let:
        field:
          - '{ag_field}'
        doc:
          - '{b_doc}'
      title:
        - Per acre fee uses wrong acres, {field}
        - '{doc|cap} keeps old acreage after edits'
        - Acres on {doc}s do not match the map
        - Field monitoring billed on stale boundaries
      body:
        - - '{b_raised}, {b_scope}.'
          - '{ag_note}'
          - A grower disputed the acre count.
          - Finance noticed it on {field}.
        - - Billing reads acres from a snapshot.
          - The map edit never reaches billing.
          - Two fields share one boundary.
          - Acres are rounded to whole numbers.
          - '{ag_note}'
        - - The gap is about {2-9} percent.
          - Over a season that adds up.
          - Credits will be needed.
          - '{ag_note}'
        - - Needs a fix {ag_when}.
          - '{p_owner_ask}'
          - '{b_urgent}'
          - '{ag_note}'
      comments:
        - '{ag_cm}'
        - Acres come from the map service.
        - '{b_cm_plan}'
        - Credits may follow for earlier months.
    - labels: [bug]
      let:
        crop:
          - '{ag_crop}'
        unit:
          - '{ag_unit}'
      title:
        - Moisture shrink applied twice on {crop} settlements
        - Shrink on {crop} uses wet {unit}
        - Dockage is taken before the shrink
        - '{crop|cap} settlement is {2-9} percent short'
      body:
        - - '{b_raised}, {b_scope}.'
          - A grower compared ticket and check.
          - '{ag_note}'
        - - Shrink is taken at the scale.
          - Settlement takes it again.
          - Dockage uses the wrong base.
          - Wet and dry weights get mixed.
          - '{ag_note}'
        - - Net {unit} are lower than the ticket.
          - The difference is large on {crop}.
          - '{ag_note}'
        - - '{b_urgent}'
          - '{p_priority}'
          - '{ag_note}'
      comments:
        - '{ag_cm}'
        - Shrink factors come from the contract.
        - Rerun the batch after the fix.
        - '{b_cm_fix_up}'
    - labels: [bug, needs-decision]
      let:
        season:
          - '{ag_season}'
        who:
          - '{b_who}'
        question:
          - finance charge waivers
          - deferred term exceptions
          - prepay credit handling
      title:
        - Finance charges start before harvest due
        - Interest begins early on deferred terms
        - Deferred terms ignored for {season} orders
        - Finance charge on prepay credits
      body:
        - - Growers on deferred terms got charges.
          - '{b_raised}, {b_scope}.'
          - '{ag_note}'
        - - Terms say due after harvest.
          - Billing uses the invoice date.
          - The term code is not read.
          - '{ag_note}'
        - - Credit wants a rule.
          - '{b_nd_a}'
          - '{ag_note}'
        - - Needs a ruling from {b_who}.
          - '{b_nd_f}'
          - '{ag_note}'
      comments:
        - Terms are on the contract record.
        - Waive the charges, then fix.
        - Legal should review the notice.
    - labels: [bug]
      let:
        who:
          - '{b_customer}'
      title:
        - Patronage allocations miss the pool total
        - Rounding leaves cents on {who} allocations
        - Member dividends differ from the ledger
        - Allocation for {who} accounts is off
      body:
        - - Allocations add up to {2-9} dollars short.
          - Each member share is rounded alone.
          - '{b_raised}, {b_scope}.'
          - '{ag_note}'
        - - The pool is split by patronage.
          - Last member should take the cent.
          - '{ag_note}'
        - - Year end is close.
          - Auditors will ask.
          - '{ag_note}'
        - - '{p_owner_ask}'
          - '{p_priority}'
          - '{ag_note}'
      comments:
        - Give the remainder to the last.
        - '{ag_cm}'
        - Finance will review the totals.
    - labels: [enhancement]
      let:
        thing:
          - volume rebates
          - early pay discounts
          - loyalty tiers
      title:
        - Add {thing} to input invoices
        - Growers ask for {thing} on statements
        - Show {thing} as a separate line
      body:
        - - '{b_raised}, {b_scope}.'
          - Field sales ask for {thing} yearly.
          - '{ag_note}'
        - - Today {thing} are credit memos by hand.
          - The tiers live in a sheet.
          - '{ag_note}'
        - - It needs a rule table.
          - A schema change and template edit.
          - '{ag_note}'
        - - '{b_fr_d}'
          - '{ag_note}'
      comments:
        - Tiers reset each season.
        - '{b_cm_plan}'
        - Finance needs the same split.
    - labels: [needs-decision]
      let:
        who:
          - '{b_who}'
        question:
          - restricted use sales
          - applicator licence checks
          - label rate limits
      title:
        - Who checks {question} at order time?
        - Policy for {question}
        - Block orders when {question} fail?
      body:
        - - Some products need a licence.
          - Orders go through without a check.
          - '{ag_note}'
        - - '{b_nd_a}'
          - Rules differ by state.
          - '{ag_note}'
        - - Needs a ruling from {who}.
          - '{b_nd_f}'
          - '{ag_note}'
      comments:
        - Compliance should confirm the rules.
        - Store the licence number and expiry.
        - Hold the order, not the invoice.
  portal:
    - labels: [bug]
      let:
        field:
          - '{ag_field}'
      title:
        - Boundary upload fails for large shapefiles
        - Map edit for {field} does not save
        - Field boundaries land in wrong place
        - Upload times out on rural links
        - Boundary upload hangs at {2-99} percent
        - Shapefile for {field} is rejected
      body:
        - - '{b_raised}, {b_scope}.'
          - Growers upload from the field.
          - '{ag_note}'
        - - Large files time out.
          - The coordinate system is guessed.
          - '{ag_note}'
        - - Only some browsers fail.
          - '{ag_note}'
        - - '{b_urgent}'
          - '{p_priority}'
          - '{ag_note}'
      comments:
        - Compress before upload.
        - '{b_cm_repro} {b_cm_stage}.'
        - Ask for the projection first.
    - labels: [bug]
      let:
        crop:
          - '{ag_crop}'
      title:
        - Contract position for {crop} shows wrong bushels
        - Delivered amount lags the elevator
        - Open contract total ignores today's deliveries
      body:
        - - '{b_raised}, {b_scope}.'
          - Growers watch the position daily.
          - '{ag_note}'
        - - The page caches for {2-15} minutes.
          - Tickets post late at night.
          - '{ag_note}'
        - - The ticket list is right.
          - Only the total differs.
          - '{ag_note}'
        - - '{b_cm_shot}'
          - '{ag_note}'
      comments:
        - Refresh after the ticket import.
        - '{ag_cm}'
        - '{b_cm_plan}'
    - labels: [bug, performance]
      let:
        what:
          - yield maps
          - prescriptions
          - imagery layers
      title:
        - Download of {what} is slow on mobile
        - '{what|cap} fail on weak signal'
        - Maps never finish loading in cab
      body:
        - - Growers use the portal in cabs.
          - '{b_raised}, {b_scope}.'
          - '{ag_note}'
        - - The files are large.
          - The download restarts on drops.
          - '{ag_note}'
        - - Smaller tiles would help.
          - '{ag_note}'
        - - '{p_priority}'
          - '{ag_note}'
      comments:
        - Resume partial downloads.
        - Offer lower resolution first.
        - '{b_cm_plan}'
    - labels: [bug, security]
      let:
        what:
          - field maps
          - yield data
          - contracts
      title:
        - Advisors can open {what} of other growers
        - '{what|cap} list ignores the farm entity'
        - Wrong farm sees {what}
      body:
        - - A user saw {what} not theirs.
          - '{b_raised}, {b_scope}.'
          - '{ag_note}'
        - - The list filters by user only.
          - '{ag_note}'
        - - '{b_dlk_c}'
          - '{ag_note}'
        - - '{b_dlk_e}'
          - '{ag_note}'
      comments:
        - '{b_cm_repro}, no entity filter.'
        - '{b_cm_fix_up} It adds an entity check.'
        - Check the access log first.
  docs:
    - labels: [docs, bug]
      let:
        page:
          - docs/units.md
          - docs/shrink.md
          - docs/seasons.md
      title:
        - '{Handbook/Docs}: {page} lists old shrink factors'
        - '{page} disagrees with the settlement code'
        - '{page|cap} misses the new crop year'
      body:
        - - '{page|cap} describes last year.'
          - New crop terms are not listed.
          - '{ag_note}'
        - - A joiner used the old factor.
          - '{p_noticed|cap}.'
          - '{ag_note}'
        - - Grain accounting owns the rules.
          - The code is the truth.
          - '{ag_note}'
        - - '{p_owner_ask}'
          - '{ag_note}'
      comments:
        - Grain accounting will send the factors.
        - Will update it {ag_when}.
        - Link the contract template.
    - labels: [docs, enhancement]
      let:
        thing:
          - a scale gateway outage
          - a stuck settlement run
          - a ticket import failure
          - an elevator link loss
      title:
        - Runbook for {thing}
        - Harvest guide needs steps for {thing}
        - Write up what to do about {thing}
      body:
        - - The guide says nothing about {thing}.
          - Last harvest {thing} cost {2-6} hours.
          - '{ag_note}'
        - - On call asks the elevator manager.
          - Steps live in one person's notes.
          - '{ag_note}'
        - - A short page would help.
          - Who to call, in what order.
          - '{ag_note}'
        - - '{p_priority}'
          - '{ag_note}'
      comments:
        - Add the elevator phone numbers.
        - Operations should review it.
        - Draft is in my branch.
    - labels: [docs, needs-decision]
      let:
        topic:
          - unit conversions
          - who approves settlement reversals
          - the harvest change freeze
      title:
        - Decide how to document {topic}
        - '{topic|cap}: handbook and practice differ'
        - Where should {topic} live?
      body:
        - - New people keep asking about {topic}.
          - The answer depends who you ask.
          - '{ag_note}'
        - - Grain and finance disagree.
          - Nothing is written down.
          - '{ag_note}'
        - - '{b_dc_c} {b_dc_e}'
          - '{ag_note}'
      comments:
        - Ask {p_finance_ask} for the rule.
        - Can draft it once we agree.
  data:
    - labels: [bug, data-quality]
      let:
        weather:
          - '{ag_weather}'
      title:
        - Weather station gaps after {weather}
        - Stations report nothing for {2-30} hours
        - Rainfall totals look low
        - Station feed repeats old readings
      body:
        - - Several stations went quiet.
          - Readings repeat the last value.
          - '{ag_note}'
        - - Power or links failed in {weather}.
          - The vendor API rate limited us.
          - '{ag_note}'
        - - Spray advice used the stale data.
          - Agronomists noticed.
          - '{ag_note}'
        - - '{ag_note}'
          - '{p_priority}'
      comments:
        - Backfilled from the vendor archive.
        - Gateway log shows a drop at {time}.
        - Flag stale values, not zeros.
    - labels: [bug, data-quality]
      let:
        what:
          - yield monitor files
          - boundary files
          - prescription maps
      title:
        - Import of {what} drops fields
        - '{what|cap} from one vendor fail to parse'
        - Units differ across {what}
      body:
        - - Some files load, some fail.
          - Fields vanish after the import.
          - '{ag_note}'
        - - Vendors use different formats.
          - Metric and imperial files mix.
          - '{ag_note}'
        - - Yield totals look off.
          - Maps are shifted by a field.
          - '{ag_note}'
        - - '{p_priority}'
          - '{p_owner_ask}'
          - '{ag_note}'
      comments:
        - Added a unit column, nothing guessed.
        - Log files that fail to parse.
        - '{b_cm_plan}'
    - labels: [bug, incident]
      let:
        delay:
          - '{p_delay}'
        day_name:
          - '{day}'
      title:
        - Ticket load finished {delay} late on {day_name}
        - Settlement waited on the {day_name} load
        - Harvest tickets missing from morning run
      body:
        - - The load ended {delay} past the usual time.
          - Ticket tables were empty.
          - '{ag_note}'
        - - The slowest step was {p_table}.
          - Harvest volume doubled the files.
          - '{ag_note}'
        - - '{p_noticed|cap}.'
          - Nothing was lost, only late.
          - '{ag_note}'
        - - We need the cause {ag_when}.
          - '{ag_note}'
      comments:
        - Elevators sent files late again.
        - Start the run after the load?
        - Added row counts to the {day_name} log.
    - labels: [bug, data-quality]
      let:
        what:
          - field ids
          - farm entity ids
          - bin ids
      title:
        - Duplicate {what} after the merger
        - Same {what} on two accounts
        - '{what|cap} collide between two systems'
      body:
        - - Found {2-60} duplicate {what}.
          - A count shows extra rows.
          - '{ag_note}'
        - - The merge kept both records.
          - Keys are not unique here.
          - '{ag_note}'
        - - Acres are counted twice.
          - Invoices may reach the wrong farm.
          - '{ag_note}'
        - - '{p_priority}'
          - '{ag_note}'
      comments:
        - Deduplicated by key, counts match.
        - Add a uniqueness check to validate.
        - '{b_cm_plan}'
    - labels: [enhancement]
      let:
        who:
          - the agronomists
          - the grain desk
          - the credit team
      title:
        - Load satellite imagery summaries for {who}
        - '{who|cap} want field scores in the warehouse'
        - Weekly field health data for {who}
      body:
        - - '{who|cap} ask for weekly scores.'
          - They pull maps by hand.
          - '{ag_note}'
        - - Roughly {2-9} million rows a season.
          - Storage rises a little.
          - '{ag_note}'
        - - Needs a new feed and table.
          - Keep raw tiles for audit.
          - '{ag_note}'
        - - '{b_fr_d}'
          - '{ag_note}'
      comments:
        - Keep raw files, parse later.
        - '{b_cm_plan}'
  infra:
    - labels: [security, enhancement]
      let:
        cert:
          - '{p_cert_host}'
        days:
          - '{14-30}'
      title:
        - Alert before {cert} expires
        - '{cert|cap} expires in {days} days'
        - Renewal for {cert} is still by hand
      body:
        - - '{cert|cap} is due in {days} days.'
          - We nearly missed the last renewal.
          - '{ag_note}'
        - - Scales stop reporting if it lapses.
          - Growers see a browser warning.
          - '{ag_note}'
        - - '{p_noticed|cap}.'
          - '{ag_note}'
        - - Needs a real alert and owner.
          - '{p_owner_ask}'
          - '{ag_note}'
      comments:
        - Renewed {cert}, next expiry in {80-360} days.
        - Plan around the maintenance window.
        - Page on it in alerts.yaml.
    - labels: [bug, performance]
      let:
        site:
          - '{ag_site}'
      title:
        - Link at {site} drops during harvest
        - Elevator traffic stalls at {site}
        - Tickets from {site} arrive in bursts
      body:
        - - The link drops every {2-9} hours.
          - Rural lines saturate at harvest.
          - '{ag_note}'
        - - Buffers fill on the gateway.
          - Tickets arrive in late bursts.
          - '{ag_note}'
        - - Scale operators call us.
          - '{ag_note}'
        - - '{p_priority}'
          - '{ag_note}'
      comments:
        - Shortened keepalives on the gateway.
        - A second link is quoted.
        - Alert on flaps, not outages.
    - labels: [security, bug]
      let:
        what:
          - the sensor network
          - the scale network
          - the telematics gateway
      title:
        - Firewall rule into {what} is too wide
        - Review vendor access to {what}
        - Segmentation gap around {what}
      body:
        - - One rule allows more than needed.
          - An audit flagged broad access.
          - '{ag_note}'
        - - Only a few ports are used.
          - One source host would do.
          - '{ag_note}'
        - - Changes wait for a window.
          - '{ag_note}'
        - - '{p_owner_ask}'
          - '{ag_note}'
      comments:
        - Traffic logs show two ports used.
        - Keep the old rule off first.
    - labels: [bug, security]
      let:
        what:
          - application records
          - delivery tickets
          - settlement records
      title:
        - Backups of {what} keep fewer years than policy
        - Retention for {what} is {2-6} years
        - Restore of {what} was never tried
      body:
        - - Policy keeps {what} {7-10} years.
          - The archive prunes after {2-6} years.
          - '{ag_note}'
        - - The last restore was never tried.
          - Failures are logged, nobody paged.
          - '{ag_note}'
        - - Regulators can ask for old records.
          - Growers dispute tickets later.
          - '{ag_note}'
        - - '{p_priority}'
          - '{ag_note}'
      comments:
        - Raised retention, cost is small.
        - Scheduled a restore check.
chat:
  town-square:
    - root:
        - '{c_hey}: the elevator opens early {c_soon}.'
        - safety meeting {day} at {time}
        - reminder, no phones near the pit
        - '{c_hey}: the field day is {c_soon}'
        - open enrolment closes {c_soon}
      replies:
        - - '{c_ack}'
          - will be there
          - is it mandatory?
        - - '{c_thanks}'
          - ''
    - root:
        - welcome {person}, joining from agronomy
        - '{person} is our new analyst, starts {c_soon}'
        - say hi to {person}, new in grower services
        - '{c_hey}, {person} joins us {c_soon}'
      replies:
        - - welcome {person}!
          - '{c_em}'
        - - '{c_thanks}'
          - ''
    - root:
        - '{ag_weather} forecast for {c_soon}, expect noise'
        - harvest starts {c_soon}, change freeze from {day}
        - the {ag_season} rush is on, replies are slow
        - heads up, {ag_weather} at {ag_site}
