# Hospitals and health systems: extends the general profile (decision 0028). Templates, never whole sentences (0029).
extends: general
slug: hospitals
name: Hospitals and health systems
group: Health and life sciences
aliases:
  - hospital
  - health system
  - medical center
  - acute care
  - integrated delivery network
description: A hospital or health system that treats patients, bills payers and patients, and runs the clinical and revenue systems behind them.
subscriptions: false  # leaves out the general themes about proration, dunning and payment retries
name_suffixes:
  - Medical Center
  - Regional Hospital
  - Health System
  - Memorial Hospital
  - Community Hospital
  - University Hospital
invoice_items:
  - Inpatient facility charges
  - Outpatient procedure charges
organization:
  head: Chief Information Officer
  it_admin: Systems Administrator
  teams:
