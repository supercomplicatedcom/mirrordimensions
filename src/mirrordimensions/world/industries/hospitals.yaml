issues:
  billing:
    - labels: [bug]
      let:
        dept: ['{hs_dept}']
        payer: ['{hs_payer}']
        code: ['{hs_rej}']
        path: ['{b_cb_path}']
      title:
        - 837 claims rejected by {hs_chouse} for {code}
        - '{payer|cap} claims bounce with {code}'
        - Clearinghouse rejects {dept} claims, {code}
        - '{dept|cap} claims fail the scrubber over {code}'
        - Why do {dept} claims keep getting rejected?
        - 'Rejections up for {payer}: {code}'
      body:
        -   - '{b_raised}, {b_scope}.'
            - '{b_raised} on {dept} claims, {b_scope}.'
        -   - Claims are assembled in {path}.
            - The 837 file comes out of {path}.
        -   - The clearinghouse returns {code}.
            - Rejection reports show {code}.
        -   - '{hs_lead} the denials team reworks them {hs_rework}.'
            - Staff fix them {hs_rework}.
        -   - '{b_urgent}'
            - '{b_urgent} {b_offer}'
      comments:
        - '{b_cm_repro} with a {dept} claim for {payer}.'
        - '{b_cm_check}, {path} may drop the field.'
        - Scrubber rule for {code} needs an update.
        - '{b_cm_later}'
    - labels: [bug, data-quality]
      let:
        feed: ['{hs_feed}']
        dept: ['{hs_dept}']
        path: ['{b_money_path}']
      title:
        - Duplicate charges posted from {feed}
        - '{dept|cap} charges show up twice on {b_doc}s'
        - Charge capture double posts after {hs_replay}
        - Same charge billed twice for {dept}
        - 'Duplicate lines on {b_doc}s, {dept}'
        - Replay of {feed} creates duplicate charges
      body:
        -   - '{b_raised}, {b_scope}.'
            - Compliance flagged it, {b_scope}.
        -   - '{feed|cap} gets replayed after an interface restart.'
            - An interface restart replays {feed}.
        -   - '{path} has no check for repeats.'
            - Nothing in {path} dedupes by {hs_key}.
        -   - Patients get billed twice {hs_catch}.
            - Credits go out {hs_rework}.
        -   - '{b_urgent}'
      comments:
        - '{b_cm_kill}, same duplicate every time.'
        - A unique key on {hs_key} would help.
        - Do we owe {hs_who} a note?
        - '{b_cm_later}'
    - labels: [bug, needs-decision]
      let:
        thing: ['a good faith estimate', 'a price estimate', 'an uninsured estimate']
        dept: ['{hs_dept}']
      title:
        - '{thing|cap} for {dept} shows the wrong total'
        - No Surprises Act estimate off for {dept}
        - Estimate for {dept} leaves out the facility fee
        - Which fee schedule feeds {thing}?
        - '{thing|cap} differs from the final {b_doc}'
        - Self-pay estimates miss {dept} add-on charges
      body:
        -   - '{b_raised}, {b_scope}.'
        -   - The estimate uses {hs_oldfee}.
            - The schedule loads {hs_yearly}.
        -   - Add-on charges for {dept} are not included.
            - '{dept|cap} charges come from {hs_tbl2}.'
        -   - Compliance cares, since {hs_law} applies.
            - '{hs_law|cap} sets the rules {hs_here}.'
        -   - Needs a decision from {b_who}.
            - '{b_who|cap} should decide the rule.'
      comments:
        - '{b_cm_ask_who}'
        - Estimates must match what we bill.
        - '{b_cm_plan}'
    - labels: [bug]
      let:
        path: ['{b_cb_path}']
        payer: ['{hs_payer}']
      title:
        - 835 remittances leave unapplied cash
        - Auto-posting skips {payer} remittances
        - Unapplied payments pile up from {payer}
        - 835 files from {hs_chouse} only partly post
        - Payments from {payer} do not match any claim
        - Cash posting stalls on adjustment codes
      body:
        -   - '{b_raised}, {b_scope}.'
        -   - '{path} reads the 835 file.'
            - The remittance file is parsed in {path}.
        -   - '{hs_lead} some adjustment codes are not mapped.'
            - Unknown group codes {hs_fall}.
        -   - Unapplied balance is about {300-4800} dollars a day.
            - The unapplied total grows every day.
        -   - '{b_cm_map}'
      comments:
        - '{b_cm_repro} with a {payer} file from last week.'
        - Patient financial services posts them {hs_rework}.
        - '{b_cm_check}, the mapping table first.'
    - labels: [bug, needs-decision]
      let:
        doc: ['{b_doc}']
        customer: ['{b_customer}']
      title:
        - Financial assistance discount missing on {doc}s
        - Charity care adjustment missing on {customer} accounts
        - '{doc|cap}s ignore an approved {hs_aid}'
        - Sliding scale discount applied twice
        - Patients with assistance still get {doc}s
        - Who approves a late {hs_aid} application?
      body:
        -   - '{b_raised}, {b_scope}.'
        -   - The approval date lives {hs_acct}.
            - Approvals live in a separate table.
        -   - '{b_doc|cap}s from before that date keep {hs_oldbal}.'
            - Earlier balances are {hs_notrecalc}.
        -   - '{hs_lead} patients get collection letters by mistake.'
            - Some accounts went to collections.
        -   - '{b_who|cap} decides these {b_nd_b}.'
      comments:
        - Please hold {hs_letters} for these accounts.
        - '{b_cm_ask_who}'
        - '{b_cm_repro} with a {customer} account.'
  portal:
    - labels: [bug, security]
      let:
        who: ['a parent', 'a guardian', 'a proxy user']
        area: ['{b_page}']
      title:
        - Teen visits visible to {who} in the portal
        - Proxy access shows {area} for adolescent patients
        - Minor privacy setting ignored on {area}
        - '{who|cap} can see {hs_private}'
        - Adolescent confidentiality leaks through {area}
      body:
        -   - '{b_pscope}.'
            - Noticed by patient access, {b_pscope}.
        -   - The proxy view skips {hs_flag}.
            - Flagged visits still appear on {area}.
        -   - The check in {b_pay_path} never looks at it.
            - It needs a role check {hs_perproxy}.
        -   - '{hs_lead} reproduced with a test patient record.'
            - Reproduced in staging with {hs_chart}.
        -   - '{b_pm_e}'
      comments:
        - '{b_cm_rolefix} {b_cm_roletest}'
        - Compliance must hear about this {hs_today}.
        - '{b_cm_tell}'
    - labels: [bug]
      let:
        dept: ['{hs_dept}']
        step: ['paying a bill', 'setting up a payment plan', 'updating insurance']
      title:
        - Partial payment on a plan {fails/is rejected/errors out}
        - '{step|cap} in {hs_where} ends on a blank page'
        - Payment plan installment charged twice
        - Portal shows a balance {hs_afterpaid}
        - Paying part of a bill resets {hs_sched}
        - '{step|cap} fails for patients on {hs_payer}'
      body:
        -   - '{b_raised}, {b_scope}.'
        -   - Patients try {step} and get an error.
            - The page returns an error after {step}.
        -   - '{hs_lead} the balance lags the payment {hs_lag}.'
            - Posting runs {hs_batch}.
        -   - People think {hs_failed} and pay again.
            - '{b_db_c}'
        -   - '{b_urgent}'
      comments:
        - '{b_cm_repro} {b_cm_stage}.'
        - The callback arrives {hs_afterload}.
        - '{b_cm_clr2} {b_cm_cb}'
    - labels: [enhancement, docs]
      let:
        page: ['price transparency page', 'shoppable services list', 'machine-readable price file']
      title:
        - The {page} is out of date
        - Update the {page} for the new rate year
        - The {page} lists prices we no longer charge
        - Who owns the {page}?
        - Compliance asks for a fresh {page} update
      body:
        -   - Prices are keyed in {hs_yearly}.
            - Someone exports rates {hs_rework}.
        -   - '{hs_lead} the federal price transparency rule applies.'
            - CMS wants the file {hs_current}.
        -   - '{hs_lead} old rates are still live.'
            - Some {hs_codes} are missing.
        -   - '{hs_lead} it should come from {hs_cdm}.'
            - A job could rebuild it nightly.
      comments:
        - '{b_cm_ask_who}'
        - Legal reviews the file {hs_before}.
        - '{b_cm_plan}'
    - labels: [bug]
      let:
        thing: ['lab results', 'visit summaries', 'imaging reports']
      title:
        - '{thing|cap} do not show up {hs_where}'
        - '{thing|cap} appear days late'
        - Delay before {thing} reach patients
        - Portal release rules for {thing} look wrong
        - Patients ask where their {thing} are
      body:
        -   - '{b_raised}, {b_scope}.'
        -   - Results feed in from {hs_feed}.
            - The portal reads {hs_feed}.
        -   - '{hs_lead} a hold period applies before release.'
            - Some results wait for {hs_review}.
        -   - The rule differs by {hs_dept}.
            - It differs {hs_perunit}.
        -   - '{b_g_noblock}'
      comments:
