issues:
  billing:
    - labels: [bug]
      let:
        read:
          - '{ut_read}'
        cycle:
          - '{ut_cycle}'
        doc:
          - '{b_doc}'
      title:
        - Estimated bill sent despite valid read
        - '{doc|cap} after {read} uses the old usage'
        - '{cycle|cap} bills ignore reads received late'
        - Customers billed on estimates, reads exist
        - Bill after {read} overstates usage
      body:
        -   - '{b_raised}, {b_scope}.'
            - '{ut_note}'
            - Support has {3-40} calls about it.
            - '{b_pscope}'
        -   - The read arrives after the cutoff.
            - Reads land after the run starts.
            - The import runs after {ut_cycle} closes.
            - The run ignores late reads.
            - '{ut_note}'
        -   - The bill falls back to estimates.
            - Estimates come from last year.
            - Usage is guessed from history.
            - A true up follows next cycle.
            - '{ut_note}'
        -   - Customers see a swing next month.
            - Some pay twice what they used.
            - The next bill reverses it.
            - '{ut_note}'
        -   - Needs a fix {ut_when}.
            - '{p_owner_ask}'
            - '{b_urgent}'
            - '{ut_note}'
      comments:
        - '{ut_cm}'
        - The cutoff is hard coded.
        - '{b_cm_plan}'
        - Regulators care about estimate counts.
    - labels: [bug]
      let:
        rate:
          - '{ut_rate}'
        who:
          - '{b_who}'
      title:
        - Peak hours shift at clock change
        - Peak hours wrong for {rate} after the change
        - '{rate|cap} peak band is off'
        - Daylight saving breaks the {rate} bands
      body:
        -   - '{who|cap} reported it after the clock change.'
            - '{b_raised}, {b_scope}.'
            - Bills show peak use at night.
            - '{ut_note}'
        -   - Hours are stored in local time.
            - The band table uses fixed offsets.
            - Interval data is in UTC.
            - Bands ignore the daylight saving date.
            - '{ut_note}'
        -   - Usage lands in the wrong band.
            - One hour is priced wrong.
            - Peak and off-peak swap.
            - '{ut_note}'
        -   - Credits will be needed.
            - Finance wants a count of bills.
            - '{p_priority}'
            - '{ut_note}'
      comments:
        - '{ut_cm}'
        - Convert to UTC before banding.
        - Spring is the other direction.
        - '{b_cm_fix_up}'
    - labels: [bug]
      let:
        cause:
          - a rate change
          - a move out
          - a plan switch
          - a meter swap
      title:
        - Budget true up wrong after {cause}
        - Annual reconciliation off after {cause}
        - Level payment plan ignores {cause}
        - Budget billing balance is off by {20-300} dollars
      body:
        -   - Plan customers see odd balances.
            - '{b_raised}, {b_scope}.'
            - A customer disputed the true up.
            - '{ut_note}'
        -   - The amount is set yearly.
            - The plan ignores mid-year changes.
            - Reconciliation runs once a year.
            - '{ut_note}'
        -   - After {cause} the average is stale.
            - New rates never reach the plan.
            - Old usage skews the average.
            - '{ut_note}'
        -   - Needs a call from {b_who}.
            - '{p_owner_ask}'
            - '{p_priority}'
            - '{ut_note}'
      comments:
        - Recompute the average after each change.
        - '{ut_cm}'
        - Check regulator rules on plan changes.
    - labels: [bug]
      let:
        who:
          - '{ut_cust}'
      title:
        - Final bill ignores move out date
        - Move out billing charges {who} for extra days
        - Deposit refund missing from final bill
        - Final bill for {who} uses the old read
      body:
        -   - Final bills charge for extra days.
            - '{b_raised}, {b_scope}.'
            - A tenant complained to the regulator.
            - Care saw {2-9} final bills this week.
            - '{ut_note}'
        -   - Stop date is the request date.
            - Proration uses the next read date.
            - The deposit sits unapplied.
            - Reads after move out are used.
            - '{ut_note}'
        -   - Interest on deposits is unpaid.
            - Refunds are created by hand.
            - The final read is late.
            - Credits need a manual journal.
            - '{ut_note}'
        -   - '{b_urgent}'
            - '{p_owner_ask}'
            - '{ut_note}'
      comments:
        - Use the read date instead.
        - Deposits earn interest by regulation.
        - '{ut_cm}'
    - labels: [bug]
      let:
        rate:
          - the tiered water rate
          - the inclining block rate
          - the seasonal gas rate
        n:
          - '{28-33}'
      title:
        - '{rate|cap} charges the wrong tier on {n} day cycles'
        - Tier thresholds are not prorated for {n} day cycles
        - Water bills reach the top tier
        - Block rate breaks on odd cycles
      body:
        -   - Tiers assume a 30 day cycle.
            - Block sizes are never prorated.
            - A {n} day cycle breaks the block.
            - '{ut_note}'
        -   - Customers reach the upper tier early.
            - Short cycles undercharge, long ones overcharge.
            - '{b_raised}, {b_scope}.'
            - '{ut_note}'
        -   - Regulatory rules require proration.
            - The tariff says daily allowances.
            - '{ut_note}'
        -   - '{p_priority}'
            - '{p_owner_ask}'
            - '{ut_note}'
      comments:
        - Prorate by days, per the tariff.
        - '{ut_cm}'
        - Credits for last year may follow.
    - labels: [needs-decision]
      let:
        who:
          - '{b_who}'
        question:
          - disconnection notices
          - payment arrangement holds
          - medical hold letters
      title:
        - Notice sent during a payment plan
        - Who stops {question} during a plan?
        - Disconnection notices ignore active arrangements
        - Policy for {question} under hardship plans
      body:
        -   - A customer got a notice anyway.
            - '{b_raised}, {b_scope}.'
            - A regulator asked how it happened.
            - '{ut_note}'
        -   - The notice job reads balance only.
            - Plans live in a different table.
            - Holds are set by hand today.
            - '{ut_note}'
        -   - '{b_nd_a}'
            - Rules differ by regulator and season.
            - '{ut_note}'
        -   - Needs a ruling from {who}.
            - '{b_nd_f}'
            - '{ut_note}'
      comments:
        - Winter rules forbid disconnection.
        - Hold notices during an active plan.
        - Legal should review the wording.
  portal:
    - labels: [bug]
      let:
        unit:
          - '{ut_unit}'
        meter:
          - '{ut_meter}'
      title:
        - Usage chart shows the wrong day
        - Chart for {meter} drops a day of {unit}
        - Daily usage in {unit} does not match the bill
        - Interval chart is blank for some {meter}
      body:
        -   - '{b_raised}, {b_scope}.'
            - Customers compare the chart to bills.
            - '{ut_note}'
        -   - The chart groups by UTC day.
            - A missing interval blanks the day.
            - Hourly rows are summed twice.
            - '{ut_note}'
        -   - The bill is correct.
            - Only the chart differs.
            - '{ut_note}'
        -   - '{b_cm_shot} {b_cm_shot2}'
            - '{p_priority}'
            - '{ut_note}'
      comments:
        - Group by local day, not UTC.
        - '{b_cm_repro} on an account with {meter}.'
        - '{b_cm_plan}'
    - labels: [bug]
      let:
        storm:
          - '{ut_storm}'
        district:
          - '{ut_district}'
      title:
        - Outage report form fails on phones
        - Customers cannot report outages in {district}
        - Outage form times out during {storm}
        - Location lookup fails for rural addresses
      body:
        -   - The form timed out during {storm}.
            - Reports from {district} did not arrive.
            - '{ut_note}'
        -   - Address lookup is slow under load.
            - Rural addresses do not geocode.
            - '{ut_note}'
        -   - People phone instead, so queues grow.
            - Call wait times doubled.
            - '{ut_note}'
        -   - '{b_urgent}'
            - '{p_priority}'
            - '{ut_note}'
      comments:
        - Fall back to the account address.
        - Cache the lookup, it was hammered.
        - Load test it before storms.
    - labels: [bug]
      let:
        what:
          - autopay
          - budget billing
          - paperless billing
      title:
        - Customers charged twice after enrolling in {what}
        - '{what|cap} enrolment creates two debits'
        - Duplicate bank draft for {what}
      body:
        -   - '{b_raised}, {b_scope}.'
            - Two debits posted the same day.
            - '{ut_note}'
        -   - The enrolment runs the first draft.
            - The scheduler also drafts that day.
            - '{ut_note}'
        -   - Banks return some duplicates.
            - Refunds are manual.
            - '{ut_note}'
        -   - '{b_urgent}'
            - '{p_owner_ask}'
            - '{ut_note}'
      comments:
        - Check for a pending draft first.
        - '{b_cm_repro} {b_cm_stage}.'
        - Refund list is in the ticket.
    - labels: [enhancement, needs-decision]
      let:
        who:
          - '{ut_cust}'
      title:
        - Let {who} view usage without full access
        - Authorised contacts for {who} accounts
        - Landlords want usage for vacant units
      body:
        -   - '{b_raised}, {b_scope}.'
            - Property managers ask monthly.
            - '{ut_note}'
        -   - Only the account holder logs in.
            - Others call the centre.
            - '{ut_note}'
        -   - Privacy rules limit what to show.
            - Legal must approve the scope.
            - '{ut_note}'
        -   - '{b_fr_d}'
            - '{ut_note}'
      comments:
        - Read only roles are enough.
        - Ask regulatory affairs about consent.
  docs:
    - labels: [docs, bug]
      let:
        page:
          - docs/rate-codes.md
          - docs/bill-cycles.md
          - docs/tariffs.md
      title:
        - '{Handbook/Docs}: {page} lists retired rate codes'
        - '{page} disagrees with the billing tables'
        - '{page|cap} misses the new tariff'
      body:
        -   - '{page|cap} still shows the old codes.'
            - The new schedule is not listed.
            - '{ut_note}'
        -   - A joiner used a retired code.
            - '{p_noticed|cap}.'
            - '{ut_note}'
        -   - Rates and regulatory own the source.
            - The billing tables are correct.
            - '{ut_note}'
        -   - '{p_owner_ask}'
            - '{ut_note}'
      comments:
        - Rates will send the current list.
        - Will update it {ut_when}.
        - Link to the filed tariff instead.
    - labels: [docs, enhancement]
      let:
        thing:
          - a storm day call surge
          - a stuck bill run
          - an outage feed delay
          - a payment gateway outage
      title:
        - Runbook for {thing}
        - On-call guide needs steps for {thing}
        - Write up what to do about {thing}
      body:
        -   - The guide says nothing about {thing}.
            - Last time {thing} cost {2-6} hours.
            - '{ut_note}'
        -   - Whoever is on call improvises.
            - Steps live in one person's notes.
            - '{ut_note}'
        -   - A short page would help.
            - Who to call, in what order.
            - '{ut_note}'
        -   - '{p_priority}'
            - '{ut_note}'
      comments:
        - Include the control room number.
        - Customer care should review it.
        - Draft is in my branch.
    - labels: [docs, needs-decision]
      let:
        topic:
          - bill cycle calendars
          - the regulatory filing schedule
          - who approves bill reversals
      title:
        - Decide how to document {topic}
        - '{topic|cap}: practice and handbook differ'
        - Where does {topic} live?
      body:
        -   - New people keep asking about {topic}.
            - Nobody can say who owns {topic}.
            - '{ut_note}'
        -   - Billing and care answer differently.
            - Nothing is written down.
            - '{ut_note}'
        -   - '{b_dc_c} {b_dc_e}'
            - '{ut_note}'
      comments:
        - Ask {p_finance_ask} for the official rule.
        - Can draft it once we agree.
  data:
    - labels: [bug, data-quality]
      let:
        meter:
          - '{ut_meter}'
        feed:
          - '{ut_feed}'
      title:
        - Interval data gaps for {meter} in {ut_district}
        - '{feed|cap} dropped {2-40} hours of reads'
        - Missing reads from {meter} after the firmware update
        - Flat usage on {meter} since {day}
      body:
        -   - Interval data has gaps for {meter}.
            - '{feed|cap} skipped hours overnight.'
            - Reads stop after midnight.
            - '{ut_note}'
        -   - The head-end resends late.
            - A firmware update changed the format.
            - The network link dropped.
            - '{ut_note}'
        -   - Bills fall back to estimates.
            - Usage charts show zero.
            - Estimates are rising.
            - '{ut_note}'
        -   - '{ut_note}'
            - '{p_priority}'
      comments:
        - Backfilled from the head-end buffer.
        - Gap is closed for {2-9} meters.
        - Can the load flag gaps?
    - labels: [bug, incident]
      let:
        delay:
          - '{p_delay}'
        day_name:
          - '{day}'
      title:
        - Usage load finished {delay} late on {day_name}
        - Bill run waited on the {day_name} load
        - Meter data not ready for {ut_cycle}
      body:
        -   - The load ended {delay} past the usual time.
            - Usage was empty at the run.
            - '{ut_note}'
        -   - The slowest step was {p_table}.
            - The interval import ran long.
            - Storm volume doubled the files.
            - '{ut_note}'
        -   - '{p_noticed|cap}.'
            - Nothing was lost, only late.
            - '{ut_note}'
        -   - We need the cause {ut_when}.
            - '{p_owner_ask}'
            - '{ut_note}'
      comments:
        - Head-end sent files late again.
        - Start the run after the load?
        - Added row counts to the {day_name} log.
    - labels: [bug, data-quality]
      let:
        what:
          - service points
          - premise ids
          - meter serial numbers
      title:
        - Duplicate {what} after the system merge
        - Same {what} on two accounts
        - '{what|cap} map to the wrong premises'
      body:
        -   - Found {2-80} duplicate {what}.
            - A count shows {2-40} extra rows.
            - '{what|cap} repeat on {2-60} premises.'
            - The warehouse has extra {what}.
            - '{ut_note}'
        -   - The merge kept both rows.
            - Keys are not unique here.
            - The old ids were never retired.
            - Both systems loaded the same rows.
            - '{ut_note}'
        -   - Usage is attributed twice.
            - Bills may reach the wrong account.
            - Totals are inflated.
            - Reports show the premises twice.
            - '{ut_note}'
        -   - '{p_priority}'
            - '{ut_note}'
            - '{p_owner_ask}'
      comments:
        - Deduplicated by key, counts match.
        - Add a uniqueness check to validate.
        - '{b_cm_plan}'
    - labels: [enhancement]
      let:
        who:
          - the grid planners
          - the water quality team
          - the conservation program
          - the regulatory team
      title:
        - Load {ut_feed} into the warehouse for {who}
        - '{who|cap} want hourly usage in the warehouse'
        - Weather data for {who}
      body:
        -   - '{who|cap} ask for hourly data.'
            - '{who|cap} want hourly readings.'
            - Daily totals are too coarse for {who}.
            - '{who|cap} need interval data.'
            - '{ut_note}'
        -   - They pull exports by hand today.
            - Someone copies numbers to a sheet.
            - Today it is a manual query.
            - '{ut_note}'
        -   - Roughly {2-9} million rows a month.
            - About {20-90} thousand meters involved.
            - Storage rises a little.
            - '{ut_note}'
        -   - Needs a new feed and table.
            - Partition by day to stay cheap.
            - Raw values plus an hourly view.
            - '{ut_note}'
        -   - '{b_fr_d}'
            - '{p_priority}'
            - '{p_owner_ask}'
            - '{ut_note}'
      comments:
        - Keep raw values, derive hourly.
        - '{b_cm_plan}'
    - labels: [bug, data-quality]
      let:
        report:
          - '{p_report}'
        unit:
          - '{ut_unit}'
      title:
        - '{report|cap} mixes {unit} with other units'
        - Unit mismatch in {report}
        - '{report|cap} and billing disagree on usage'
      body:
        -   - One feed sends {unit}.
            - The report adds two unit types.
            - '{ut_note}'
        -   - Totals are off by a factor.
            - The gap is {2-9} percent.
            - '{ut_note}'
        -   - '{p_owner_ask}'
            - '{ut_note}'
      comments:
        - Added a unit column, nothing guessed.
        - '{ut_cm}'
  infra:
    - labels: [security, enhancement]
      let:
        cert:
          - '{p_cert_host}'
        days:
          - '{14-30}'
      title:
        - Alert before {cert} expires
        - '{cert|cap} expires in {days} days'
        - Renewal for {cert} is still by hand
      body:
        -   - '{cert|cap} is due in {days} days.'
            - '{cert|cap} lapses in {days} days.'
            - We nearly missed the last renewal.
            - Renewal is on someone's calendar only.
            - '{ut_note}'
        -   - Customers cannot pay if it lapses.
            - Meters stop reporting if it lapses.
            - The portal shows a browser warning.
            - Autopay would fail overnight.
            - '{ut_note}'
        -   - '{p_noticed|cap}.'
            - Warnings go to chat only.
            - The last renewal was by {person}.
            - '{ut_note}'
        -   - Needs a real alert and owner.
            - '{p_owner_ask}'
            - '{p_priority}'
            - '{ut_note}'
      comments:
