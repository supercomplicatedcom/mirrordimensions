          - freight surcharge
          - expedite fee
          - pallet charge
          - crating charge
          - hazmat fee
        path:
          - billing/surcharges.py
          - billing/freight.py
          - billing/pricing.py
      title:
        - '{surcharge|cap} missing from {doc}s for {customer} orders'
        - Why is the {surcharge} zero on {customer} {doc}s?
        - '{surcharge|cap} not added {after/since} the carrier rate update'
        - '{customer|cap} {doc}s are short the {surcharge}'
        - '{doc|cap} for {customer} shipments leaves out the {surcharge}'
      body:
        -   - '{md_raised}, {md_scope}.'
            - '{md_raised} on {customer} orders, {md_scope}.'
        -   - '{surcharge|cap} comes from {path}, which {skips/ignores} orders with {a split/a partial} shipment.'
            - The rate lookup in {path} {skips/ignores/misses} {surcharge} {for/on} {customer} orders.
        -   - '{md_urgent}'
            - '{md_urgent} {b_offer}'
      comments:
        - '{b_cm_repro} with {one/the} {customer} order split over two trucks.'
        - "{b_cm_check}, I think {path} reads last year's table."
        - Finance wants the {surcharge} backfilled on open {doc}s.
        - '{b_cm_fix_up}'
    - labels:
        - bug
      let:
        edi:
          - 810 invoice
          - 810 credit memo
          - 810 invoice batch
        partner:
          - a distributor
          - an OEM customer
          - a tier one account
          - a dealer
        reason:
          - unit of measure not recognised
          - ship-to code missing
          - duplicate invoice number
          - tax total does not match lines
          - PO line not found
          - wrong currency code
        field:
          - unit of measure
          - ship-to code
          - PO line number
          - tax total
          - currency code
          - packing slip reference
      title:
        - '{edi} rejected by {partner}: {reason}'
        - Invoices keep failing at {partner} with {reason}
        - '{edi|cap} errors, {reason}'
        - 'Rejected {edi}: {reason}'
        - '{partner|cap} bounces our {edi}, {reason}'
      body:
        -   - '{md_raised}, {md_scope}.'
            - '{partner|cap} sent back {2-40} documents {b_since}.'
        -   - The mapping in {md_edi_path} {drops/mangles/misreads} the {field}.
            - Our mapping handles the {field} in a way {partner} does not accept.
        -   - The {997/824} says {reason}.
            - Rejects arrive as {997/824} messages in the {inbox/outbound folder}.
        -   - '{b_urgent}'
            - Their payables team {will not/cannot} pay a rejected invoice.
      comments:
        - "{b_cm_repro} using last week's {edi} file."
        - '{b_cm_ask_who}'
        - Their spec says {field} is mandatory since January.
        - '{b_cm_fix_up} It adds {a/one} validation {step/check} {before/prior to} send.'
    - labels:
        - bug
      let:
        doc:
          - '{b_doc}'
        customer:
          - '{b_customer}'
        item:
          - '{md_item}'
        uom:
          - per hundred
          - per thousand
          - per foot
          - per kilogram
          - per set
          - per pallet
        path:
          - billing/pricing.py
          - billing/uom.py
          - billing/lines.py
      title:
        - '{doc|cap} line totals {off/wrong} by a factor on {uom} parts'
        - Pricing treats {uom} as per each
        - Parts sold {uom} come out wrong on {doc}s
        - '{uom|cap} pricing: line total is {off/wrong/out}'
        - Extended price wrong for parts priced {uom}
      body:
        -   - '{md_raised}, {md_scope}.'
            - Seen on {item} for {customer} accounts, {md_scope}.
        -   - Conversion in {path} {ignores/drops} the price basis.
            - The price table stores {uom} but {path} {multiplies/reads} it as per each.
        -   - Divide by the {price basis/pricing unit} first.
            - Unit price comes after that.
        -   - '{b_urgent}'
      comments:
        - '{b_cm_repro} with {item}, quantity {50-900}.'
        - Which {doc}s went out? I can {run/write} one.
        - '{b_cm_fix_up}'
        - Credit notes {will be/are} needed for {the ones/those} that shipped.
    - labels:
        - needs-decision
      let:
        who:
          - '{b_who}'
        question:
          - tooling charges on repeat orders
          - partial shipments against a blanket order
          - milestone invoices before final acceptance
          - freight on rush orders
          - returns of non-conforming parts
          - price changes on open blanket releases
        option_a:
          - bill it once up front
          - invoice each shipment as it leaves
          - invoice at the agreed milestone
          - follow each contract
          - bill at cost
          - apply the current price
        option_b:
          - spread it {over/across} the first orders
          - invoice once at the last shipment
          - invoice on factory acceptance
          - charge a flat rate
          - decide per account
          - keep the order date price
      title:
        - '{question|cap}: who decides?'
        - Decide how we bill {question}
        - 'Open question: {question}'
        - Policy for {question}?
      body:
        -   - '{b_nd_a}, {b_nd_b} {b_nd_c}'
            - '{b_who|cap} handles this {b_nd_b} {b_nd_c}'
        -   - '{option_a}, or {option_b}.'
            - 'Options: {option_a}; {option_b}; or leave it as is.'
        -   - '{b_nd_f}'
            - Finance should {sign off/decide} before anyone codes it.
      comments:
        - '{b_cm_lean} {option_a}.'
        - '{b_cm_ask_who}'
        - Needs a ruling from {b_who}.
