          - a program change
          - a contract renewal
          - a part revision
          - a new release
        path:
          - billing/price_down.py
          - billing/pricing.py
          - billing/contracts.py
      title:
        - '{customer|cap} {doc}s skip the annual price-down'
        - Price-down of {pct} percent missing on {customer} releases
        - Why is price-down zero on {customer} {doc}s?
        - Price-down gets applied twice on {doc}s
        - Annual price reduction not applied after {event}
      body:
        -   - '{au_raised}, {au_scope}.'
            - '{au_raised} on {customer} accounts, {au_scope}.'
        -   - '{path} loads the table {once/each} year.'
            - The lookup in {path} is {stale/keyed} by part.
        -   - Contract says {pct} percent, effective at January.
            - The agreement sets {pct} percent from {the/each} release date.
        -   - '{au_urgent}'
      comments:
        - '{b_cm_repro} with a {customer} order.'
        - '{b_cm_check}, the effective date may be wrong.'
        - Finance wants the open {doc}s corrected.
        - '{b_cm_fix_up}'
    - labels:
        - bug
      let:
        doc:
          - '{b_doc}'
        customer:
          - '{b_customer}'
        reason:
          - quantity differs from receipt
          - ASN number missing
          - part number not found
          - duplicate invoice number
          - release number mismatch
      title:
        - '{customer|cap} rejects {doc}: no matching receipt'
        - '{doc|cap} bounced, receipt differs from ASN'
        - '{customer|cap} portal refuses our {doc}: {reason}'
        - Invoice rejected, {reason}
      body:
        -   - '{au_raised}, {au_scope}.'
            - Their payables team sent back {2-40} documents.
        -   - The ASN says {2-9}0 pieces but we bill {2-9}5.
            - We bill the {order/booked qty}, not the ASN.
        -   - Their system matches {ASN numbers/on ASN} first.
            - Three way match needs {the ASN/the receipt} to agree.
        -   - '{au_urgent}'
      comments:
        - "{b_cm_repro} using last week's ASN."
        - '{b_cm_ask_who}'
        - Their spec requires an ASN number.
        - '{b_cm_fix_up} It bills from shipped quantity.'
    - labels:
        - bug
      let:
        pack:
          - '{au_pack}'
        doc:
          - '{b_doc}'
        customer:
          - '{b_customer}'
        days:
          - '{3-9}'
          - '{10-30}'
        path:
          - billing/packaging.py
          - billing/racks.py
          - billing/returns.py
      title:
        - '{pack|cap} charges missing on {doc}s'
        - Returnable {pack}s not billed after shipment
        - '{pack|cap} deposit never credited on return'
        - Packaging line missing from {customer} {doc}s
      body:
        -   - '{au_raised}, {au_scope}.'
            - Logistics counted {2-9}0 {pack}s unbilled.
        -   - '{path} reads racks {at/after} shipment.'
            - The rack count comes from {path}, not the ASN.
        -   - Returns post {days} days late.
            - Credits arrive after the statement closes.
      comments:
        - '{b_cm_repro} with a {pack} shipment.'
        - '{b_cm_ask_who}'
        - How long do deposits stay open?
    - labels:
        - needs-decision
      let:
        who:
          - '{b_who}'
        question:
          - warranty chargebacks
          - price changes on open releases
          - expedite freight
          - customer-owned tooling
          - recall campaign parts
          - scrap at the customer line
        a:
          - pass the cost on
          - credit the full amount
          - split the cost
          - bill at actual cost
          - apply the new price
          - dispute it in writing
        b:
          - absorb it
          - credit only the parts
          - agree a flat fee
          - bill at standard cost
          - keep the old price
          - accept the claim
      title:
        - '{question|cap}: who rules?'
        - Decide how to handle {question}
        - Open question on {question}
        - Policy for {question}?
      body:
        -   - '{b_nd_a}, {b_nd_b} {b_nd_c}'
            - '{b_who|cap} handles {question} {b_nd_b} {b_nd_c}'
        -   - 'Options: {a}, or {b}.'
            - We could {a}; or {b}; or keep it as is.
        -   - '{b_nd_f}'
            - Quality and finance should {sign off/agree} first.
      comments:
        - '{b_cm_lean} {a}.'
        - '{b_cm_ask_who}'
        - Needs a ruling from {b_who}.
