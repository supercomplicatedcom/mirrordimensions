# SPDX-License-Identifier: Apache-2.0
# Retail stores and chains: extends the general profile (decision 0028). Templates, never whole sentences (0029).
extends: general
slug: retail-stores
name: Retail stores and chains
group: Retail and commerce
aliases:
  - retail
  - retail chain
  - stores
  - brick and mortar
  - department store
  - specialty retail
description: A chain of physical stores that runs registers, store inventory and pricing, and invoices trade accounts and special orders alongside its loyalty and store card programs.
subscriptions: false  # leaves out the general themes about proration, dunning and payment retries
name_suffixes:
  - Stores
  - Mercantile
  - Outfitters
  - Home Goods
  - Supply Co
  - Trading Company
invoice_items:
  - Trade account purchases
  - Delivery and installation
organization:
  head: Head of Store Technology
  it_admin: IT Support Manager
  teams:
    platform: {department: Store Technology, title: Platform Engineer}
    billing: {department: Retail Finance Systems, title: Systems Engineer}
    data: {department: Merchandising Analytics, title: Data Engineer}
    support: {department: Customer Care, title: Customer Care Associate, lead: Customer Care Manager}
    product: {department: Digital Commerce, title: Product Manager}
    operations: {department: Store Operations, title: Store Operations Analyst}
names:
  repos:
    billing-service: [trade-billing, account-invoicing, billing-service, special-orders]
    platform-docs: [store-tech-handbook, platform-docs, store-runbooks, team-docs]
    data-pipeline: [sales-loads, merch-data-pipeline, data-pipeline, store-etl]
    infra-config: [infra-config, store-network-config, env-config, pos-config]
    customer-portal: [account-portal, trade-portal, customer-portal, shop-account-web]
    ops-scripts: [ops-scripts, store-scripts, legacy-scripts, pos-tools]
  channels:
    engineering: [engineering, store-tech, dev, systems]
    incidents: [incidents, store-outages, prod-incidents, pos-alerts]
    releases: [releases, pos-releases, deploys, shipping]
    billing-team: [billing-team, retail-finance-systems, trade-billing, billing-eng]
    platform-team: [platform-team, store-platform, platform, infra]
    data-team: [data-team, merch-analytics, data, reporting]
    support: [customer-care, support, care-team, cs-team]
    leads: [leads, tech-leads, managers, team-leads]
systems:
  typical: [github, slack, manhattan active, blue yonder, workday, ukg pro, adyen, salesforce, square pos]
  common: [square, avalara, zendesk, snowflake, oracle netsuite]
symbols:
  b_doc: [invoice, credit memo, statement, special order deposit receipt, layaway receipt, delivery receipt]
  b_customer: [trade account, contractor, school, corporate buyer, loyalty member, store card holder, nonprofit, franchise partner]
  b_who: [store operations, customer care, finance, the trade desk, the district managers]
  b_pwho: [customer care, a store manager, "{person}", the trade desk, finance]
  b_ticket_noun: [ticket, case, complaint, escalation]
  b_page: [orders, special orders, statements, loyalty points, store card, saved lists, returns]
  b_acct_size: ["{30-200} saved lists", "{15-80} users", "over {500-3000} order lines", "{5-40} delivery addresses"]
  b_provider_event: [payment captured, payment declined, refund issued, chargeback opened, card payment settled, deposit received]
  b_money_path: [billing/orders.py, billing/pricing.py, billing/tax.py, billing/rounding.py]
  b_check_path: [the order tests, the pricing tests, the tax tests, the deposit tests]
  b_taxkind: [sales tax, use tax, VAT, GST, recycling fee, delivery tax]
  p_table: [transactions, stores, items, inventory, price_changes, returns, tenders, loyalty_members, shrink_counts]
  p_report: [the daily sales by store report, the markdown report, the shrink report, the inventory accuracy report, the loyalty activity report, the labor hours dashboard]
  p_source: [the POS journal files, the store inventory counts, the loyalty platform export, the payment processor settlements, the labor scheduling export, the carrier delivery files]
  p_finance_ask: [the finance lead, someone in finance, the revenue accountant, the retail controller]
  p_alert_name: [register offline rate, price file delivery, POS journal backlog, the nightly load finishing late, certificate expiry, error rate on the trade portal, replication lag]
  s_plan: [a trade account, a store card, the loyalty program, a special order, a layaway plan, a corporate account]
  c_customer: [a shopper, a trade customer, a contractor, a store manager, a district manager, a corporate buyer]
  s_tool: [the order console, the customer care desk, the pricing admin, the POS back office, the ticket queue]
  s_thing: [the price update, the POS sync, the inventory job, the export, the cron, the receipt printer, the loyalty lookup, the webhook handler]
  c_eng_area: [the price sync, the POS journal export, the returns flow, the inventory counts, the loyalty lookup, the tender reconciliation, the label printing, the export endpoint]
  rs_store: [the downtown store, the mall store, the outlet, the flagship, the airport kiosk, the suburban store]
  rs_dept: [apparel, home goods, electronics, garden, toys, footwear]
  rs_peak: [the holiday peak, back to school, the January clearance, a doorbuster weekend, inventory count week, a price reset]
  rs_fail: [a price mismatch, a failed card tap, a stuck register, a wrong tax rate, a missing receipt, a phantom stock count]
  rs_pos: [the register, the handheld scanner, the self-checkout, the receipt printer, the card terminal, the label printer]
  rs_promo: [a doorbuster, a buy one get one, a loyalty coupon, a clearance markdown, a bundle price]
  rs_audit: [the PCI assessment, the inventory audit, the sales tax audit, the shrink review]
  rs_fix: [rebooted the register, resent the price file, restarted the sync, cleared the queue]
issues:
  billing:
    - labels: [bug]
      let:
        tax: ["{b_taxkind}"]
        doc: ["{b_doc}"]
        path: ["{b_money_path}"]
      title:
        - "Delivery charged {tax} at the store rate"
        - "Wrong {tax} on special order deliveries"
        - "{doc|cap} uses the store address for tax"
        - "Tax follows the shop, not delivery"
        - "{tax|cap} off for out of state deliveries"
      body:
        -   - "{b_raised}, {b_scope}."
            - "{b_pscope}."
        -   - "{/Also, /And /}A special order ships out."
            - "Delivery goes to another region."
            - ""
        -   - "{path|cap} uses the selling store."
            - "Delivery address is never used."
        -   - "{b_urgent}"
            - "{b_urgent} {b_offer}"
      comments:
        - "{b_cm_repro} with an out of state address."
        - "{b_cm_check}, {path} reads the store id."
        - "Tax filings for {2-9} orders need fixing."
        - "{b_cm_fix_up}"
    - labels: [bug]
      let:
        doc: ["{b_doc}"]
      title:
        - "Special order deposit missing on {doc}"
        - "Deposit missing from the final invoice"
        - "Customers pay the deposit twice"
        - "Layaway balance ignores earlier payments"
      body:
        -   - "{b_raised}, {b_scope}."
            - "{b_pscope}."
        -   - "{/Also, /And /}A deposit is taken in store."
            - "The customer pays on order day."
            - ""
        -   - "The final {doc} shows the full price."
            - "Billing never sees the deposit."
        -   - "{b_urgent}"
            - "{b_urgent} {b_offer}"
      comments:
        - "The register records a tender."
        - "{b_cm_repro} {b_cm_stage}."
        - "{b_cm_plan}"
        - "{b_cm_later}"
    - labels: [bug]
      let:
        promo: ["{rs_promo}"]
        customer: ["{b_customer}"]
      title:
        - "Trade discount stacks with {promo}"
        - "{customer|cap} gets both discounts"
        - "Contractor price lower than cost"
        - "Promotion ignores the trade tier"
      body:
        -   - "A trade tier gives a discount."
            - "Trade accounts get a set price."
        -   - "{promo|cap} adds a second cut."
            - "Both discounts apply together."
        -   - "{/Also, /And /}margins go negative on some items."
            - ""
        -   - "{b_raised}, {b_scope}."
      comments:
        - "Pick the better of the two."
        - "{b_cm_hand}"
        - "Merchandising must set the rule."
    - labels: [needs-decision]
      let:
        who: ["{b_who}"]
        question: [late fees on store cards, cut off dates for statements, refunds to a card after closing, holds on trade accounts]
      title:
        - "Policy for {question}?"
        - "Who decides {question}?"
        - "Statement cutoff on weekends"
        - "Decide {question}"
      body:
        -   - "{b_nd_a} {b_nd_b}"
            - "{who|cap} handles {question} {b_nd_b}."
        -   - "{/Also, /And /}due dates fall on weekends."
            - "Banks credit payments late."
            - ""
        -   - "{/Also, /And /}rules differ by state."
            - "The card rules are strict."
            - ""
        -   - "{b_nd_f}"
            - "Needs a ruling from {who}."
      comments:
        - "Move the due date to Monday."
        - "{b_cm_lean} a short grace window."
        - "Compliance must review the notice."
    - labels: [bug]
      title:
        - "Return credit uses today's price"
        - "Returns refunded at the current price"
        - "Return value ignores the sale price"
      body:
        -   - "A return is priced today."
            - "The refund uses the shelf price."
        -   - "{/Also, /And /}the customer paid a sale price."
            - "The original price was lower."
            - ""
        -   - "{b_raised}, {b_scope}."
        -   - "{p_priority}"
      comments:
        - "Use the original line price."
        - "{b_cm_repro} {b_cm_stage}."
        - "Receipts need a lookup first."
  docs:
    - labels: [docs, task]
      let:
        thing: [a price reset, a store opening, an inventory count, the holiday freeze, a register upgrade]
      title:
        - "How-to: run {thing}"
        - "Checklist for {thing}"
        - "Write down the steps for {thing}"
        - "Runbook: {thing}"
      body:
        -   - "Nobody keeps steps for {thing}."
            - "{person} does {thing} from memory."
        -   - "{/Also, /And /}stores call us when it breaks."
            - "Managers ask for a checklist."
            - ""
        -   - "{b_dc_c} would be plenty."
            - "One page with the contacts."
      comments:
        - "Notes from last year exist."
        - "Add the store hours."
        - "Include who approves it."
    - labels: [docs, bug]
      let:
        runbook: ["docs/runbooks/register-offline.md", "docs/runbooks/price-file.md", "docs/runbooks/pos-journal.md", "docs/runbooks/card-terminals.md"]
        step: [switching to offline mode, resending the price file, checking the journal queue, calling the card processor, telling the store managers]
      title:
        - "{runbook} is missing a step: {step}"
        - "Register runbook skips {step}"
        - "{runbook}: {step} not listed"
        - "Update {runbook} after the upgrade"
      body:
        -   - "Followed {runbook} during an outage."
            - "It left out {step}."
        -   - "{person} told us in chat only."
            - "{step|cap} sits in one head."
        -   - "{p_owner_ask}"
            - "{p_reviewer_ask}"
      comments:
        - "Added {step} as step {2-6}."
        - "Stores need a printable copy."
        - "{b_cm_docs}"
    - labels: [docs, enhancement]
      let:
        flow: [a price change reaching the register, a return without a receipt, a special order, deposit to delivery, an end of day close]
      title:
        - "Explain how {flow} works"
        - "Architecture note: {flow}"
        - "One page on {flow}"
        - "Describe {flow} end to end"
      body:
        -   - "New joiners ask how it works."
            - "Only {person} knows the whole path."
        -   - "{/Also, /And /}one diagram and a short page."
            - "A simple picture would do."
            - ""
      comments:
        - "I can draw it, someone check."
        - "Include the offline case."
        - "{b_cm_docs}"
  data:
    - labels: [bug, data-quality]
      let:
        store: ["{rs_store}"]
        table: ["{p_table}"]
      title:
        - "Stock counts disagree with the journal"
        - "Stock at {store} is off by {2-9} percent"
        - "Phantom stock in {table} for {store}"
        - "On hand goes negative after returns"
      body:
        -   - "The count says {2-90} units."
            - "The journal implies fewer."
        -   - "{/Also, /And /}returns restock the wrong item."
            - "Transfers land twice."
            - ""
        -   - "{p_noticed|cap}."
            - "The store counted by hand."
        -   - "{p_owner_ask}"
      comments:
        - "Matched on item and store."
        - "Count week will reset the figures."
        - "{b_cm_plan}"
    - labels: [bug, data-quality]
      let:
        report: ["{p_report}"]
        who: ["{b_who}"]
      title:
        - "{report|cap} does not match finance"
        - "Markdown report misses price changes"
        - "Daily sales differ from tenders"
        - "Shrink report counts returns twice"
      body:
        -   - "The report is {2-9} percent off."
            - "Finance sees another total."
        -   - "{/Also, /And /}price changes land mid day."
            - "Voids count as sales."
            - ""
        -   - "{b_ex_a}."
            - "{who|cap} needs it before the review."
        -   - "{p_owner_ask}"
      comments:
        - "Use the effective time."
        - "{b_cm_check}"
        - "Keep the old number beside it."
    - labels: [bug, incident]
      let:
        peak: ["{rs_peak}"]
      title:
        - "Offline stores delay the load"
        - "Sales load late after {peak}"
        - "Journal files missing from {2-9} stores"
      body:
        -   - "Stores upload after closing."
            - "Some registers stay offline."
        -   - "{/Also, /And /}the load starts without them."
            - "Totals look low until noon."
            - ""
        -   - "{p_noticed|cap}."
        -   - "{p_owner_ask}"
      comments:
        - "Wait for stores or a cutoff."
        - "{b_cm_prof} {b_cm_prof2}"
        - "{b_cm_plan}"
    - labels: [enhancement]
      let:
        source: ["{p_source}"]
      title:
        - "Load {source} into the warehouse"
        - "Bring {source} into the nightly load"
        - "Add {source} to the pipeline"
        - "Should planners get {source}?"
      body:
        -   - "Planners ask for {source} weekly."
            - "{person} pulls {source} by hand."
        -   - "{/Also, /And /}it would help staffing plans."
            - "Buyers could use it."
            - ""
        -   - "{/Also, /And /}strip card data first."
            - "Keep personal data out."
            - ""
      comments:
        - "Which stores send {source}?"
        - "Keep it for {2/3} years."
        - "{b_cm_plan}"
  portal:
    - labels: [bug]
      let:
        browser: ["{b_browser}"]
      title:
        - "Saved list reorder drops items"
        - "Saved list loses lines in {browser}"
        - "Reorder button adds the wrong quantity"
        - "Trade portal cart empties after login"
      body:
        -   - "A buyer reorders a saved list."
            - "Some lines never reach the cart."
        -   - "It happens in {browser}."
            - "Large lists fail more often."
        -   - "{b_raised}, {b_scope}."
        -   - "{b_urgent}"
      comments:
        - "{b_cm_repro} with a long list."
        - "The request times out."
        - "{b_cm_later}"
    - labels: [bug]
      title:
        - "Loyalty balance stale in portal"
        - "Points show up a day late"
        - "Store purchases missing from the balance"
      body:
        -   - "Customers buy in store."
            - "Points post the next day."
        -   - "{/Also, /And /}the portal caches the balance."
            - "Registers send points in batches."
            - ""
        -   - "{b_raised}, {b_scope}."
        -   - "{p_priority}"
      comments:
        - "Show a pending line."
        - "{b_cm_repro} {b_cm_stage}."
        - "{b_cm_later}"
    - labels: [bug]
      let:
        store: ["{rs_store}"]
      title:
        - "Store hours wrong over holidays"
        - "Locator shows {store} open when closed"
        - "Holiday hours missing from the locator"
      body:
        -   - "The locator uses regular hours."
            - "Holiday changes never load."
        -   - "{/Also, /And /}customers arrive at closed doors."
            - "Stores field the angry calls."
            - ""
        -   - "{p_priority}"
      comments:
        - "Let managers edit hours."
        - "{b_cm_check}"
        - "Add an override date."
    - labels: [enhancement]
      let:
        ask: [download a statement, track a special order, add a delivery address, request a credit line]
      title:
        - "Let trade customers {ask} online"
        - "Portal: {ask}"
        - "Customers want to {ask}"
      body:
        -   - "{b_ss_a} {b_ss_b}"
        -   - "{b_ss_c} {b_ss_d} {b_ss_e}"
        -   - "{b_ss_f}"
      comments:
        - "Care gets {2-9} calls daily."
        - "Needs credit team approval."
        - "{b_cm_srv}"
  infra:
    - labels: [bug, incident]
      let:
        store: ["{rs_store}"]
      title:
        - "{store|cap} registers drop offline at night"
        - "No failover line at {store}"
        - "Store network fails at night"
        - "Registers lose the server each hour"
      body:
        -   - "The main line dropped {2-6} times."
            - "Registers fall back to offline mode."
        -   - "{/Also, /And /}card payments need the link."
            - "Cash only until it returns."
            - ""
        -   - "{p_priority}"
      comments:
        - "Add a cellular backup."
        - "The carrier is checking the line."
        - "{b_cm_check}"
    - labels: [security, enhancement]
      title:
        - "Alert before card terminal certificates expire"
        - "Who renews the terminal keys?"
        - "Terminal firmware is behind"
      body:
        -   - "Keys expire in {20-120} days."
            - "Nobody owns the terminals."
        -   - "The audit asks about firmware."
            - "{rs_audit|cap} is next quarter."
        -   - "{p_owner_ask}"
      comments:
        - "I will add a {30/14} day alert."
        - "Update one store first."
        - "{b_cm_plan}"
    - labels: [bug]
      title:
        - "Price file reaches stores late"
        - "Price file fails for {2-9} stores"
        - "Shelf labels and registers disagree"
      body:
        -   - "The file lands after opening."
            - "Some stores get an old file."
        -   - "{/Also, /And /}registers show the old price."
            - "Labels already show the new one."
            - ""
        -   - "{p_priority}"
      comments:
        - "Push it before {5/6}am."
        - "{b_cm_repro} {b_cm_stage}."
        - "Add a version check."
  ops:
    - labels: [question]
      let:
        script: ["push_prices.sh", "close_day.sh", "reprint_labels.sh", "{p_script}"]
      title:
        - "Is {script} still used?"
        - "Can we delete {script}?"
        - "Does anything call {script}?"
        - "Retire {script}?"
        - "{script}: anyone using this?"
      body:
        -   - "Found {script} while tidying."
            - "{script|cap} has no recent changes."
        -   - "{/Also, /And /}written for the old registers."
            - "It predates the new POS."
            - ""
        -   - "{p_owner_ask}"
            - "Will remove it next month."
      comments:
        - "Not used by us."
        - "Check cron on {p_old_ref}."
        - "Keep it until the rollout ends."
comments:
  - "Stores logged {2-9} of these today."
  - "{b_pwho|cap} has a customer waiting."
  - "Does it hit {rs_store} too?"
  - "Only {rs_dept}, or everything?"
  - "Matters most during {rs_peak}."
  - "Checked the POS journal, same result."
  - "Store ops wants to know."
  - "Hold off until {rs_peak} ends."
chat:
  town-square:
    - root:
        - "{c_hey}: {rs_peak} planning {day} at {time}"
        - "change freeze for {rs_peak} starts {c_soon}"
        - "all hands {day} at {time} in {c_room}"
        - "welcome {person} to the store tech team"
        - "reminder: {rs_audit} is {c_soon}"
      replies:
        -   - "does it include the stores?"
            - "who needs to attend?"
            - "will it be recorded?"
        -   - "{c_yes}, all of them"
            - "leads only"
            - "{c_idk}, ask {person}"
            - ""
        -   - "{c_thanks}"
            - "{c_em}"
    - root:
        - "{c_hey}: benefits enrolment closes {c_soon}"
        - "office closed {c_soon}, stores open as usual"
        - "it patching {c_soon}, restart please"
        - "staff discount weekend {c_soon}"
      replies:
        -   - "{c_ack}"
            - "{c_thanks}"
        -   - ""
            - "thanks for the heads up"
    - root:
        - "huge thanks to {person} for the holiday push"
        - "{c_hey}, record sales yesterday at {rs_store}"
        - "the team won the retail award"
      replies:
        -   - "amazing"
            - "{c_em}"
            - "well deserved"
        -   - ""
            - "{c_thanks}"
  off-topic:
    - root:
        - "anyone been to the new {rs_store}?"
        - "who is working {rs_peak}?"
        - "found a bargain in {rs_dept} today"
        - "lunch ideas, sick of {c_food}"
        - "staff discount, what are you buying?"
      replies:
        -   - "love it"
            - "queue was huge"
            - "not for me"
        -   - "{c_lol}"
            - "save me one"
            - ""
    - root:
        - "{c_sport} {c_soon}, anyone in?"
        - "{c_weekend} {c_soon}, anyone?"
        - "{c_pet} just did something silly"
        - "reading anything good lately?"
      replies:
        -   - "i'm in"
            - "nice"
            - "can't, sorry"
        -   - "{c_em}"
            - ""
  engineering:
    - root:
        - "price sync slow since the patch"
        - "can someone review my pr on {repo}? {c_patch}"
        - "{c_ci_fail} is failing on main"
        - "who owns the tender reconciliation?"
        - "should we bump {c_dep}? new major is out"
      replies:
        -   - "i'll look {c_when_eng}"
            - "which stores?"
            - "{c_idk}, checking"
        -   - "it is the new build"
            - "rolled back, watching"
            - ""
        -   - "{c_thanks}"
            - "{c_ack}"
    - root:
        - "design question for {c_eng_area}, async?"
        - "heads up, freeze from {day} for {rs_peak}"
        - "why does {c_eng_area} retry {2-9} times?"
        - "who is on call this week?"
      replies:
        -   - "async, with a retry"
            - "ask {person}"
            - "it is in the handbook"
        -   - "{c_ack}"
            - "ok, thanks"
            - ""
    - root:
        - "local env broke after {pulling main/a rebase}"
        - "is {c_tool} down for anyone else?"
        - "tiny pr: fix typo in {repo} readme"
      replies:
        -   - "restart the dev container"
            - "same here"
            - "merged"
        -   - "{c_thanks}"
            - ""
  team:
    - root:
        - "{c_status} on the pricing fixes, standup in {5-15} minutes"
        - "who picks up {issue}?"
        - "sprint planning {day} at {time}, bring estimates"
        - "anyone free to pair on {issue}?"
        - "retro: who owns the price file?"
      replies:
        -   - "me, after standup"
            - "i can {c_when_eng}"
            - "{c_pto}, not me"
        -   - "{c_thanks}"
            - ""
    - root:
        - "escalation: {rs_store} reports {rs_fail}"
        - "store ops says {rs_fail}, {issue} maybe?"
        - "{c_hey}, {rs_fail} again, {2-9}th this week"
        - "{c_customer} complains about {rs_fail}"
      replies:
        -   - "which register?"
            - "{issue} looks like it"
            - "send me the store number"
        -   - "{c_ack}, taking it"
            - "checking the logs"
            - ""
    - root:
        - "release prep for {repo}: who has the checklist?"
        - "{person}, review my pr when free?"
        - "i am {c_pto}, who covers store support?"
      replies:
        -   - "in the handbook"
            - "i do"
        -   - "{c_thanks}"
            - ""
  support:
    - let:
        who: ["{c_customer}"]
        fail: ["{rs_fail}"]
      root:
        - "{who|cap} reports {fail}"
        - "{s_hey}, {who}: {fail}, case {4100-4999}"
        - "{who} is upset, {fail}"
        - "{fail} at {rs_store}, what do we say?"
        - "{fail} again, how do we fix it?"
      replies:
        -   - "ask for the receipt number"
            - "known, see {issue}"
