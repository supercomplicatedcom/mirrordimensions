  - drug maker
  - drug manufacturer
  - prescription drugs
  - branded generics
description: A drug maker that develops, manufactures and sells medicines under GxP rules, settling rebates and chargebacks with wholesalers, payers and distributors.
subscriptions: false  # leaves out the general themes about proration, dunning and payment retries
