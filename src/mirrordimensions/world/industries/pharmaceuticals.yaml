issues:
  billing:
    - labels: [bug]
      let:
        cust: ['{ph_cust}']
        reason: ['{ph_reason}']
        path: ['{b_money_path}']
      title:
        - Chargebacks from {cust} rejected for {reason}
        - '{reason|cap} on chargebacks from {cust}'
        - Why do chargebacks fail with {reason}?
        - Chargeback disputes up for {cust}, {reason}
        - 'Chargeback validation fails: {reason}'
        - '{cust|cap} disputes chargebacks over {reason}'
      body:
        -   - '{b_raised}, {b_scope}.'
            - '{b_raised} on {cust} chargebacks, {b_scope}.'
        -   - Prices are checked in {path}.
            - Validation lives in {path}.
        -   - The file shows {reason}.
            - Rejects list {reason}.
        -   - Contracts team reworks them {ph_hand}.
        -   - '{b_urgent}'
            - '{b_urgent} {b_offer}'
      comments:
        - '{b_cm_repro} with an 844 file from {cust}.'
        - '{b_cm_check}, {path} may use old prices.'
        - Trade relations needs an answer soon.
        - '{b_cm_later}'
    - labels: [bug, needs-decision]
      let:
        thing: ['best price', 'average manufacturer price', 'a base date price']
        path: ['{b_money_path}']
      title:
        - Medicaid rebate uses a stale {thing}
        - '{thing|cap} not refreshed after a price change'
        - Rebate accrual wrong {ph_afterprice}
        - Who owns the rule for {thing}?
        - Quarterly rebate total off for {thing}
        - '{thing|cap} rounding differs from the filing'
      body:
        -   - '{b_raised}, {b_scope}.'
        -   - The calculation is in {path}.
            - Prices are read once a quarter.
        -   - '{ph_lead} a mid-quarter change is missed.'
        -   - '{ph_lead} commercial finance corrects it {ph_hand}.'
        -   - Needs a decision from {b_who}.
      comments:
        - '{b_cm_hand}'
        - '{b_cm_ask_who}'
        - Compliance files these numbers.
    - labels: [bug]
      let:
        thing: ['a copay card claim', 'a patient assistance payment', 'a bridge program payment']
      title:
        - Reimbursement for {thing} paid twice
        - '{thing|cap} does not match the processor file'
        - Support program payments miss {ph_product}
        - Unmatched {thing} pile up
        - Program vendor sends {thing} with a bad id
      body:
        -   - '{b_raised}, {b_scope}.'
        -   - The vendor file has {ph_noid}.
            - Files repeat after a resend.
        -   - '{ph_lead} we match on amount and date.'
        -   - '{ph_lead} finance reconciles them {ph_hand}.'
      comments:
        - '{b_cm_dup}'
        - '{b_cm_check}, the vendor file layout.'
        - '{b_cm_later}'
    - labels: [bug, data-quality]
      let:
        thing: ['aggregate spend', 'transfers of value', 'consulting fees']
      title:
        - Open payments report double counts {thing}
        - '{thing|cap} for one prescriber {ph_split}'
        - Spend for one physician {ph_twoids}
        - Aggregate spend report differs {ph_ledger}
        - Who reviews {thing} before filing?
      body:
        -   - Compliance asked, ahead of {ph_audit}.
        -   - '{ph_lead} prescriber ids come from the CRM.'
            - The NPI is {ph_npi}.
        -   - Spend is keyed {ph_keyed}.
        -   - '{b_nd_b}'
      comments:
        - '{b_cm_ask_who}'
        - '{b_cm_plan}'
        - Filing deadline is fixed by law.
  portal:
    - labels: [bug, security]
      let:
        form: ['medical information request', 'product complaint form', 'adverse event form']
      title:
        - '{form|cap} not routed to the safety team'
        - Adverse event reports sit {ph_mailbox}
        - '{form|cap} confirmation never sent'
        - Clock for adverse events starts late
        - '{form|cap} drops the reporter phone number'
      body:
        -   - '{b_pscope}.'
        -   - Reports arrive by email.
            - The form posts to a mailbox.
        -   - '{ph_lead} the 15 day clock {ph_clock}.'
            - Clocks are set by hand.
        -   - '{ph_lead} safety needs to hear about this.'
      comments:
        - Safety must see this {ph_nextreport}.
        - '{b_cm_repro} {b_cm_stage}.'
        - '{b_cm_tell}'
    - labels: [bug]
      let:
        step: ['benefit verification', 'enrollment', 'consent signature']
      title:
        - Patient support {step} stuck on pending
        - '{step|cap} fails for patients on {ph_product}'
        - Patients cannot finish {step}
        - '{step|cap} email never arrives'
        - Hub vendor shows {step} done, portal does not
      body:
        -   - '{b_pscope}.'
        -   - '{ph_lead} status comes from the hub vendor.'
        -   - '{ph_lead} the portal polls once a day.'
        -   - '{ph_lead} patients phone the support line.'
      comments:
        - '{b_cm_clr2} {b_cm_cb}'
        - '{b_cm_repro} {b_cm_stage}.'
        - '{b_cm_later}'
    - labels: [bug, security]
      let:
        thing: ['an email opt-out', 'a consent preference', 'a do not contact flag']
      title:
        - Portal ignores {thing}
        - Emails sent to prescribers with {thing}
        - '{thing|cap} not synced to the CRM'
        - Opt-out takes {2-9} days to apply
        - Consent record lost {ph_profile}
      body:
        -   - '{b_pscope}.'
        -   - '{ph_lead} preferences live in two systems.'
        -   - '{ph_lead} a nightly job copies them.'
            - The sync is one way.
        -   - '{ph_lead} compliance cares about consent.'
      comments:
        - '{b_cm_ask_who}'
        - Privacy must review the fix.
        - '{b_cm_plan}'
    - labels: [bug, docs]
      let:
        thing: ['prescribing information', 'patient leaflet', 'medication guide']
        prod: ['{ph_product}']
      title:
        - '{thing|cap} for {prod} out of date on the site'
        - Old {thing} still downloads
        - Site links to a withdrawn {thing}
        - Who approves a new {thing} version?
      body:
        -   - '{b_pscope}.'
        -   - Files are uploaded {ph_hand}.
        -   - '{ph_lead} regulatory approves the new version.'
            - The new version is not published.
        -   - '{ph_lead} it needs a controlled release.'
      comments:
        - Regulatory affairs owns the approval.
        - '{b_cm_ask_who}'
        - '{b_cm_later}'
  docs:
    - labels: [docs, bug]
      let:
        step: ['recording the change request', 'attaching the test evidence', 'getting quality approval', 'closing the deviation']
        page: ['the change control SOP', 'the validation guide', 'the release checklist']
      title:
        - '{page|cap} is missing a step: {step}'
        - '{page|cap} skips {step}'
        - Validation guide does not cover {step}
        - Add {step} to {page}
        - 'Docs: {page} out of date after the audit'
      body:
        -   - Found while preparing for {ph_audit}.
            - Raised by quality during a review.
        -   - '{ph_lead} the page describes {ph_old} practice.'
        -   - '{ph_lead} nobody knows who owns it.'
        -   - '{ph_lead} a short ordered list would do.'
      comments:
        - '{b_cm_docs}'
        - Quality must approve the new version.
        - '{b_cm_up} {b_cm_read2}'
    - labels: [docs, security]
      let:
        thing: ['electronic signature rules', 'audit trail review', 'adverse event intake', 'data integrity checks']
      title:
        - Write down how we handle {thing}
        - Handbook never explains {thing}
        - Where is {thing} documented?
        - Document {thing} for new engineers
        - Quality asks for a page on {thing}
      body:
        -   - Quality asked, ahead of {ph_audit}.
            - '{ph_audit|cap} is coming, no page yet.'
        -   - '{ph_lead} only {person} knows the steps.'
            - The steps live in old emails.
        -   - '{ph_lead} a page with owners would do.'
      comments:
        - '{b_dc_e}'
        - Quality should review the wording.
        - '{b_cm_draft} {day}.'
  data:
    - labels: [bug, data-quality]
      let:
        edi: ['{ph_edi}']
        table: ['{p_table}']
      title:
        - Duplicate rows from {edi}
        - Sales data load counts {edi} twice
        - Weekly sales totals off {ph_resend}
        - Duplicate {table} after a wholesaler resend
        - Totals in {table} do not match the files
      body:
        -   - '{b_raised}, {b_scope}.'
        -   - '{ph_lead} wholesalers resend files after errors.'
        -   - '{ph_lead} our load has no file control.'
            - Nothing records the file name.
        -   - '{ph_lead} reports double count the week.'
        -   - '{ph_lead} needs a decision from {b_who}.'
      comments:
        - '{b_cm_dup}'
        - A file log would fix it.
        - '{b_cm_plan}'
    - labels: [bug, data-quality]
      let:
        thing: ['case counts', 'serious case totals', 'late reports']
      title:
        - Safety {thing} differ from the warehouse
        - '{thing|cap} do not match the safety database'
        - Warehouse {thing} off by {2-9} percent
        - Pharmacovigilance report disagrees with the load
        - Why are {thing} different in two places?
      body:
        -   - Safety asked, ahead of {ph_audit}.
        -   - '{ph_lead} our extract skips follow up versions.'
            - Only the first version loads.
        -   - '{ph_lead} case versions are handled differently.'
        -   - '{ph_lead} we need one agreed definition.'
      comments:
        - '{b_cm_hand}'
        - Safety owns the numbers.
        - '{b_cm_ask_who}'
    - labels: [bug, data-quality]
      let:
        thing: ['serialization events', 'EPCIS messages', 'shipment events']
      title:
        - Missing {thing} for shipments
        - '{thing|cap} do not match the packing list'
        - Track and trace gaps for {ph_product}
        - Duplicate {thing} after a resend
        - Who monitors {thing}?
      body:
        -   - '{b_raised}, {b_scope}.'
        -   - '{ph_lead} events arrive from the packaging line.'
            - The line sends them in batches.
        -   - '{ph_lead} some batches never reach us.'
        -   - '{ph_lead} supply chain reconciles them {ph_hand}.'
      comments:
        - '{b_cm_check}, the line logs first.'
        - The DSCSA rules apply.
        - '{b_cm_plan}'
    - labels: [bug, incident]
      let:
        feed: ['the batch records feed', 'the sales data feed', 'the case export']
      title:
        - Nightly commercial load {ph_latetitle}
        - Weekly report missing yesterday's data
        - '{feed|cap} arrived after the load started'
        - Load of {feed} failed on a date format
      body:
        -   - '{b_raised}, {b_scope}.'
        -   - Files {ph_late}.
        -   - The load starts at {1-4}am sharp.
        -   - '{ph_lead} analysts read it before {6-8}am.'
      comments:
        - A completion marker would help.
        - '{b_cm_prof} {b_cm_prof2}'
        - '{b_cm_later}'
  infra:
    - labels: [security, bug]
      let:
        change: ['a patch', 'a config change', 'an upgrade', 'a new integration']
        sys: ['{ph_system}']
      title:
        - Unvalidated {change} reached {sys}
        - Change to {sys} skipped change control
        - '{sys|cap} {change} has no approval record'
        - Audit trail turned off on {sys}
        - Who approved {change} on {sys}?
      body:
        -   - Found while preparing for {ph_audit}.
        -   - '{ph_lead} the change ticket is missing.'
            - Nobody can find the approval.
        -   - '{ph_lead} quality must assess the impact.'
        -   - '{b_g_needs}'
      comments:
        - Quality needs a deviation record.
        - '{b_cm_ask_who}'
        - '{b_cm_plan}'
    - labels: [bug, incident]
      let:
        edi: ['{ph_edi}']
      title:
        - AS2 gateway stopped accepting files
        - Files from {edi} rejected on a bad certificate
        - EDI queue backed up overnight
        - Alert for {ph_as2q} never fired
      body:
        -   - '{b_raised}, {b_scope}.'
