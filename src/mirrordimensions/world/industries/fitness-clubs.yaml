incidents:
  - role: billing
    fix: billing/email_queue.py
    title:
      - Receipt emails delayed
      - Dues receipt emails arriving late
      - Member receipts not sent
    alert:
      - "dues receipts delayed, oldest waited {20-90} min"
      - "{s_al} receipt mail queue age {s_age}"
      - "receipts not going out since {time}"
    fix_message:
      - "Queue receipt emails, not inline sends"
      - "{s_q_verb|cap} receipt emails {s_q_how}"
  - role: billing
    fix: billing/callbacks.py
    title:
      - Debit provider callback errors
      - Elevated errors on debit callbacks
      - Payment return callbacks failing
    alert:
      - "debit callbacks failing, rate above {5-30} percent"
      - "{s_al} returned debit callbacks erroring since {time}"
      - "callback endpoint throwing 5xx errors"
    fix_message:
      - "Retry debit callbacks that time out"
      - "Retry callbacks on timeout"
  - role: billing
    fix: billing/sent_log.py
    title:
      - Duplicate dues receipts
      - Members got the receipt twice
      - Duplicate receipt emails
    alert:
      - "members got receipts twice, {3-12} reports"
      - "{s_al} duplicate receipts after the retry"
      - "same receipt mailed twice, started after {day}"
    fix_message:
      - "Check the sent log before resending"
      - "Skip receipts already sent"
  - role: data
    fix: pipeline/validate.py
    title:
      - Nightly attendance load failed
