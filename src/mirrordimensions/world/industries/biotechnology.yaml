issues:
  billing:
    - labels: [bug]
      let:
        prog: ['{bt_program}']
        path: ['{b_money_path}']
        cust: ['{b_customer}']
      title:
        - Milestone invoice for {prog} fires on the wrong date
        - '{prog|cap} milestone billed before it was achieved'
        - Milestone trigger for {prog} does not match the contract
        - Why was a milestone invoiced {bt_twicefor}?
        - 'Milestone billing: {cust} contract dates are off'
        - Achieved milestone for {prog} was never invoiced
      body:
        -   - '{b_raised}, {b_scope}.'
            - '{b_raised} on {cust} contracts, {b_scope}.'
        -   - Triggers are evaluated in {path}.
            - Dates come from {path}.
        -   - '{bt_lead} a program manager marks it done.'
            - Achievement is set by hand.
        -   - '{bt_lead} finance checks them {bt_hand}.'
        -   - '{b_urgent}'
            - '{b_urgent} {b_offer}'
      comments:
        - '{b_cm_repro} with a {cust} contract.'
        - '{b_cm_check}, {path} may use the signing date.'
        - Legal has the contract wording.
        - '{b_cm_later}'
    - labels: [bug, needs-decision]
      let:
        thing: ['FTE rates', 'rate cards', 'overhead rates']
        path: ['{b_money_path}']
      title:
        - '{thing|cap} not updated after the annual change'
        - FTE invoice uses last year's {thing}
        - Who owns the rule for {thing}?
        - Cost-share invoice total off by {2-9} percent
        - '{thing|cap} differ {bt_contractsys}'
        - Partner disputes the {thing} on an invoice
      body:
        -   - '{b_raised}, {b_scope}.'
        -   - Rates are stored in {path}.
            - The rate table is read {bt_yearly}.
        -   - '{bt_lead} a mid-year change is missed.'
        -   - '{bt_lead} finance corrects invoices {bt_hand}.'
        -   - Needs a decision from {b_who}.
      comments:
        - '{b_cm_hand}'
        - '{b_cm_ask_who}'
        - Partners see the rates {bt_incontract}.
    - labels: [bug]
      let:
        cur: ['{b_currency}']
        region: ['{b_region}']
      title:
        - '{cur} invoices to {region} use yesterday''s rate'
        - Exchange rate on {cur} invoices is stale
        - Withholding tax missing for partners in {region}
        - '{cur} amounts rounded differently from the ledger'
        - Credit note in {cur} does not match the invoice
      body:
        -   - '{b_raised}, {b_scope}.'
        -   - '{bt_lead} rates load once a day.'
            - The rate is cached in memory.
        -   - '{bt_lead} a change of date {bt_notpicked}.'
        -   - Finance fixes totals {bt_hand}.
      comments:
        - '{b_cm_check}, the rate table first.'
        - '{b_cm_repro} {b_cm_stage}.'
        - '{b_cm_later}'
    - labels: [bug, data-quality]
      let:
        thing: ['royalty statements', 'sales reports', 'net sales figures']
      title:
        - '{thing|cap} from a licensee do not reconcile'
        - Royalty total differs {bt_fromreport}
        - '{thing|cap} arrive in three formats'
        - Late {thing} leave the royalty accrual wrong
        - Who reviews {thing} before invoicing?
      body:
        -   - '{b_raised}, {b_scope}.'
        -   - Reports come as spreadsheets.
            - Licensees email their reports.
        -   - '{bt_lead} totals are keyed in {bt_hand}.'
        -   - '{bt_lead} audit rights are in the contract.'
      comments:
        - '{b_cm_ask_who}'
        - '{b_cm_plan}'
        - Legal needs the statement for {bt_audit}.
  portal:
    - labels: [bug, security]
      let:
        thing: ['another partner''s dataset', 'a restricted program', 'an embargoed result']
      title:
        - Partner can open {thing}
        - Access list for {bt_dataroom} is ignored
        - Download link for {thing} works after revoke
        - Guessable dataset ids in the portal
        - '{thing|cap} visible to a former collaborator'
      body:
        -   - '{b_pscope}.'
        -   - '{bt_lead} the route checks login only.'
            - The lookup joins by id only.
        -   - '{bt_lead} revoked users keep access.'
        -   - '{b_pm_e}'
      comments:
        - '{b_cm_rolefix} {b_cm_roletest}'
        - Legal has to hear about this.
        - '{b_cm_tell}'
    - labels: [bug, performance]
      let:
        file: ['{bt_file}']
        browser: ['{b_browser}']
      title:
        - Download of {file} times out in the portal
        - Large {file} fail to upload in {browser}
        - Results page slow for projects with {b_acct_size}
        - Upload of {file} stalls at {10-99} percent
        - Partners cannot fetch {file} after the move
      body:
        -   - '{b_pscope}.'
        -   - Large files go {bt_throughweb}.
        -   - '{bt_lead} signed links would avoid it.'
        -   - '{bt_lead} partners ask us to send them {bt_hand}.'
      comments:
        - '{b_cm_repro} on {bt_cloud}.'
        - '{b_cm_prof} {b_cm_prof2}'
        - '{b_cm_later}'
    - labels: [enhancement]
      let:
        thing: ['a specimen request', 'a data access request', 'a material transfer form']
      title:
        - Let partners file {thing} in the portal
        - '{thing|cap} still goes by email'
        - Track the status of {thing}
        - Approvals for {thing} get lost
      body:
        -   - Scientists keep asking for it.
        -   - '{bt_lead} today it is {bt_emails}.'
        -   - A form with approvals {bt_wouldwork}.
      comments:
        - '{b_cm_ask_who}'
        - Legal must approve the wording.
        - '{b_cm_plan}'
    - labels: [bug]
      let:
        thing: ['instrument results', 'assay summaries', 'QC reports']
      title:
        - '{thing|cap} do not show up {bt_where}'
        - '{thing|cap} appear days late'
        - Delay before {thing} reach partners
        - Release rules for {thing} look wrong
      body:
        -   - '{b_pscope}.'
        -   - '{bt_lead} results sync from the warehouse.'
        -   - '{bt_lead} a review step holds them back.'
        -   - '{bt_lead} rules differ by program.'
      comments:
        - '{b_cm_ask_who}'
        - '{b_cm_check}, the release table first.'
        - '{b_cm_later}'
  docs:
    - labels: [docs, bug]
      let:
        step: ['registering the instrument', 'mounting the run folder', 'tagging the project', 'checking the quota']
        page: ['the instrument onboarding guide', 'the cluster guide', 'the data upload page']
      title:
        - '{page|cap} is missing a step: {step}'
        - '{page|cap} skips {step}'
        - Instrument guide does not cover {step}
        - Add {step} to {page}
        - 'Docs: {page} out of date after the move'
      body:
        -   - A new scientist asked about it.
            - Found while onboarding {person}.
        -   - '{bt_lead} the page describes the old cluster.'
        -   - '{bt_lead} nobody knows who owns it.'
        -   - '{bt_lead} a short ordered list would do.'
      comments:
        - '{b_cm_docs}'
        - The lab managers should read it.
        - '{b_cm_up} {b_cm_read2}'
    - labels: [docs, security]
      let:
        thing: ['data retention rules', 'electronic notebook sign-off', 'material transfer approvals', 'export control checks']
      title:
        - Write down how we handle {thing}
        - Handbook never explains {thing}
        - Where is {thing} documented?
        - Document {thing} for new scientists
        - Legal asks for a page on {thing}
      body:
        -   - Quality asked, ahead of {bt_audit}.
            - '{bt_audit|cap} is coming, no page yet.'
        -   - '{bt_lead} only {person} knows the steps.'
            - The steps live in old emails.
        -   - '{bt_lead} a page with owners would do.'
      comments:
        - '{b_dc_e}'
        - Legal should review the wording.
        - '{b_cm_draft} {day}.'
  data:
    - labels: [bug, data-quality]
      let:
        run: ['{bt_run}']
        instr: ['{bt_instr}']
      title:
        - Run metadata missing for {run}
        - '{instr|cap} exports land without a project id'
        - Duplicate rows from {run}
        - Results for {run} loaded under the wrong project
        - QC flags for {run} not in the warehouse
      body:
        -   - '{b_raised}, {b_scope}.'
        -   - Files come from {instr}.
            - The export is written by {instr}.
        -   - Project ids are {bt_typed}.
            - The run name is {bt_onlykey}.
        -   - Analysts clean them {bt_hand}.
        -   - Needs a decision from {b_who}.
      comments:
        - '{b_cm_dup}'
        - A plate barcode {bt_wouldfix}.
        - '{b_cm_plan}'
    - labels: [bug, incident]
      let:
        file: ['{bt_file}']
        run: ['{bt_run}']
      title:
        - Pipeline for {run} failed halfway
        - Nightly assay load {bt_latetitle}
        - '{file|cap} missing after the transfer'
        - Alignment job for {run} stalls on the cluster
        - Upload of {file} died {bt_stage}
      body:
        -   - '{b_raised}, {b_scope}.'
        -   - Files {bt_late}.
        -   - The job holds {bt_lock}.
        -   - '{bt_lead} scientists wait on the results.'
        -   - '{b_urgent}'
      comments:
        - '{b_cm_prof} {b_cm_prof2}'
        - A completion marker would help.
        - '{b_cm_later}'
    - labels: [bug, data-quality]
      let:
        thing: ['freezer inventory', 'aliquot counts', 'cell line records']
        table: ['{p_table}']
      title:
        - '{thing|cap} does not match the lab'
        - Locations in {table} are out of date
        - Missing barcodes in {table}
        - Counts of {table} differ between two systems
        - Who owns {thing}?
      body:
        -   - Lab managers noticed it.
            - '{b_raised}, {b_scope}.'
        -   - '{bt_lead} moves are logged on paper.'
        -   - '{bt_lead} the warehouse copy is not refreshed.'
        -   - '{bt_lead} we need one source of truth.'
      comments:
        - '{b_cm_hand}'
        - '{b_cm_ask_who}'
        - Quality needs it for {bt_audit}.
    - labels: [needs-decision, chore]
      let:
        thing: ['cloud storage', 'compute', 'archive storage']
        file: ['{bt_file}']
      title:
        - '{thing|cap} cost up {10-60} percent'
        - Lifecycle rules for {file}
        - Who deletes old {file}?
        - Archive policy for {file} is missing
        - Cost report shows {thing} growing fast
      body:
        -   - Finance asked about it.
        -   - '{bt_lead} raw {file} are kept forever.'
            - Nobody owns the cleanup.
        -   - '{bt_lead} a rule per project would help.'
        -   - '{b_cm_ask_who}'
      comments:
        - '{b_cm_plan}'
        - Scientists need to approve deletion.
        - '{b_cm_later}'
  infra:
    - labels: [bug, incident]
      let:
        thing: ['freezer temperature', 'incubator alarms', 'cold room sensors']
      title:
        - Alert for {thing} never reached on-call
        - '{thing|cap} alarm routes to a retired channel'
        - Sensor feed for {thing} stopped overnight
        - False alarms from {thing} every night
      body:
        -   - '{b_raised}, {b_scope}.'
        -   - The alert routes {bt_wrongrota}.
        -   - Nobody was paged overnight.
        -   - '{b_urgent}'
      comments:
        - '{b_cm_clr2}'
        - '{b_cm_check}, the alert route first.'
        - Lab managers must confirm {bt_therota}.
    - labels: [bug, performance]
      let:
        target: ['the cluster scheduler', 'the batch compute pool', 'the scratch volume']
