  - life sciences
  - genomics
  - cell and gene therapy
  - drug discovery
  - preclinical research
description: A research-driven company that discovers and develops biological therapies, running labs, instruments and data pipelines, and billing partners for collaborations and milestones.
subscriptions: false  # leaves out the general themes about proration, dunning and payment retries
