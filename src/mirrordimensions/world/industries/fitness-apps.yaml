# SPDX-License-Identifier: Apache-2.0
# Fitness and wellness apps and wearables: extends the general profile (decision 0028). Templates, never whole sentences (0029).
extends: general
slug: fitness-apps
name: Fitness and wellness apps and wearables
group: Consumer, fitness and wellness
aliases:
  - fitness app
  - wellness app
  - wearables
  - health and fitness tech
  - connected fitness
description: A company that makes a fitness and wellness app and its wearable devices, sells subscriptions through app stores and the web, and runs corporate wellness programs.
name_suffixes:
  - Fit
  - Health Labs
  - Wellness
  - Motion
  - Active
  - Labs
invoice_items:
  - Premium subscription
  - Corporate wellness program
organization:
  head: Head of Engineering
  it_admin: IT Lead
  teams:
    platform: {department: Engineering, title: Platform Engineer}
    billing: {department: Engineering, title: Payments Engineer}
    data: {department: Data and Analytics, title: Data Engineer}
    support: {department: Member Support, title: Support Specialist, lead: Support Manager}
    product: {department: Product, title: Product Manager}
    operations: {department: Partnerships and Operations, title: Partner Operations Analyst}
names:
  repos:
    billing-service: [subscriptions, billing-service, payments-service, store-billing]
    platform-docs: [eng-handbook, platform-docs, mobile-runbooks, team-docs]
    data-pipeline: [events-warehouse, analytics-pipeline, data-pipeline, event-loads]
    infra-config: [infra-config, cloud-config, env-config, deploy-config]
    customer-portal: [web-app, account-web, member-web, web-checkout]
    ops-scripts: [ops-scripts, legacy-scripts, admin-scripts, old-tools]
  channels:
    engineering: [engineering, eng, dev, mobile-and-web]
    incidents: [incidents, prod-incidents, sync-alerts, outages]
    releases: [releases, app-releases, store-submissions, shipping]
    billing-team: [billing-team, subscriptions-team, payments, billing-eng]
    platform-team: [platform-team, backend, platform, sync-platform]
    data-team: [data-team, analytics, data, insights]
    support: [support, member-support, help-desk, cs-team]
    leads: [leads, eng-leads, managers, team-leads]
systems:
  typical: [github, slack, jira, stripe, segment, amplitude, braze, zendesk]
  common: [firebase, sentry, launchdarkly, datadog, snowflake]
symbols:
  b_doc: [subscription receipt, renewal invoice, corporate wellness invoice, store payout statement, device order invoice, refund confirmation]
  b_customer: [monthly subscriber, annual subscriber, family-plan, corporate wellness, student, trial-converted, lifetime-plan, gifted]
  b_who: [support, the growth team, finance, partnerships, the coaching team]
  b_pwho: [support, a subscriber, "{person}", the growth team, finance]
  b_ticket_noun: [ticket, case, review, store complaint]
  b_page: [workout history, subscription, payment methods, connected devices, challenges, friends, data export]
  b_acct_size: ["{300-2000} workouts", "{3-9} connected devices", "over {1000-9000} sync events", "{20-80} challenge entries"]
  b_provider_event: [renewal succeeded, renewal failed, refund issued, chargeback opened, trial converted, subscription cancelled, grace period started]
  b_money_path: [billing/subscriptions.py, billing/renewals.py, billing/store_receipts.py, billing/proration.py]
  b_check_path: [the renewal tests, the receipt tests, the store callback tests, the proration tests]
  b_browser: [Safari, Firefox, Chrome on Android, mobile Safari, Edge, an in-app browser]
  p_table: [users, subscriptions, workouts, devices, sync_events, entitlements, promo_redemptions, refunds, push_tokens]
  p_report: [the weekly active users report, the trial conversion dashboard, the retention cohort report, the revenue by platform report, the churn dashboard, the device sync health report]
  p_source: [the App Store server notifications, the Play billing events, the wearable sync logs, the push provider delivery reports, the coaching platform export, the web analytics events]
  p_finance_ask: [the finance lead, someone in finance, the revenue accountant, the controller]
  p_alert_name: [sync api error rate, push delivery delay, store notification backlog, the nightly load finishing late, certificate expiry, crash-free sessions, replication lag]
  s_plan: [the annual plan, a monthly plan, the family plan, a corporate plan, the student plan, a free trial]
  c_customer: [a subscriber, a corporate client, an annual subscriber, a power user, a family plan owner, a coach]
  s_tool: [the admin console, the support desk, the subscription lookup, the store dashboard, the user search]
  s_thing: [the renewal job, the sync worker, the push sender, the export, the cron, the webhook handler, the paywall, the onboarding flow]
  c_eng_area: [the renewal job, the sync worker, the store webhooks, the push queue, the paywall, the streak logic, the workout import, the export endpoint]
  c_sport: [a run, climbing, a long bike ride, yoga, a swim, tennis, the gym]
  fa_platform: [iOS, Android, the web app, the watch app, the band app]
  fa_device: [the band, the watch, the chest strap, the smart scale, the ring]
  fa_metric: [steps, heart rate, sleep score, active minutes, calories, resting heart rate]
  fa_workout: [a run, a ride, a strength session, a yoga class, a swim, a HIIT session]
  fa_store: [the App Store, Google Play, the web checkout]
  fa_feature: [streaks, challenges, leaderboards, live classes, coaching plans, the weekly report]
  fa_region: [the EU, California, Washington state, the UK, Canada]
  fa_flag: [the new onboarding, the paywall test, the sleep tab, the coach chat]
  fa_peak: [the January spike, the new year rush, the summer challenge, a marathon weekend, a viral workout video]
  fa_fail: [sync stuck, a missing workout, a wrong step count, a lost streak, a duplicate charge, a failed restore]
  fa_ver: ["{4-9}.{0-9}.{0-9}", "{3-8}.{1-9}", "{10-12}.{0-4}.{0-3}"]
  fa_why: [new phone, low battery, flaky bluetooth, a timezone change, an os update, a reinstall]
  fa_dev: [a new watch, a band upgrade, the old band, a borrowed phone]
issues:
  billing:
    - labels: [bug]
      let:
        store: ["{fa_store}"]
        event: ["{b_provider_event}"]
        path: ["{b_money_path}"]
      title:
        - "Refunded in {store}, still premium"
        - "Entitlement survives a refund from {store}"
        - "Store refund does not end access"
        - "Refunded users keep premium for weeks"
        - "Refund notice from {store} is ignored"
      body:
        -   - "{b_raised}, {b_scope}."
            - "{b_raised}, seen in {2-9} reviews."
        -   - "A refund arrives from {store}."
            - "The store sends a refund event."
        -   - "The entitlement is never revoked."
            - "{path|cap} skips refunds after {event}."
        -   - "{b_urgent}"
            - "{b_urgent} {b_offer}"
      comments:
        - "{b_cm_repro} with a store refund."
        - "Handler in {path} ignores the revoke type."
        - "{b_cm_plan}"
        - "{b_cm_fix_up}"
    - labels: [bug]
      let:
        platform: ["{fa_platform}"]
        customer: ["{b_customer}"]
      title:
        - "Trial converts twice, web and {platform}"
        - "Double charge after web trial, {platform}"
        - "{customer|cap} users billed on two platforms"
        - "Two active subscriptions for one user"
        - "Duplicate plan after switching to {platform}"
      body:
        -   - "{b_raised}, {b_scope}."
            - "{b_pscope}."
        -   - "{/Also, /And /}A user trials on the web."
            - "One account trials on two stores."
            - ""
        -   - "{/Also, /And /}each store converts at the end."
            - "Both converted and both charged."
            - ""
        -   - "{b_urgent}"
            - "Refunds need {b_pwho} to approve."
      comments:
        - "We check one store only."
        - "Merge by account id before converting."
        - "{b_cm_later}"
    - labels: [needs-decision]
      let:
        who: ["{b_who}"]
        question: [which employees count as seats, billing for inactive employees, a refund after an early exit, pausing a client over the summer]
      title:
        - "Policy for {question}?"
        - "Corporate wellness: {question}"
        - "Who decides {question}?"
        - "Seat counts on the employer invoice"
      body:
        -   - "{b_nd_a} {b_nd_b}"
            - "{who|cap} handles {question} {b_nd_b}."
        -   - "{/Also, /And /}seats are counted at month end."
            - "Invited users count, not active ones."
            - ""
        -   - "{/Also, /And /}employers dispute it every quarter."
            - "Two clients asked for a credit."
            - ""
        -   - "{b_nd_f}"
            - "Needs a ruling from {who}."
      comments:
        - "Active in the last {30/60/90} days seems fair."
        - "{b_cm_lean} counting activated accounts only."
        - "Contracts differ, check them before changing."
    - labels: [bug]
      let:
        doc: ["{b_doc}"]
        platform: ["{fa_platform}"]
      title:
        - "Family plan: removed member keeps access"
        - "Removed family member not prorated"
        - "Owner charged for removed seat"
        - "{doc|cap} lists seats already removed"
      body:
        -   - "An owner removed a member on {day}."
            - "A member left the family plan."
        -   - "The {doc} still counts the seat."
            - "Proration ignores the change day."
        -   - "{b_raised}, {b_scope}."
        -   - "{b_urgent}"
            - "{b_urgent} {b_offer}"
      comments:
        - "{b_cm_repro} {b_cm_stage}."
        - "{b_cm_hand}"
        - "Seats end on removal day."
    - labels: [bug, security]
      let:
        kind: [promo code, referral reward, gift code, student discount]
      title:
        - "{kind|cap} can be reused after cancelling"
        - "Single-use {kind} redeems twice"
        - "{kind|cap} stacks with the trial"
        - "Cancelled users redeem a {kind} again"
      body:
        -   - "A {kind} is meant to work once."
            - "Each {kind} should be single use."
        -   - "{/Also, /And /}A cancelled account redeems it again."
            - "Fresh accounts redeem it again."
            - ""
        -   - "{b_raised}, {b_scope}."
        -   - "{/Also, /And /}keep the details out of chat."
            - "Keep this out of open channels."
            - ""
      comments:
        - "Tie the {kind} to the payment method."
        - "Checked {2-9} abusers by hand."
        - "{b_cm_fix_up}"
  docs:
    - labels: [docs, task]
      let:
        thing: [a hotfix release, a store submission, a staged rollout, a rollback, a forced update]
        topic: [releases, store reviews, flags, rollbacks]
      title:
        - "How-to: ship {thing}"
        - "Checklist for {thing}"
        - "Write down how we do {thing}"
        - "Runbook: {thing}"
      body:
        -   - "Nobody has a list for {thing}."
            - "Last time we did {thing} from memory."
        -   - "{/Also, /And /}the store review adds days."
            - "Set flags before the build."
            - ""
        -   - "{b_dc_a} {b_dc_b}"
            - "{b_dc_c} would be plenty."
      comments:
        - "I have notes from last time."
        - "Add a review contact per store."
        - "Mention the staged rollout percentages."
    - labels: [docs, bug]
      let:
        runbook: ["docs/runbooks/store-webhooks.md", "docs/runbooks/sync-api.md", "docs/runbooks/push-sender.md", "docs/runbooks/renewals.md"]
        step: [pausing the queue first, checking the store dashboard, draining the workers, switching off the flag, rotating the push key]
      title:
        - "{runbook} is missing a step: {step}"
        - "Runbook skips {step}"
        - "{runbook}: {step} not listed"
        - "Update {runbook} after the migration"
      body:
        -   - "Followed {runbook} during an incident."
            - "It left out {step}."
        -   - "{person} told us in chat only."
            - "{step|cap} lives in someone's head."
        -   - "{p_owner_ask}"
            - "{p_reviewer_ask}"
      comments:
        - "Added {step} as step {2-6}."
        - "Add a screenshot of the dashboard."
        - "{b_cm_docs}"
  data:
    - labels: [bug, data-quality]
      let:
        metric: ["{fa_metric}"]
        dev: ["{fa_dev}"]
      title:
        - "Workouts counted twice, phone and band"
        - "Duplicate workouts after pairing {dev}"
        - "{metric|cap} doubled when two sources report"
        - "Double counted workouts in {p_table}"
      body:
        -   - "A workout arrives from two sources."
            - "Phone and band both send it."
        -   - "{/Also, /And /}the clean step keeps both rows."
            - "Nothing links the two copies."
            - ""
        -   - "{p_noticed|cap}."
            - "Support has {2-9} complaints."
        -   - "{p_owner_ask}"
      comments:
        - "Match on start time and duration."
        - "Prefer the band when both exist."
        - "{b_cm_plan}"
    - labels: [bug, data-quality]
      let:
        report: ["{p_report}"]
        who: ["{b_who}"]
      title:
        - "{report|cap} disagrees with finance"
        - "Trial conversions off by {2-9} percent"
        - "Retention cohorts shift between runs"
        - "Revenue by platform misses payouts"
      body:
        -   - "The dashboard is {2-9} percent higher."
            - "Finance shows a different total."
        -   - "{/Also, /And /}store fees and refunds differ."
            - "Refunds land in another period."
            - ""
        -   - "{b_ex_a}."
            - "{who|cap} needs this {for the board pack/before month end}."
        -   - "{p_owner_ask}"
      comments:
        - "One view counts trials as paid."
        - "Define the cohort by first charge."
        - "{b_cm_check}"
    - labels: [security, task]
      let:
        region: ["{fa_region}"]
      title:
        - "Account deletions must purge the warehouse"
        - "Erasure requests miss {p_table}"
        - "Deleted users still in the warehouse"
        - "Purge deleted users under {region} rules"
      body:
        -   - "Deleting clears the app database."
            - "The warehouse keeps old rows."
        -   - "{region|cap} rules need removal in {30/45} days."
            - "Privacy asked for a monthly purge."
        -   - "{/Also, /And /}health data needs extra care."
            - "Workout and heart rate rows count."
            - ""
        -   - "{p_owner_ask}"
      comments:
        - "A nightly purge by user id."
        - "Backups age out on their own."
        - "{b_cm_later}"
    - labels: [bug]
      let:
        ver: ["{fa_ver}"]
      title:
        - "Event schema change in {ver} broke the load"
        - "New build sends a renamed field"
        - "Nightly load fails after build {ver}"
      body:
        -   - "Build {ver} renamed an event field."
            - "The loader expects the old name."
        -   - "Rows land in the reject table."
            - "Dashboards show a gap since {day}."
        -   - "{p_priority}"
            - "{p_fix_soon}"
      comments:
        - "Accept both names for now."
        - "Mobile should tell us before renames."
        - "{b_cm_later}"
  portal:
    - labels: [enhancement]
      let:
        region: ["{fa_region}"]
        ask: [export their data, delete their history, get a copy of their workouts, download their sleep data]
      title:
        - "Self-service data export"
        - "Let users download their data"
        - "Export my data from settings"
        - "Data request form for {region} users"
      body:
        -   - "{b_ss_a} {b_ss_b}"
        -   - "{b_ss_c} {b_ss_d} {b_ss_e}"
        -   - "{b_ss_f}"
            - "Requests must be answered in {30/45} days."
      comments:
        - "Zip of workouts and sleep files."
        - "Email the link, then expire it."
        - "{b_cm_srv}"
    - labels: [bug]
      let:
        browser: ["{b_browser}"]
      title:
        - "Checkout fails at 3-D Secure"
        - "Card challenge loops in {browser}"
        - "Checkout stuck after bank approval"
        - "3-D Secure popup blocked in {browser}"
      body:
        -   - "Customers reach the bank challenge."
            - "The bank page never returns."
        -   - "It happens in {browser}."
            - "Other browsers are fine."
        -   - "{b_raised}, {b_scope}."
        -   - "{p_priority}"
      comments:
        - "{b_cm_repro} with a test card."
        - "The return url loses the session."
        - "{b_cm_later}"
    - labels: [bug]
      title:
        - "Deleted accounts keep billing"
        - "Account deleted, store still billing"
        - "Delete account leaves the plan active"
        - "Users charged after account deletion"
      body:
        -   - "Deleting the account removes data."
            - "The app deletes profile and workouts."
        -   - "{/Also, /And /}the store subscription keeps renewing."
            - "Billing keeps running at the store."
            - ""
        -   - "People think they are cancelled."
            - "{b_raised}, {b_scope}."
        -   - "{b_urgent}"
      comments:
        - "Warn them, link the store."
        - "We cannot cancel for the store."
        - "{b_cm_later}"
    - labels: [bug]
      let:
        why: ["{fa_why}"]
        feature: ["{fa_feature}"]
      title:
        - "{feature|cap} reset after a timezone change"
        - "Streak lost after {why}"
        - "Day boundary wrong when travelling"
        - "Users lose {feature} over {why}"
      body:
        -   - "A streak breaks at midnight."
            - "Midnight uses the wrong zone."
        -   - "It follows {why}."
            - "Travellers report it most."
        -   - "{b_raised}, {b_scope}."
        -   - "{b_urgent}"
      comments:
        - "Store the zone with each workout."
        - "{b_cm_repro} {b_cm_stage}."
        - "Restore {2-9} streaks by hand."
  infra:
    - labels: [security, enhancement]
      title:
        - "Alert before the push certificate expires"
        - "Push key rotation has no reminder"
        - "Push signing key expires next quarter"
        - "Who rotates the push credentials?"
      body:
        -   - "The key expires in {20-90} days."
            - "Nobody owns the push credentials."
        -   - "{/Also, /And /}A lapse stops all notifications."
            - "Expiry silently stops pushes."
            - ""
        -   - "{p_owner_ask}"
            - "Add a calendar reminder."
      comments:
        - "I will add a {30/14}-day alert."
        - "Rotate in staging first."
        - "{b_cm_plan}"
    - labels: [bug, performance]
      let:
        peak: ["{fa_peak}"]
      title:
        - "Sync API rate limits trip during {peak}"
        - "Sync workers fall behind in {peak}"
        - "Throttling too tight for {peak}"
        - "Raise sync limits before {peak}"
      body:
        -   - "Sync requests spike in {peak}."
            - "Traffic doubled during {peak}."
        -   - "{/Also, /And /}clients get throttled and retry."
            - "Retries then add more load."
            - ""
        -   - "{/Also, /And /}raise limits or add workers."
            - "Backoff on the client helps too."
            - ""
      comments:
        - "{b_cm_prof}"
        - "Add jitter to the retry."
        - "{b_cm_later}"
    - labels: [bug]
      title:
        - "Firmware downloads slow in some regions"
        - "Update bucket lacks a cache rule"
        - "Firmware update stalls halfway"
        - "CDN serves an old firmware file"
      body:
        -   - "Devices stall at {10-90} percent."
            - "Updates time out in some regions."
        -   - "{/Also, /And /}the cache keeps the old file."
            - "The file is never cached."
            - ""
        -   - "{p_priority}"
      comments:
        - "Purge the cache on each release."
        - "Add a checksum to the manifest."
        - "{b_cm_check}"
  ops:
    - labels: [question]
      let:
        script: ["backfill_steps.sh", "resend_receipts.sh", "purge_push_tokens.sh", "{p_script}"]
      title:
        - "Is {script} still used?"
        - "Can we delete {script}?"
        - "Does anything call {script}?"
        - "Retire {script}?"
        - "{script}: anyone using this?"
      body:
        -   - "Found {script} while tidying."
            - "{script|cap} has no recent changes."
        -   - "{/Also, /And /}it predates the new pipeline."
            - "Written for the old backend."
            - ""
        -   - "{p_owner_ask}"
            - "Will remove it next month."
      comments:
        - "Not used by us."
        - "Check cron on {p_old_ref}."
        - "Keep it until the migration ends."
comments:
  - "Support has {2-9} reviews about this."
  - "Is this {fa_platform} only?"
  - "Does it also happen on {fa_platform}?"
  - "Seen it with {fa_device} too."
  - "Matters most around {fa_peak}."
  - "Checked the logs for {fa_fail}."
  - "Behind {fa_flag} for now?"
  - "{b_pwho|cap} has a user waiting."
