incidents:
  - role: billing
    fix: billing/email_queue.py
    title:
      - Receipt emails delayed
      - Subscription receipts arriving late
      - Renewal mail not sent
    alert:
      - "receipt emails delayed, oldest waited {20-90} min"
      - "{s_al} receipt queue age {s_age}"
      - "renewal mail not going out since {time}"
    fix_message:
      - "Queue receipt emails, not inline sends"
      - "{s_q_verb|cap} receipts {s_q_how}"
  - role: billing
    fix: billing/callbacks.py
    title:
      - Store notification errors
      - Elevated errors on store webhooks
      - Store billing events failing
    alert:
      - "store webhooks failing, rate above {5-30} percent"
      - "{s_al} store notifications erroring since {time}"
      - "billing events piling up, retries growing"
    fix_message:
      - "Retry store webhooks on timeout"
      - "Retry notifications that time out"
  - role: billing
    fix: billing/sent_log.py
    title:
      - Duplicate subscription receipts
      - Users got two receipts
      - Receipt emails sent twice
    alert:
      - "users got receipts twice, {3-12} reports"
      - "{s_al} duplicate receipts after a retry"
      - "same receipt mailed twice since {day}"
    fix_message:
      - "Check the sent log first"
      - "Skip receipts already sent"
  - role: data
    fix: pipeline/validate.py
    title:
      - Nightly events load failed
      - Overnight load did not finish
      - Warehouse load aborted
    alert:
      - "nightly load failed, bad event rows"
      - "{s_al} warehouse load aborted, dashboards stale"
      - "overnight load exited with errors"
    fix_message:
      - "Skip malformed event rows"
      - "Drop bad rows and continue"
  - role: data
    fix: pipeline/lock.py
    title:
      - Events load ran twice
      - Two loads overlapped last night
      - Duplicate load run detected
    alert:
      - "events load ran twice, counts doubled"
      - "{s_al} two loads overlapped, totals look off"
      - "second load start at {time}"
    fix_message:
      - "Take a lock before loading"
      - "Stop overlapping loads with a lock"
  - role: portal
    fix: portal/pagination.py
    title:
      - Web app timeouts for heavy users
      - Workout history page times out
      - History slow for long-time users
    alert:
      - "web app timeouts, p95 above {5-20}s"
      - "{s_al} workout history 504s, heavy users only"
      - "history page slow since {time}"
    fix_message:
      - "Page the workout history"
      - "Add pagination to history"
  - role: portal
    fix: portal/session.py
    title:
      - Web login errors after deploy
      - Users signed out after the release
      - Login loop on the web app
    alert:
      - "web logins failing since the release"
      - "{s_al} login loop, error rate climbing"
      - "users cannot sign in since {time}"
    fix_message:
      - "Put the session cookie domain back"
      - "Fix the session cookie domain"
  - role: infra
    fix: environments/certificates.yaml
    title:
      - Staging certificates expired
      - Push gateway certificate expired
      - Staging endpoints rejecting connections
    alert:
      - "staging certificates expired at {time}"
      - "{s_al} tls errors on staging, no renewal"
      - "push gateway certificate expired, no warning"
    fix_message:
      - "Renew certificates, warn 14 days ahead"
      - "Renew expired certificates"
  - role: infra
    fix: alerts.yaml
    title:
      - Alerts not reaching on-call
      - Sync alerts not paging
      - Production alerts firing, nobody paged
    alert:
      - "sync alerts firing, nobody paged"
      - "{s_al} pager got nothing overnight"
      - "missed the {time} alert, found by chance"
    fix_message:
      - "Route production alerts to the pager"
      - "Restore the pager route"
