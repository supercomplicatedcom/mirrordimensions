issues:
  billing:
    - labels: [bug]
      let:
        spec: ['{cl_specialty}']
        payer: ['{cl_payer}']
        code: ['{cl_reject}']
        path: ['{b_cb_path}']
      title:
        - '{spec|cap} claims rejected for {code}'
        - '{payer|cap} bounces claims with {code}'
        - Why do {spec} claims keep getting rejected?
        - Rejections up for {payer}, {code}
        - 'Clearinghouse reports {code} on {spec} claims'
        - '{spec|cap} claims fail the scrubber over {code}'
      body:
        -   - '{b_raised}, {b_scope}.'
            - '{b_raised} on {spec} claims, {b_scope}.'
        -   - Claims are built in {path}.
            - The 837 file comes from {path}.
        -   - The payer returns {code}.
            - Rejection reports show {code}.
        -   - Staff rework them {cl_hand}.
            - The billing office fixes them {cl_hand}.
        -   - '{b_urgent}'
            - '{b_urgent} {b_offer}'
      comments:
        - '{b_cm_repro} with a {spec} claim for {payer}.'
        - '{b_cm_check}, {path} may drop the field.'
        - The scrubber rule for {code} needs work.
        - '{b_cm_later}'
    - labels: [bug]
      let:
        site: ['{cl_site}']
        path: ['{b_money_path}']
      title:
        - Check-in copay missing on the {b_doc}
        - Copays posted twice at {site}
        - Copay at {site} does not match the {b_doc}
        - Front desk copay shows as unapplied
        - Patients billed for a copay {cl_alreadypaid}
        - Check-in payments at {site} post to the wrong visit
      body:
        -   - '{b_raised}, {b_scope}.'
            - The front desk at {site} reported it.
        -   - '{cl_lead} copays post in {path}.'
            - The copay is matched in {path}.
        -   - A payment {cl_early} is not linked.
            - Early payments do not link {cl_tovisit}.
        -   - '{cl_lead} patients get a balance reminder anyway.'
            - Statements go out {cl_oldbal}.
        -   - '{b_urgent}'
      comments:
        - '{b_cm_repro} {b_cm_stage}.'
        - Matching by visit id would help.
        - '{b_cm_later}'
    - labels: [bug, needs-decision]
      let:
        spec: ['{cl_specialty}']
        thing: ['an E/M level', 'a modifier 25', 'a procedure code']
      title:
        - Charge entry accepts {thing} that coding would flag
        - '{spec|cap} superbills missing {thing}'
        - No edit for {thing} on {spec} charges
        - Coders fix {thing} after the claim is built
        - Who owns the rule for {thing}?
        - Charge capture drops {thing} for {spec}
      body:
        -   - '{b_raised}, {b_scope}.'
        -   - The charge screen has {cl_nofield}.
            - Nothing blocks a save without it.
        -   - '{cl_lead} the coding team corrects it {cl_hand}.'
            - Coders catch it only after submission.
        -   - '{cl_lead} denials follow within {2-6} weeks.'
        -   - '{b_g_blocked}'
      comments:
        - '{b_cm_ask_who}'
        - A hard stop may annoy {b_who}.
        - '{b_cm_plan}'
    - labels: [bug]
      let:
        payer: ['{cl_payer}']
        doc: ['{b_doc}']
      title:
        - '{doc|cap}s sent {cl_pending}'
        - Patients get a bill before {payer} pays
        - Statement timing ignores the remittance
        - Secondary insurance not billed before the {doc}
        - '{doc|cap} goes out {cl_pending}'
        - Patient balance wrong after {payer} pays late
      body:
        -   - '{b_raised}, {b_scope}.'
        -   - '{cl_lead} statements run on a fixed day.'
            - The statement job runs weekly.
        -   - '{cl_lead} it does not wait for {cl_remit}.'
            - Pending claims are not excluded.
        -   - '{cl_lead} patients call the front desk upset.'
            - Front desk fields the calls.
        -   - '{b_who|cap} decides these {b_nd_b}.'
      comments:
        - A hold flag per claim {cl_might}.
        - '{b_cm_repro} {b_cm_stage}.'
        - '{b_cm_later}'
    - labels: [bug, data-quality]
      let:
        thing: ['credentialing dates', 'enrollment dates', 'provider numbers']
        payer: ['{cl_payer}']
      title:
        - Wrong {thing} cause denials from {payer}
        - Claims use old {thing} for new physicians
        - Rendering provider {thing} not synced
        - Denials for a physician {cl_justjoined}
        - '{thing|cap} stored in two places'
      body:
        -   - '{b_raised}, {b_scope}.'
        -   - '{cl_lead} the provider record is copied once.'
            - New physicians are added by hand.
        -   - '{cl_lead} credentialing changes do not {cl_flow}.'
            - The billing copy is never refreshed.
        -   - '{cl_lead} claims go out {cl_stale}.'
      comments:
        - '{b_cm_ask_who}'
        - Credentialing keeps its own tracker.
        - '{b_cm_plan}'
  portal:
    - labels: [bug]
      let:
        when: ['{cl_tz}']
        site: ['{cl_site}']
        thing: ['reminder texts', 'reminder emails']
      title:
        - Appointment {thing} sent with {when}
        - Patients get {thing} twice
        - '{thing|cap} arrive after the visit'
        - Reminder shows {when}
        - No reminder sent for {cl_sameday}
        - Reminders at {site} skip the language setting
      body:
        -   - '{b_pscope}.'
        -   - The reminder job runs {cl_clock}.
            - Times come from the server zone.
        -   - '{cl_zones|cap} share one job.'
        -   - '{cl_lead} patients show up {cl_late2}.'
            - No-shows went up at {cl_site}.
      comments:
        - '{b_cm_repro} with a patient in {b_region}.'
        - '{b_cm_check}, the zone is stored per site.'
        - '{b_cm_cb}'
    - labels: [bug]
      let:
        spec: ['{cl_specialty}']
        site: ['{cl_site}']
      title:
        - Online scheduling shows open slots {cl_onleave}
        - '{spec|cap} slots appear at {site} but no one is there'
        - Booking page offers {cl_blocked}
        - Patients book {spec} visits that get cancelled
        - Online slots ignore {cl_block} at {site}
        - Double booking from the patient portal
      body:
        -   - '{b_raised}, {b_scope}.'
        -   - Slots are cached for {2-15} minutes.
            - The cache lives {2-15} minutes.
        -   - '{cl_lead} leave and blocks are not applied.'
            - Provider leave comes from another table.
        -   - '{cl_lead} the front desk calls patients {cl_move}.'
        -   - '{b_urgent}'
      comments:
        - '{b_cm_clr2} {b_cm_cb}'
        - Needs a short TTL, or events.
        - '{b_cm_later}'
    - labels: [bug]
      let:
        thing: ['an insurance card photo', 'a driver license photo', 'a signed consent']
        browser: ['{b_browser}']
      title:
        - Uploading {thing} fails in {browser}
        - Intake form loses answers {cl_afterup}
        - Pre-visit forms do not {cl_save}
        - '{thing|cap} upload ends with a blank page'
        - Patients cannot finish intake {cl_beforevisit}
      body:
        -   - '{b_pscope}.'
        -   - Large photos time out.
            - Phones send large files.
        -   - '{cl_lead} answers are lost after the error.'
        -   - '{cl_lead} the front desk collects them again.'
      comments:
        - '{b_cm_repro} on an older phone.'
        - Resizing on the device would help.
        - '{b_cm_later}'
    - labels: [enhancement]
      let:
        thing: ['a telehealth visit', 'a video link']
      title:
        - Video links for {thing} expire too early
        - Telehealth link opens the wrong room
        - Patients cannot rejoin {thing}
        - Waiting room for {thing} never fills
      body:
        -   - '{b_pscope}.'
        -   - '{cl_lead} the link lifetime is short.'
        -   - '{cl_lead} late patients get an error.'
        -   - '{cl_lead} clinicians resend links by hand.'
      comments:
        - '{b_cm_tok} {b_cm_tok2}'
        - '{b_cm_plan}'
  docs:
    - labels: [docs, bug]
      let:
        step: ['printing the day sheet', 'switching to paper charts', 'checking eligibility by phone', 'reconciling the drawer']
        page: ['the downtime guide', 'the front desk runbook', 'the check-in page']
      title:
        - '{page|cap} is missing a step: {step}'
        - '{page|cap} skips {step}'
        - Downtime guide does not cover {step}
        - Add {step} to {page}
        - 'Docs: {page} out of date after the upgrade'
      body:
        -   - Staff at {cl_site} asked about it.
            - Found during a drill at {cl_site}.
        -   - The page still describes {cl_old}.
            - It was written {cl_forold}.
        -   - '{cl_lead} nobody knows who owns it.'
        -   - '{cl_lead} a short ordered list would do.'
      comments:
        - '{b_cm_docs}'
        - Practice managers should read it first.
        - '{b_cm_up} {b_cm_read2}'
    - labels: [docs, security]
      let:
        thing: ['consent to text', 'release of information', 'minimum necessary access', 'break the glass reviews']
      title:
        - Write down how we handle {thing}
        - Handbook never explains {thing}
        - Where is {thing} documented?
        - Document {thing} for new staff
        - Privacy asks for a page on {thing}
      body:
        -   - Compliance asked, ahead of {cl_audit}.
            - '{cl_audit|cap} is coming, no page yet.'
        -   - '{cl_lead} only {person} knows the steps.'
            - The steps live in old emails.
        -   - '{cl_lead} a page with owners would do.'
      comments:
        - '{b_dc_e}'
        - Privacy should review the wording.
        - '{b_cm_draft} {day}.'
  data:
    - labels: [bug, data-quality]
      let:
        measure: ['no-show rate', 'visits per provider', 'wait time', 'third next available']
        site: ['{cl_site}']
      title:
        - '{measure|cap} at {site} does not match the EHR'
        - Dashboard shows another {measure}
        - '{measure|cap} off by {2-9} percent'
        - Definition of {measure} differs by clinic
        - Why is {measure} different in the warehouse?
      body:
        -   - Practice operations asked, ahead of {cl_audit}.
        -   - '{cl_lead} our load uses its own definition.'
            - The query is {cl_old}.
        -   - Cancellations are counted differently.
            - Walk ins are handled differently.
        -   - '{cl_lead} we need one agreed definition.'
      comments:
        - '{b_cm_hand}'
        - Operations reports it to the board.
        - '{b_cm_ask_who}'
    - labels: [bug, data-quality]
      let:
        thing: ['duplicate patients', 'merged charts', 'unlinked referrals']
        table: ['{p_table}']
      title:
        - '{thing|cap} in the warehouse'
        - Merged charts still split in {table}
        - Counts of {table} off after a chart merge
        - '{thing|cap} after a site was added'
        - Referral counts double after a merge
      body:
