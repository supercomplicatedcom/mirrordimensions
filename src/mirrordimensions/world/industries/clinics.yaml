# Clinics and physician groups: extends the general profile (decision 0028). Templates, never whole sentences (0029).
extends: general
slug: clinics
name: Clinics and physician groups
group: Health and life sciences
aliases:
  - clinic
  - physician practice
  - medical group
  - ambulatory care
  - outpatient clinics
  - urgent care
description: A multi-site physician group that sees patients in clinics, bills payers and patients, and runs scheduling, charting and referral systems.
subscriptions: false  # leaves out the general themes about proration, dunning and payment retries
name_suffixes:
  - Medical Group
  - Family Practice
  - Physicians
  - Primary Care
  - Health Partners
  - Clinics
