    - github
    - slack
    - microsoft 365
    - sap s/4hana cloud
    - esri arcgis online
    - honeywell forge
    - samsara
    - servicenow
  common:
    - okta
    - pagerduty
    - datadog
    - snowflake
    - ptc thingworx
