# SPDX-License-Identifier: Apache-2.0
# Mining and metals: extends the general profile (decision 0028). Templates, never whole sentences (0029).
extends: general
slug: mining-metals
name: Mining and metals
group: Industry and infrastructure
aliases:
  - mining
  - metals
  - minerals
  - quarrying
  - metals and mining
description: A mining company that digs, processes and ships ore and concentrate, and bills smelters, refiners and traders on assay and price terms.
subscriptions: false  # leaves out the general themes about proration, dunning and payment retries
name_suffixes:
  - Mining
  - Metals
  - Resources
  - Minerals
  - Copper
  - Gold
invoice_items:
  - Concentrate shipment
  - Treatment charge
organization:
  head: Head of Technology
  it_admin: Systems Administrator
  teams:
    platform:
      department: Technology
      title: Platform Engineer
    billing:
      department: Commercial Systems
      title: Commercial Systems Engineer
    data:
      department: Mine Data and Analytics
      title: Data Engineer
    support:
      department: Commercial Support
      title: Support Specialist
    product:
      department: Digital Mining
      title: Product Manager
    operations:
      department: Operations Technology
      title: Operations Analyst
names:
  repos:
    billing-service: [billing-service, concentrate-billing, settlement-service, commercial-billing]
    platform-docs: [platform-docs, tech-handbook, site-runbooks, platform-handbook]
    data-pipeline: [data-pipeline, assay-loads, mine-etl, production-warehouse]
    infra-config: [infra-config, site-network-config, environments, platform-config]
    customer-portal: [customer-portal, buyer-portal, shipment-portal, offtake-portal]
    ops-scripts: [ops-scripts, site-scripts, legacy-scripts, weighbridge-scripts]
  channels:
    engineering: [engineering, dev, tech-chat]
    incidents: [incidents, site-alerts, outages]
    support: [support, commercial-support, buyer-support]
    data-team: [data-team, mine-data, assay-data]
    billing-team: [billing-team, settlements, commercial-systems]
