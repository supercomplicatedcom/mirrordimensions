# Gitleaks' default rules, plus two exceptions, fake by design: the golden synthetic world's
# planted canary credentials (they exist to be leaked and traced), and the world import
# fixtures' planted secrets (they exist to prove import never keeps them; decision 0025).
[extend]
useDefault = true

[allowlist]
description = "Synthetic canaries in the golden world and the import fixtures"
paths = ['''tests/golden/world-[0-9]+\.json''', '''tests/fixtures/import/[^/]+''']
