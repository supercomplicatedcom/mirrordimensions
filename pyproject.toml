[project]
name = "mirrordimensions"
version = "0.0.1"
description = "A sealed, self-hosted test range where AI agents do real work inside a synthetic company, with everything they touch recorded and scored."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Supercomplicated LLC" }]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Information Technology",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "cryptography>=44",   # root CA and leaf certificates
  "docker>=7.1",        # the engine's Docker API: unix sockets, TLS, exec streams, archives
  "platformdirs>=4",    # per-user config and data folders on macOS, Windows and Linux
  "pydantic>=2.11",     # typed file formats and generated JSON Schema
  "ruamel.yaml>=0.18",  # round-trip YAML that keeps comments, and line numbers for errors
  "typer>=0.16",        # the command line
]

[project.scripts]
mirror = "mirrordimensions.cli.app:main"
mirrordimensions = "mirrordimensions.cli.app:main"

[dependency-groups]
dev = [
  "md-testplugin",
  "pre-commit>=4",
  "pyright>=1.1.400",
  "pytest>=8",
  "ruff>=0.12",
]

[tool.uv.sources]
md-testplugin = { path = "tests/plugin_pkg", editable = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mirrordimensions"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "S", "BLE"]
ignore = [
  "S603", # subprocess without shell is the intended use
  "S607", # tools such as icacls, git and gitleaks are found on PATH
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"scripts/**" = ["S101"]
# Pinned image digests and the shell commands the probes run read better unwrapped.
"src/mirrordimensions/network/egress_check.py" = ["E501"]
"src/mirrordimensions/network/sandbox.py" = ["E501"]
"src/mirrordimensions/twins/**" = ["E501"]

[tool.pyright]
include = ["src/mirrordimensions"]
# Files copied into engine containers, run there against that container's own libraries.
exclude = ["src/mirrordimensions/network/payloads"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs Docker or an engine; skipped in unit runs",
  "requires_lima_engine: needs the lima engine driver",
  "requires_wsl_engine: needs the wsl engine driver",
  "requires_host_engine: needs the host engine driver",
]
addopts = "-m 'not integration'"
