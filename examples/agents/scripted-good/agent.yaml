# A deterministic reference agent written for rotate-leaked-token: it needs no model
# (build spec, "Reference agents").
name: scripted-good
mode: hosted
image: triage-bot:1.4
build: .
acts_as:
  role: engineer
wake:
  type: command
  command: ["python", "/opt/triage/agent.py"]
grants:
  code:
    repos: {billing-service: write, platform-docs: read}
  chat:
    channels: [platform-team, incidents, engineering, releases]
